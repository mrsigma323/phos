plugins { id 'com.android.application' }

android {
    namespace 'com.phos.biblia'
    compileSdk 36
    defaultConfig {
        applicationId 'com.phos.biblia'
        minSdk 24
        targetSdk 36
        versionCode 3
        versionName '1.0.2'
    }
    signingConfigs {
        upload {
            def ks = System.getenv('PHOS_UPLOAD_KEYSTORE')
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv('PHOS_UPLOAD_STORE_PASS')
                keyAlias System.getenv('PHOS_UPLOAD_KEY_ALIAS')
                keyPassword System.getenv('PHOS_UPLOAD_KEY_PASS')
            }
        }
    }
    buildTypes {
        debug {
            applicationIdSuffix '.prueba'
            versionNameSuffix '-prueba'
        }
        release {
            minifyEnabled false
            if (System.getenv('PHOS_UPLOAD_KEYSTORE')) signingConfig signingConfigs.upload
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.android.billingclient:billing:8.3.0'
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.credentials:credentials:1.5.0'
    implementation 'androidx.credentials:credentials-play-services-auth:1.5.0'
    implementation 'com.google.android.libraries.identity.googleid:googleid:1.1.1'
}
