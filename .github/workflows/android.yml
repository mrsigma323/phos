name: App Android (Google Play)
on:
  push:
    branches: [main, app-google-play]
    paths: ['android/**', 'data/biblia/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.14.3' }
      - name: Textos bíblicos dentro de la app
        run: mkdir -p android/app/src/main/assets/www/data && cp -r data/biblia/* android/app/src/main/assets/www/data/
      - name: Clave de subida (si está configurada)
        env: { KS: '${{ secrets.PHOS_UPLOAD_KEYSTORE_B64 }}' }
        run: |
          if [ -n "$KS" ]; then echo "$KS" | base64 -d > "$RUNNER_TEMP/upload.jks"; echo "PHOS_UPLOAD_KEYSTORE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"; fi
      - name: Compilar
        working-directory: android
        env:
          PHOS_UPLOAD_STORE_PASS: ${{ secrets.PHOS_UPLOAD_STORE_PASS }}
          PHOS_UPLOAD_KEY_ALIAS: ${{ secrets.PHOS_UPLOAD_KEY_ALIAS }}
          PHOS_UPLOAD_KEY_PASS: ${{ secrets.PHOS_UPLOAD_KEY_PASS }}
        run: gradle --no-daemon assembleDebug bundleRelease
      - uses: actions/upload-artifact@v4
        with: { name: phos-apk-prueba, path: android/app/build/outputs/apk/debug/*.apk }
      - uses: actions/upload-artifact@v4
        with: { name: phos-aab-google-play, path: android/app/build/outputs/bundle/release/*.aab }
      - name: Guardar la APK de prueba en la rama «apk-prueba» (para poder pasarla por el chat)
        run: |
          APK=$(ls android/app/build/outputs/apk/debug/*.apk | head -1)
          mkdir /tmp/apkbranch && cp "$APK" /tmp/apkbranch/phos-prueba.apk && cd /tmp/apkbranch
          git init -q -b apk-prueba && git config user.name "github-actions" && git config user.email "actions@github.com"
          git add phos-prueba.apk && git commit -qm "APK de prueba ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" apk-prueba
