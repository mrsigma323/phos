name: Publicar en SiteGround
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency: deploy
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Comprobar credenciales
        id: chk
        env:
          K: ${{ secrets.SG_KEY }}
        run: |
          if [ -z "$K" ]; then echo "Faltan los secretos de SiteGround: no se publica."; echo "ok=0" >> $GITHUB_OUTPUT; else echo "ok=1" >> $GITHUB_OUTPUT; fi
      - name: Preparar la clave SSH
        if: steps.chk.outputs.ok == '1'
        env:
          SG_KEY: ${{ secrets.SG_KEY }}
          SG_PASS: ${{ secrets.SG_PASS }}
          SG_HOST: ${{ secrets.SG_HOST }}
          SG_PORT: ${{ secrets.SG_PORT }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SG_KEY" | tr -d '\r' > ~/.ssh/sg && chmod 600 ~/.ssh/sg
          if [ -n "$SG_PASS" ]; then
            P2=$(printf '%s' "$SG_PASS" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
            ssh-keygen -p -P "$P2" -N "" -f ~/.ssh/sg >/dev/null 2>&1 || ssh-keygen -p -P "$SG_PASS" -N "" -f ~/.ssh/sg >/dev/null 2>&1 || { echo "::error::La contraseña de la clave (SG_PASS) no coincide con la clave privada (SG_KEY)."; exit 1; }
          fi
          ssh-keyscan -p "${SG_PORT:-18765}" "$SG_HOST" >> ~/.ssh/known_hosts 2>/dev/null
      - name: Subir la web
        if: steps.chk.outputs.ok == '1'
        env:
          SG_HOST: ${{ secrets.SG_HOST }}
          SG_USER: ${{ secrets.SG_USER }}
          SG_PORT: ${{ secrets.SG_PORT }}
          SG_DOMAIN: phosbiblias.com
          SITE_USER: ${{ secrets.SITE_USER }}
          SITE_PASS: ${{ secrets.SITE_PASS }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASS: ${{ secrets.DB_PASS }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
        run: |
          SSH="ssh -i ~/.ssh/sg -p ${SG_PORT:-18765}"
          trim(){ printf '%s' "$1" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//'; }
          SITE_USER=$(trim "$SITE_USER"); SITE_PASS=$(trim "$SITE_PASS")
          if [ -n "$SITE_PASS" ] && [ ! -f .web-publica ]; then
            echo "Usuario: ${#SITE_USER} caracteres. Contraseña: ${#SITE_PASS} caracteres."
            H=$($SSH "$SG_USER@$SG_HOST" 'echo $HOME')
            PW="$H/www/$SG_DOMAIN/.htpasswd"
            printf '%s:%s\n' "${SITE_USER:-phos}" "$(openssl passwd -apr1 "$SITE_PASS")" | $SSH "$SG_USER@$SG_HOST" "cat > www/$SG_DOMAIN/.htpasswd && chmod 644 www/$SG_DOMAIN/.htpasswd"
            { printf '# Web privada mientras se prepara\nAuthType Basic\nAuthName "Phos (en preparacion)"\nAuthUserFile "%s"\nRequire valid-user\n<IfModule mod_headers.c>\n  Header set X-Robots-Tag "noindex, nofollow"\n</IfModule>\n\n' "$PW"; cat .htaccess; } > .htaccess.new && mv .htaccess.new .htaccess
            echo "Modo privado: se pide usuario y contraseña."
          fi
          # Configuración de las cuentas (fuera de public_html, nunca accesible desde la web)
          DB_NAME=$(trim "$DB_NAME"); DB_USER=$(trim "$DB_USER"); DB_PASS=$(trim "$DB_PASS"); MAIL_FROM=$(trim "$MAIL_FROM")
          if [ -n "$DB_NAME" ] && [ -n "$DB_USER" ] && [ -n "$DB_PASS" ]; then
            b64(){ printf '%s' "$1" | base64 -w0; }
            DSN="mysql:host=localhost;dbname=$DB_NAME;charset=utf8mb4"
            printf "<?php\nreturn ['dsn'=>base64_decode('%s'),'user'=>base64_decode('%s'),'pass'=>base64_decode('%s'),'mail_from'=>base64_decode('%s'),'base'=>'https://%s'];\n" \
              "$(b64 "$DSN")" "$(b64 "$DB_USER")" "$(b64 "$DB_PASS")" "$(b64 "${MAIL_FROM:-hola@$SG_DOMAIN}")" "$SG_DOMAIN" \
              | $SSH "$SG_USER@$SG_HOST" "umask 077; cat > www/$SG_DOMAIN/phos-config.php"
            echo "Cuentas: configuración actualizada."
          else
            echo "Cuentas: faltan los secretos DB_NAME, DB_USER y DB_PASS (las cuentas quedan desactivadas)."
          fi
          rsync -rltz --exclude '.git*' --exclude 'README.md' \
            -e "ssh -i ~/.ssh/sg -p ${SG_PORT:-18765}" \
            ./ "$SG_USER@$SG_HOST:www/$SG_DOMAIN/public_html/"
          echo "Publicado en https://$SG_DOMAIN"
          if [ -n "$DB_NAME" ] && [ -n "$DB_USER" ] && [ -n "$DB_PASS" ]; then
            $SSH "$SG_USER@$SG_HOST" "cd www/$SG_DOMAIN/public_html && PHOS_CONFIG=../phos-config.php php -r 'require \"api/_lib/boot.php\"; \$p=db(); \$n=\$p->query(\"SELECT COUNT(*) FROM users\")->fetchColumn(); echo \"Cuentas: base de datos conectada y tablas listas (usuarios: \$n).\n\";'" \
              || echo "::error::Cuentas: no se ha podido conectar con la base de datos. Revisa DB_NAME, DB_USER y DB_PASS, y que el usuario esté asignado a la base de datos."
          fi
