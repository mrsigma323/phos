 fidèles défunts","Saint Martin de Tours","Immaculée Conception","Notre-Dame de Guadalupe","Saint Jean, apôtre et évangéliste","Saint Barthélemy apôtre","Fête de la Réformation"],"sn":["Triode","Grand Carême","Semaine sainte","Temps pascal","Temps de la Pentecôte","Jeûne des Apôtres","Jeûne de la Dormition","Jeûne de la Nativité","Fêtes de la Nativité","Temps après la Pentecôte","Avent","Temps de Noël","Temps ordinaire","Carême","Triduum pascal","Temps pascal","Temps de l’Épiphanie","Temps après la Pentecôte"],"snote":["Le Triode commence : trois semaines de préparation au Grand Carême, avec les paraboles du publicain et du fils prodigue.","Pendant le Grand Carême, on dit en semaine la prière de saint Éphrem, et le mercredi et le vendredi on célèbre la liturgie des Présanctifiés.","Semaine sainte : les offices suivent le Christ jour après jour jusqu’à la Croix et la Résurrection.","Temps pascal : les fidèles se saluent par « Christ est ressuscité ! — En vérité il est ressuscité ! »","Après l’Ascension, l’Église se prépare à recevoir l’Esprit Saint à la Pentecôte.","Jeûne des Apôtres : préparation à la fête des saints Pierre et Paul, le 29 juin.","Jeûne de la Dormition : beaucoup de paroisses chantent le soir la Paraclisis à la Mère de Dieu.","Jeûne de la Nativité : quarante jours de préparation à la Nativité du Christ.","Jours de fête entre Noël et la Théophanie : on ne jeûne pas.","Chaque dimanche est une petite Pâque : la Divine Liturgie est le cœur de la semaine.","Avent : chaque dimanche, on allume une bougie de plus de la couronne en attendant Noël.","Temps de Noël : on célèbre que Dieu s’est fait homme ; temps de joie et de famille.","Temps ordinaire : le dimanche, jour du Seigneur, est le cœur de la semaine.","Carême : quarante jours de prière, de jeûne et d’aumône ; beaucoup de paroisses prient le chemin de croix le vendredi.","Triduum pascal : Jeudi saint, Vendredi saint et Veillée pascale, le cœur de l’année chrétienne.","Temps pascal : cinquante jours de joie pour la Résurrection, jusqu’à la Pentecôte.","Temps de l’Épiphanie : le Christ se manifeste comme lumière de toutes les nations.","Temps après la Pentecôte : l’Église vit au quotidien, guidée par l’Esprit Saint."],"ft":["Pas de jeûne aujourd’hui : on peut manger de tout.","Jeûne strict : ni viande, ni laitages, ni œufs, ni poisson, ni huile, ni vin.","Jeûne avec huile et vin : ni viande, ni laitages, ni œufs, ni poisson.","Jeûne avec poisson : poisson, huile et vin permis ; ni viande, ni laitages, ni œufs.","Semaine des laitages : pas de viande ; laitages, œufs et poisson permis.","Vendredi saint : le jour de jeûne le plus strict de l’année ; beaucoup de fidèles ne mangent rien avant le soir.","Jeûne et abstinence : un repas principal et deux plus légers (de 18 à 59 ans) et pas de viande (dès 14 ans).","Abstinence de viande (dès 14 ans), comme tous les vendredis de Carême.","Jour de pénitence : abstinence de viande ou autre pénitence fixée par la conférence des évêques, comme une œuvre de charité.","Aujourd’hui est une solennité : pas d’abstinence, bien que ce soit vendredi.","Aujourd’hui, ni jeûne ni abstinence obligatoires.","Les Églises protestantes n’ont pas de jeûne obligatoire : le jeûne est volontaire et dans le secret (Mt 6,16-18).","Pendant le Carême, beaucoup d’Églises invitent à jeûner ou à renoncer volontairement à quelque chose.","Vendredi saint : beaucoup de chrétiens le vivent dans le jeûne et la prière."],"prn":["Roi céleste","Trisagion","Prière de Jésus","Lumière joyeuse (Phos hilaron)","Prière de saint Éphrem","Je vous salue, Marie","Angélus","Sous l’abri de ta miséricorde","Cantique de Syméon","Magnificat","Notre Père","Psaume"],"prt":["Roi céleste, Consolateur, Esprit de vérité, toi qui es partout présent et qui emplis tout, Trésor des biens et Donateur de vie, viens et demeure en nous, purifie-nous de toute souillure et sauve nos âmes, toi qui es bonté.","Saint Dieu, Saint Fort, Saint Immortel, aie pitié de nous. (trois fois) Gloire au Père, et au Fils, et au Saint-Esprit, maintenant et toujours et aux siècles des siècles. Amen.","Seigneur Jésus-Christ, Fils de Dieu, aie pitié de moi, pécheur.","Lumière joyeuse de la sainte gloire du Père immortel, céleste, saint et bienheureux, ô Jésus-Christ ! Parvenus au coucher du soleil, voyant la lumière du soir, nous chantons le Père, le Fils et le Saint-Esprit, Dieu. Tu es digne en tout temps d’être chanté par des voix saintes, ô Fils de Dieu qui donnes la vie : c’est pourquoi le monde te glorifie.","Seigneur et Maître de ma vie, ne m’abandonne pas à l’esprit d’oisiveté, de découragement, de domination et de vaines paroles. Accorde plutôt à ton serviteur un esprit de chasteté, d’humilité, de patience et d’amour. Oui, Seigneur et Roi, donne-moi de voir mes fautes et de ne pas juger mon frère, car tu es béni aux siècles des siècles. Amen.","Je vous salue, Marie, pleine de grâce ; le Seigneur est avec vous. Vous êtes bénie entre toutes les femmes, et Jésus, le fruit de vos entrailles, est béni. Sainte Marie, Mère de Dieu, priez pour nous, pauvres pécheurs, maintenant et à l’heure de notre mort. Amen.","L’ange du Seigneur apporta l’annonce à Marie, et elle conçut du Saint-Esprit. — Je vous salue, Marie… — Voici la servante du Seigneur : qu’il me soit fait selon votre parole. — Je vous salue, Marie… — Et le Verbe s’est fait chair, et il a habité parmi nous. — Je vous salue, Marie…","Sous l’abri de ta miséricorde, nous nous réfugions, sainte Mère de Dieu ; ne méprise pas nos prières dans le besoin, mais délivre-nous de tous les dangers, ô Vierge glorieuse et bénie."],"ui":["Aujourd’hui","Temps liturgique","Aujourd’hui, on célèbre","Pas de grande fête aujourd’hui.","Jeûne du jour","Prière pour ce moment","Prochaines fêtes","dans {n} jours","demain","Bon à savoir","À titre indicatif : chaque paroisse peut avoir sa règle, et les malades, les femmes enceintes, les enfants et les personnes âgées sont dispensés. Demandez à votre prêtre ou à votre père spirituel.","Couleur liturgique","Matin","Midi","Après-midi","Soir","Nuit","Pendant le Carême, on prie aussi :","Nouveau calendrier","Calendrier julien","Les Églises russe, serbe, géorgienne et de Jérusalem suivent le calendrier julien : leurs fêtes fixes tombent 13 jours plus tard.","Avant de communier, on garde une heure de jeûne eucharistique.","violet","blanc","vert","rouge","Aujourd’hui"]},"it":{"cn":["Domenica del Pubblicano e del Fariseo","Domenica del Figliol prodigo","Domenica del Giudizio finale","Domenica del Perdono","Lunedì puro: inizia la Grande Quaresima","Domenica dell’Ortodossia","Domenica di san Gregorio Palamas","Domenica della Venerazione della Croce","Domenica di san Giovanni Climaco","Domenica di santa Maria Egiziaca","Sabato di Lazzaro","Giovedì santo","Venerdì santo","Sabato santo","Domenica di Tommaso","Domenica delle Mirofore","Mezza Pentecoste","Lunedì dello Spirito Santo","Domenica di Tutti i Santi","Circoncisione del Signore e san Basilio Magno","Vigilia della Teofania","Sinassi di san Giovanni Battista","Sant’Antonio abate","Tre Santi Gerarchi","San Giorgio","San Marco evangelista","Santi Cirillo e Metodio","Santi Costantino ed Elena","Natività di san Giovanni Battista","Santi Pietro e Paolo","Santo profeta Elia","Santa Maria Maddalena","Decollazione di san Giovanni Battista","Capodanno ecclesiastico","San Giovanni il Teologo","Protezione della Madre di Dio","San Tommaso apostolo","San Luca evangelista","San Demetrio","Sinassi degli Arcangeli Michele e Gabriele","San Giovanni Crisostomo","San Matteo evangelista","Santa Caterina d’Alessandria","Sant’Andrea apostolo","Santa Barbara","San Nicola","San Spiridione","Sinassi della Madre di Dio","Santo Stefano protomartire","Santi Innocenti","Mercoledì delle Ceneri","Domenica di Pasqua","Domenica della Divina Misericordia","Santissima Trinità","Corpus Domini","Sacro Cuore di Gesù","Prima domenica di Avvento","Cristo Re dell’Universo","Santa Famiglia","Battesimo del Signore","Maria Santissima Madre di Dio","Epifania del Signore","Conversione di san Paolo","San Tommaso d’Aquino","Presentazione del Signore","Cattedra di san Pietro","San Patrizio","San Giuseppe","Visitazione della Beata Vergine Maria","San Benedetto","San Giacomo apostolo","Sant’Ignazio di Loyola","Assunzione della Beata Vergine Maria","Sant’Agostino","Martirio di san Giovanni Battista","Natività della Beata Vergine Maria","Santi Arcangeli Michele, Gabriele e Raffaele","San Francesco d’Assisi","Santa Teresa d’Avila","Tutti i Santi","Commemorazione dei fedeli defunti","San Martino di Tours","Immacolata Concezione","Nostra Signora di Guadalupe","San Giovanni apostolo ed evangelista","San Bartolomeo apostolo","Festa della Riforma"],"sn":["Triodion","Grande Quaresima","Settimana santa","Tempo pasquale","Tempo di Pentecoste","Digiuno degli Apostoli","Digiuno della Dormizione","Digiuno di Natale","Feste natalizie","Tempo dopo Pentecoste","Avvento","Tempo di Natale","Tempo ordinario","Quaresima","Triduo pasquale","Tempo di Pasqua","Tempo dell’Epifania","Tempo dopo Pentecoste"],"snote":["Inizia il Triodion: tre settimane di preparazione alla Grande Quaresima, con le parabole del pubblicano e del figliol prodigo.","Nella Grande Quaresima, nei giorni feriali si recita la preghiera di sant’Efrem, e il mercoledì e il venerdì si celebra la Liturgia dei Presantificati.","Settimana santa: gli uffici accompagnano Cristo giorno per giorno fino alla Croce e alla Risurrezione.","Tempo pasquale: i fedeli si salutano con «Cristo è risorto! — È veramente risorto!».","Dopo l’Ascensione, la Chiesa si prepara a ricevere lo Spirito Santo a Pentecoste.","Digiuno degli Apostoli: preparazione alla festa dei santi Pietro e Paolo, il 29 giugno.","Digiuno della Dormizione: molte parrocchie recitano la sera la Paraclisi alla Madre di Dio.","Digiuno di Natale: quaranta giorni di preparazione alla Natività di Cristo.","Giorni di festa tra Natale e Teofania: non si digiuna.","Ogni domenica è una piccola Pasqua: la Divina Liturgia è il cuore della settimana.","Avvento: ogni domenica si accende una candela in più della corona in attesa del Natale.","Tempo di Natale: si celebra che Dio si è fatto uomo; tempo di gioia e di famiglia.","Tempo ordinario: la domenica, giorno del Signore, è il cuore della settimana.","Quaresima: quaranta giorni di preghiera, digiuno ed elemosina; molte parrocchie pregano la Via Crucis il venerdì.","Triduo pasquale: Giovedì santo, Venerdì santo e Veglia pasquale, il cuore dell’anno cristiano.","Tempo di Pasqua: cinquanta giorni di gioia per la Risurrezione, fino a Pentecoste.","Tempo dell’Epifania: Cristo si manifesta come luce per tutte le genti.","Tempo dopo Pentecoste: la Chiesa vive il quotidiano guidata dallo Spirito Santo."],"ft":["Oggi non c’è digiuno: si può mangiare di tutto.","Digiuno stretto: niente carne, latticini, uova, pesce, olio né vino.","Digiuno con olio e vino: niente carne, latticini, uova né pesce.","Digiuno con pesce: pesce, olio e vino permessi; niente carne, latticini né uova.","Settimana dei latticini: niente carne; latticini, uova e pesce permessi.","Venerdì santo: il giorno di digiuno più stretto dell’anno; molti fedeli non mangiano fino a sera.","Digiuno e astinenza: un pasto principale e due più leggeri (dai 18 ai 59 anni) e niente carne (dai 14 anni).","Astinenza dalla carne (dai 14 anni), come tutti i venerdì di Quaresima.","Giorno penitenziale: astinenza dalla carne o altra penitenza stabilita dalla conferenza episcopale, come un’opera di carità.","Oggi è solennità: non c’è astinenza anche se è venerdì.","Oggi non ci sono digiuno né astinenza obbligatori.","Nelle chiese protestanti non ci sono digiuni obbligatori: il digiuno è volontario e nel segreto (Mt 6,16-18).","In Quaresima molte chiese invitano a digiunare o a rinunciare volontariamente a qualcosa.","Venerdì santo: molti cristiani lo vivono con digiuno e preghiera."],"prn":["Re celeste","Trisagion","Preghiera di Gesù","Luce gioiosa (Phos hilaron)","Preghiera di sant’Efrem","Ave Maria","Angelus","Sotto la tua protezione","Cantico di Simeone","Magnificat","Padre nostro","Salmo"],"prt":["Re celeste, Consolatore, Spirito di verità, che sei presente ovunque e tutto riempi, tesoro dei beni e datore di vita, vieni e dimora in noi, purificaci da ogni macchia e salva, o Buono, le nostre anime.","Santo Dio, Santo Forte, Santo Immortale, abbi pietà di noi. (tre volte) Gloria al Padre e al Figlio e allo Spirito Santo, ora e sempre e nei secoli dei secoli. Amen.","Signore Gesù Cristo, Figlio di Dio, abbi pietà di me peccatore.","Luce gioiosa della santa gloria del Padre immortale, celeste, santo e beato, o Gesù Cristo! Giunti al tramonto del sole, vedendo la luce della sera, cantiamo il Padre, il Figlio e lo Spirito Santo, Dio. Tu sei degno di essere lodato in ogni tempo da voci sante, o Figlio di Dio che dai la vita: per questo il mondo ti glorifica.","Signore e Sovrano della mia vita, non darmi uno spirito di pigrizia, di scoraggiamento, di dominio e di vane parole. Concedi invece a me, tuo servo, uno spirito di castità, di umiltà, di pazienza e di amore. Sì, Signore e Re, concedimi di vedere i miei peccati e di non giudicare mio fratello, perché tu sei benedetto nei secoli dei secoli. Amen.","Ave, o Maria, piena di grazia, il Signore è con te. Tu sei benedetta fra le donne e benedetto è il frutto del tuo seno, Gesù. Santa Maria, Madre di Dio, prega per noi peccatori, adesso e nell’ora della nostra morte. Amen.","L’angelo del Signore portò l’annuncio a Maria, ed ella concepì per opera dello Spirito Santo. — Ave, o Maria… — Eccomi, sono la serva del Signore: si compia in me la tua parola. — Ave, o Maria… — E il Verbo si fece carne e venne ad abitare in mezzo a noi. — Ave, o Maria…","Sotto la tua protezione cerchiamo rifugio, santa Madre di Dio: non disprezzare le suppliche di noi che siamo nella prova, e liberaci da ogni pericolo, o Vergine gloriosa e benedetta."],"ui":["Oggi","Tempo liturgico","Oggi si celebra","Oggi non c’è nessuna grande festa.","Digiuno di oggi","Preghiera per questo momento","Prossime feste","tra {n} giorni","domani","Da tenere presente","È indicativo: ogni parrocchia può avere la sua norma, e i malati, le donne incinte, i bambini e gli anziani sono dispensati. Chiedi al tuo sacerdote o al tuo padre spirituale.","Colore liturgico","Mattino","Mezzogiorno","Pomeriggio","Sera","Notte","In Quaresima si prega anche:","Calendario nuovo","Calendario giuliano","Le Chiese russa, serba, georgiana e di Gerusalemme seguono il calendario giuliano: le loro feste fisse cadono 13 giorni dopo.","Prima della Comunione si osserva un’ora di digiuno eucaristico.","viola","bianco","verde","rosso","Oggi"]},"de":{"cn":["Sonntag vom Zöllner und Pharisäer","Sonntag vom verlorenen Sohn","Sonntag vom Jüngsten Gericht","Sonntag der Vergebung","Reiner Montag: Beginn der Großen Fastenzeit","Sonntag der Orthodoxie","Sonntag des heiligen Gregor Palamas","Sonntag der Kreuzverehrung","Sonntag des heiligen Johannes Klimakos","Sonntag der heiligen Maria von Ägypten","Lazarus-Samstag","Gründonnerstag","Karfreitag","Karsamstag","Thomassonntag","Sonntag der Myrrhenträgerinnen","Mittpfingsten","Pfingstmontag (Tag des Heiligen Geistes)","Sonntag Aller Heiligen","Beschneidung des Herrn und heiliger Basilius der Große","Vorabend der Theophanie","Synaxis des heiligen Johannes des Täufers","Heiliger Antonius der Große","Drei heilige Hierarchen","Heiliger Georg","Heiliger Markus, Evangelist","Heilige Kyrill und Method","Heilige Konstantin und Helena","Geburt des heiligen Johannes des Täufers","Heilige Petrus und Paulus","Heiliger Prophet Elia","Heilige Maria Magdalena","Enthauptung des heiligen Johannes des Täufers","Kirchliches Neujahr","Heiliger Johannes der Theologe","Schutz der Gottesmutter","Heiliger Apostel Thomas","Heiliger Lukas, Evangelist","Heiliger Demetrios","Synaxis der Erzengel Michael und Gabriel","Heiliger Johannes Chrysostomos","Heiliger Matthäus, Evangelist","Heilige Katharina von Alexandrien","Heiliger Apostel Andreas","Heilige Barbara","Heiliger Nikolaus","Heiliger Spyridon","Synaxis der Gottesmutter","Heiliger Stephanus, Erzmärtyrer","Unschuldige Kinder","Aschermittwoch","Ostersonntag","Sonntag der Barmherzigkeit","Dreifaltigkeitssonntag","Fronleichnam","Heiligstes Herz Jesu","Erster Adventssonntag","Christkönigssonntag","Heilige Familie","Taufe des Herrn","Hochfest der Gottesmutter Maria","Erscheinung des Herrn (Epiphanie)","Bekehrung des heiligen Paulus","Heiliger Thomas von Aquin","Darstellung des Herrn","Kathedra Petri","Heiliger Patrick","Heiliger Josef","Mariä Heimsuchung","Heiliger Benedikt","Heiliger Apostel Jakobus","Heiliger Ignatius von Loyola","Mariä Aufnahme in den Himmel","Heiliger Augustinus","Enthauptung Johannes des Täufers","Mariä Geburt","Heilige Erzengel Michael, Gabriel und Rafael","Heiliger Franz von Assisi","Heilige Teresa von Ávila","Allerheiligen","Allerseelen","Heiliger Martin von Tours","Mariä Empfängnis","Unsere Liebe Frau von Guadalupe","Heiliger Johannes, Apostel und Evangelist","Heiliger Apostel Bartholomäus","Reformationstag"],"sn":["Triodion","Große Fastenzeit","Karwoche","Osterzeit","Pfingstzeit","Apostelfasten","Entschlafungsfasten","Weihnachtsfasten","Weihnachtsfesttage","Zeit nach Pfingsten","Advent","Weihnachtszeit","Zeit im Jahreskreis","Fastenzeit","Österliches Triduum","Osterzeit","Epiphaniaszeit","Zeit nach Pfingsten"],"snote":["Das Triodion beginnt: drei Wochen Vorbereitung auf die Große Fastenzeit mit den Gleichnissen vom Zöllner und vom verlorenen Sohn.","In der Großen Fastenzeit betet man werktags das Gebet des heiligen Ephräm, und mittwochs und freitags wird die Liturgie der Vorgeweihten Gaben gefeiert.","Karwoche: Die Gottesdienste begleiten Christus Tag für Tag bis zum Kreuz und zur Auferstehung.","Osterzeit: Die Gläubigen grüßen sich mit „Christus ist auferstanden! — Er ist wahrhaft auferstanden!“","Nach der Himmelfahrt bereitet sich die Kirche darauf vor, an Pfingsten den Heiligen Geist zu empfangen.","Apostelfasten: Vorbereitung auf das Fest der heiligen Petrus und Paulus am 29. Juni.","Entschlafungsfasten: Viele Gemeinden beten abends den Paraklisis-Gottesdienst zur Gottesmutter.","Weihnachtsfasten: vierzig Tage Vorbereitung auf die Geburt Christi.","Festtage zwischen Weihnachten und Theophanie: Es wird nicht gefastet.","Jeder Sonntag ist ein kleines Ostern: Die Göttliche Liturgie ist die Mitte der Woche.","Advent: Jeden Sonntag wird eine weitere Kerze am Kranz entzündet, während wir auf Weihnachten warten.","Weihnachtszeit: Wir feiern, dass Gott Mensch geworden ist; eine Zeit der Freude und der Familie.","Zeit im Jahreskreis: Der Sonntag, der Tag des Herrn, ist die Mitte der Woche.","Fastenzeit: vierzig Tage des Gebets, des Fastens und des Almosengebens; viele Gemeinden beten freitags den Kreuzweg.","Österliches Triduum: Gründonnerstag, Karfreitag und Osternacht, das Herz des christlichen Jahres.","Osterzeit: fünfzig Tage der Freude über die Auferstehung, bis Pfingsten.","Epiphaniaszeit: Christus offenbart sich als Licht für alle Völker.","Zeit nach Pfingsten: Die Kirche lebt ihren Alltag, geführt vom Heiligen Geist."],"ft":["Heute kein Fasten: Alle Speisen sind erlaubt.","Strenges Fasten: kein Fleisch, keine Milchprodukte, Eier, Fisch, kein Öl und kein Wein.","Fasten mit Öl und Wein: kein Fleisch, keine Milchprodukte, Eier und kein Fisch.","Fasten mit Fisch: Fisch, Öl und Wein sind erlaubt; kein Fleisch, keine Milchprodukte und Eier.","Käsewoche: kein Fleisch; Milchprodukte, Eier und Fisch sind erlaubt.","Karfreitag: der strengste Fasttag des Jahres; viele Gläubige essen bis zum Abend nichts.","Fasten und Abstinenz: eine volle Mahlzeit und zwei kleinere (von 18 bis 59 Jahren) und kein Fleisch (ab 14 Jahren).","Verzicht auf Fleisch (ab 14 Jahren), wie an allen Freitagen der Fastenzeit.","Bußtag: Verzicht auf Fleisch oder ein anderes von der Bischofskonferenz festgelegtes Bußwerk, etwa ein Werk der Nächstenliebe.","Heute ist ein Hochfest: keine Abstinenz, obwohl Freitag ist.","Heute gibt es weder verpflichtendes Fasten noch Abstinenz.","In den evangelischen Kirchen gibt es kein verpflichtendes Fasten: Fasten ist freiwillig und geschieht im Verborgenen (Mt 6,16-18).","In der Fastenzeit laden viele Kirchen ein, freiwillig zu fasten oder auf etwas zu verzichten.","Karfreitag: Viele Christen begehen ihn mit Fasten und Gebet."],"prn":["Himmlischer König","Trisagion","Jesusgebet","Freudiges Licht (Phos hilaron)","Gebet des heiligen Ephräm","Ave Maria","Angelus","Unter deinen Schutz und Schirm","Lobgesang des Simeon","Magnificat","Vaterunser","Psalm"],"prt":["Himmlischer König, Tröster, Geist der Wahrheit, der du überall gegenwärtig bist und alles erfüllst, Schatz der Güter und Spender des Lebens: Komm und wohne in uns, reinige uns von jedem Makel und rette, Gütiger, unsere Seelen.","Heiliger Gott, heiliger Starker, heiliger Unsterblicher, erbarme dich unser. (dreimal) Ehre sei dem Vater und dem Sohn und dem Heiligen Geist, jetzt und immerdar und in alle Ewigkeit. Amen.","Herr Jesus Christus, Sohn Gottes, erbarme dich meiner, des Sünders.","Freudiges Licht der heiligen Herrlichkeit des unsterblichen, himmlischen, heiligen, seligen Vaters, Jesus Christus! Da wir zum Untergang der Sonne gekommen sind und das Abendlicht schauen, besingen wir Gott, den Vater, den Sohn und den Heiligen Geist. Würdig bist du, zu allen Zeiten mit heiligen Stimmen besungen zu werden, Sohn Gottes, der du das Leben gibst; darum verherrlicht dich die Welt.","Herr und Gebieter meines Lebens, den Geist des Müßiggangs, der Verzagtheit, der Herrschsucht und der Geschwätzigkeit gib mir nicht. Den Geist der Keuschheit, der Demut, der Geduld und der Liebe aber verleihe mir, deinem Knecht. Ja, Herr und König, gib mir, meine eigenen Verfehlungen zu sehen und meinen Bruder nicht zu verurteilen, denn gesegnet bist du in alle Ewigkeit. Amen.","Gegrüßet seist du, Maria, voll der Gnade, der Herr ist mit dir. Du bist gebenedeit unter den Frauen, und gebenedeit ist die Frucht deines Leibes, Jesus. Heilige Maria, Mutter Gottes, bitte für uns Sünder jetzt und in der Stunde unseres Todes. Amen.","Der Engel des Herrn brachte Maria die Botschaft, und sie empfing vom Heiligen Geist. — Gegrüßet seist du, Maria… — Siehe, ich bin die Magd des Herrn; mir geschehe nach deinem Wort. — Gegrüßet seist du, Maria… — Und das Wort ist Fleisch geworden und hat unter uns gewohnt. — Gegrüßet seist du, Maria…","Unter deinen Schutz und Schirm fliehen wir, o heilige Gottesmutter. Verschmähe nicht unser Gebet in unseren Nöten, sondern erlöse uns jederzeit von allen Gefahren, o du glorreiche und gebenedeite Jungfrau."],"ui":["Heute","Kirchenjahr","Heute feiern wir","Heute ist kein großes Fest.","Fasten heute","Gebet für diesen Moment","Nächste Feste","in {n} Tagen","morgen","Gut zu wissen","Nur zur Orientierung: Jede Gemeinde kann ihre eigene Regel haben, und Kranke, Schwangere, Kinder und ältere Menschen sind befreit. Frag deinen Priester oder geistlichen Vater.","Liturgische Farbe","Morgen","Mittag","Nachmittag","Abend","Nacht","In der Fastenzeit betet man auch:","Neuer Kalender","Julianischer Kalender","Die russische, serbische, georgische und Jerusalemer Kirche folgen dem julianischen Kalender: Ihre festen Feste fallen 13 Tage später.","Vor der Kommunion wird eine Stunde eucharistisches Fasten eingehalten.","violett","weiß","grün","rot","Heute"]},"el":{"cn":["Κυριακή του Τελώνου και του Φαρισαίου","Κυριακή του Ασώτου","Κυριακή της Απόκρεω (της Κρίσεως)","Κυριακή της Τυρινής (της Συγχωρήσεως)","Καθαρά Δευτέρα: αρχίζει η Μεγάλη Τεσσαρακοστή","Κυριακή της Ορθοδοξίας","Κυριακή του Αγίου Γρηγορίου Παλαμά","Κυριακή της Σταυροπροσκυνήσεως","Κυριακή του Αγίου Ιωάννου της Κλίμακος","Κυριακή της Οσίας Μαρίας της Αιγυπτίας","Σάββατο του Λαζάρου","Μεγάλη Πέμπτη","Μεγάλη Παρασκευή","Μέγα Σάββατο","Κυριακή του Θωμά","Κυριακή των Μυροφόρων","Μεσοπεντηκοστή","Δευτέρα του Αγίου Πνεύματος","Κυριακή των Αγίων Πάντων","Περιτομή του Κυρίου και Μέγας Βασίλειος","Παραμονή των Θεοφανείων","Σύναξη του Αγίου Ιωάννου του Περίοδος των Χριστουγέννων","Κοινός χρόνος","Τεσσαρακοστή","Πασχαλινό Τριήμερο","Περίοδος του Πάσχα","Περίοδος των Επιφανείων","Περίοδος μετά την Πεντηκοστή"],"snote":["Αρχίζει το Τριώδιο: τρεις εβδομάδες προετοιμασίας για τη Μεγάλη Τεσσαρακοστή, με τις παραβολές του Τελώνου και του Ασώτου.","Τη Μεγάλη Τεσσαρακοστή, τις καθημερινές λέγεται η ευχή του Οσίου Εφραίμ, και κάθε Τετάρτη και Παρασκευή τελείται η Λειτουργία των Προηγιασμένων.","Μεγάλη Εβδομάδα: οι ακολουθίες συνοδεύουν τον Χριστό μέρα με τη μέρα ως τον Σταυρό και την Ανάσταση.","Περίοδος του Πάσχα: οι πιστοί χαιρετιούνται με το «Χριστὸς ἀνέστη! — Ἀληθῶς ἀνέστη!».","Μετά την Ανάληψη, η Εκκλησία προετοιμάζεται να δεχτεί το Άγιο Πνεύμα την Πεντηκοστή.","Νηστεία των Αγίων Αποστόλων: προετοιμασία για τη γιορτή των Αγίων Πέτρου και Παύλου, στις 29 Ιουνίου.","Νηστεία του Δεκαπενταυγούστου: πολλές ενορίες ψάλλουν το απόγευμα την Παράκληση στην Παναγία.","Νηστεία των Χριστουγέννων: σαράντα μέρες προετοιμασίας για τη Γέννηση του Χριστού.","Δωδεκαήμερο ανάμεσα στα Χριστούγεννα και τα Θεοφάνεια: δεν νηστεύουμε.","Κάθε Κυριακή είναι ένα μικρό Πάσχα: η Θεία Λειτουργία είναι το κέντρο της εβδομάδας.","Advent: κάθε Κυριακή ανάβει ένα ακόμη κερί του στεφανιού, όσο περιμένουμε τα Χριστούγεννα.","Περίοδος των Χριστουγέννων: γιορτάζουμε ότι ο Θεός έγινε άνθρωπος· καιρός χαράς και οικογένειας.","Κοινός χρόνος: η Κυριακή, ημέρα του Κυρίου, είναι το κέντρο της εβδομάδας.","Τεσσαρακοστή: σαράντα μέρες προσευχής, νηστείας και ελεημοσύνης· πολλές ενορίες κάνουν τον Δρόμο του Σταυρού κάθε Παρασκευή.","Πασχαλινό Τριήμερο: Μεγάλη Πέμπτη, Μεγάλη Παρασκευή και Αγρυπνία του Πάσχα, η καρδιά του χριστιανικού έτους.","Περίοδος του Πάσχα: πενήντα μέρες χαράς για την Ανάσταση, ως την Πεντηκοστή.","Περίοδος των Επιφανείων: ο Χριστός φανερώνεται ως φως για όλα τα έθνη.","Περίοδος μετά την Πεντηκοστή: η Εκκλησία ζει την καθημερινότητα με οδηγό το Άγιο Πνεύμα."],"ft":["Σήμερα δεν νηστεύουμε: επιτρέπονται όλα.","Αυστηρή νηστεία: χωρίς κρέας, γαλακτοκομικά, αυγά, ψάρι, λάδι και κρασί.","Νηστεία με λάδι και κρασί: χωρίς κρέας, γαλακτοκομικά, αυγά και ψάρι.","Νηστεία με ψάρι: επιτρέπονται ψάρι, λάδι και κρασί· χωρίς κρέας, γαλακτοκομικά και αυγά.","Εβδομάδα της Τυρινής: χωρίς κρέας· επιτρέπονται γαλακτοκομικά, αυγά και ψάρι.","Μεγάλη Παρασκευή: η αυστηρότερη ημέρα νηστείας του έτους· πολλοί πιστοί δεν τρώνε ως το βράδυ.","Νηστεία και αποχή: ένα κύριο γεύμα και δύο ελαφρύτερα (από 18 ως 59 ετών) και χωρίς κρέας (από 14 ετών).","Αποχή από το κρέας (από 14 ετών), όπως κάθε Παρασκευή της Τεσσαρακοστής.","Ημέρα μετάνοιας: αποχή από το κρέας ή άλλη πράξη μετάνοιας που ορίζει η επισκοπική διάσκεψη, όπως ένα έργο αγάπης.","Σήμερα είναι επίσημη εορτή: δεν υπάρχει αποχή, παρότι είναι Παρασκευή.","Σήμερα δεν υπάρχει υποχρεωτική νηστεία ούτε αποχή.","Στις προτεσταντικές εκκλησίες δεν υπάρχουν υποχρεωτικές νηστείες: η νηστεία είναι εθελοντική και κρυφή (Ματθ. 6,16-18).","Την Τεσσαρακοστή πολλές εκκλησίες καλούν να νηστέψουμε ή να στερηθούμε κάτι εθελοντικά.","Μεγάλη Παρασκευή: πολλοί χριστιανοί τη ζουν με νηστεία και προσευχή."],"prn":["Βασιλεῦ οὐράνιε","Τρισάγιο","Ευχή του Ιησού","Φῶς ἱλαρόν","Ευχή του Οσίου Εφραίμ","Χαῖρε, Μαρία","Angelus","Ὑπὸ τὴν σὴν εὐσπλαγχνίαν","Ωδή του Συμεών (Νῦν ἀπολύεις)","Μεγαλυνάριο της Θεοτόκου (Magnificat)","Πάτερ ἡμῶν","Ψαλμός"],"prt":["Βασιλεῦ οὐράνιε, Παράκλητε, τὸ Πνεῦμα τῆς ἀληθείας, ὁ πανταχοῦ παρὼν καὶ τὰ πάντα πληρῶν, ὁ θησαυρὸς τῶν ἀγαθῶν καὶ ζωῆς χορηγός, ἐλθὲ καὶ σκήνωσον ἐν ἡμῖν, καὶ καθάρισον ἡμᾶς ἀπὸ πάσης κηλῖδος, καὶ σῶσον, Ἀγαθέ, τὰς ψυχὰς ἡμῶν.","Ἅγιος ὁ Θεός, Ἅγιος ἰσχυρός, Ἅγιος ἀθάνατος, ἐλέησον ἡμᾶς. (τρίς) Δόξα Πατρὶ καὶ Υἱῷ καὶ Ἁγίῳ Πνεύματι, καὶ νῦν καὶ ἀεὶ καὶ εἰς τοὺς αἰῶνας τῶν αἰώνων. Ἀμήν.","Κύριε Ἰησοῦ Χριστέ, Υἱὲ τοῦ Θεοῦ, ἐλέησόν με τὸν ἁμαρτωλόν.","Φῶς ἱλαρὸν ἁγίας δόξης, ἀθανάτου Πατρός, οὐρανίου, ἁγίου, μάκαρος, Ἰησοῦ Χριστέ, ἐλθόντες ἐπὶ τὴν ἡλίου δύσιν, ἰδόντες φῶς ἑσπερινόν, ὑμνοῦμεν Πατέρα, Υἱόν, καὶ Ἅγιον Πνεῦμα, Θεόν. Ἄξιόν σε ἐν πᾶσι καιροῖς ὑμνεῖσθαι φωναῖς αἰσίαις, Υἱὲ Θεοῦ, ζωὴν ὁ διδούς· διὸ ὁ κόσμος σὲ δοξάζει.","Κύριε καὶ Δέσποτα τῆς ζωῆς μου, πνεῦμα ἀργίας, περιεργίας, φιλαρχίας καὶ ἀργολογίας μή μοι δῷς. Πνεῦμα δὲ σωφροσύνης, ταπεινοφροσύνης, ὑπομονῆς καὶ ἀγάπης χάρισαί μοι τῷ σῷ δούλῳ. Ναί, Κύριε Βασιλεῦ, δώρησαί μοι τοῦ ὁρᾶν τὰ ἐμὰ πταίσματα καὶ μὴ κατακρίνειν τὸν ἀδελφόν μου, ὅτι εὐλογητὸς εἶ εἰς τοὺς αἰῶνας τῶν αἰώνων. Ἀμήν.","Χαῖρε, Μαρία, κεχαριτωμένη, ὁ Κύριος μετὰ σοῦ. Εὐλογημένη σὺ ἐν γυναιξί, καὶ εὐλογημένος ὁ καρπὸς τῆς κοιλίας σου, Ἰησοῦς. Ἁγία Μαρία, Μήτηρ τοῦ Θεοῦ, πρέσβευε ὑπὲρ ἡμῶν τῶν ἁμαρτωλῶν, νῦν καὶ ἐν τῇ ὥρᾳ τοῦ θανάτου ἡμῶν. Ἀμήν.","Ὁ ἄγγελος Κυρίου εὐηγγελίσατο τῇ Μαρίᾳ, καὶ συνέλαβεν ἐκ Πνεύματος Ἁγίου. — Χαῖρε, Μαρία… — Ἰδοὺ ἡ δούλη Κυρίου· γένοιτό μοι κατὰ τὸ ῥῆμά σου. — Χαῖρε, Μαρία… — Καὶ ὁ Λόγος σὰρξ ἐγένετο καὶ ἐσκήνωσεν ἐν ἡμῖν. — Χαῖρε, Μαρία…","Ὑπὸ τὴν σὴν εὐσπλαγχνίαν καταφεύγομεν, Θεοτόκε. Τὰς ἡμῶν ἱκεσίας μὴ παρίδῃς ἐν περιστάσει, ἀλλ᾿ ἐκ κινδύνων λύτρωσαι ἡμᾶς, μόνη ἁγνή, μόνη εὐλογημένη."],"ui":["Σήμερα","Λειτουργική περίοδος","Σήμερα γιορτάζουμε","Σήμερα δεν υπάρχει μεγάλη εορτή.","Νηστεία σήμερα","Προσευχή για αυτή τη στιγμή","Επόμενες εορτές","σε {n} μέρες","αύριο","Καλό να ξέρετε","Είναι ενδεικτικό: κάθε ενορία μπορεί να έχει τη δική της τάξη, και οι ασθενείς, οι έγκυες, τα παιδιά και οι ηλικιωμένοι απαλλάσσονται. Ρωτήστε τον ιερέα ή τον πνευματικό σας.","Λειτουργικό χρώμα","Πρωί","Μεσημέρι","Απόγευμα","Εσπέρας","Νύχτα","Τη Μεγάλη Τεσσαρακοστή λέμε επίσης:","Νέο ημερολόγιο","Ιουλιανό ημερολόγιο","Οι Εκκλησίες της Ρωσίας, της Σερβίας, της Γεωργίας και των Ιεροσολύμων ακολουθούν το Ιουλιανό ημερολόγιο: οι ακίνητες εορτές τους πέφτουν 13 μέρες αργότερα.","Πριν από τη Θεία Κοινωνία τηρείται μία ώρα ευχαριστιακής νηστείας.","μωβ","λευκό","πράσινο","κόκκινο","Σήμερα"]},"ru":{"cn":["Неделя о мытаре и фарисее","Неделя о блудном сыне","Неделя о Страшном суде (мясопустная)","Прощёное воскресенье (сыропустная неделя)","Чистый понедельник: начало Великого поста","Неделя Тор очное зачатие","Богоматерь Гваделупская","Апостол и евангелист Иоанн","Апостол Варфоломей","День Реформации"],"sn":["Триодь (подготовка к посту)","Великий пост","Страстная седмица","Пасхальный период","Период Пятидесятницы","Петров пост","Успенский пост","Рождественский пост","Святки","Период по Пятидесятнице","Адвент","Рождественский период","Рядовое время","Великий пост","Пасхальное триденствие","Пасхальный период","Период Богоявления","Период после Пятидесятницы"],"snote":["Начинается период Триоди: три недели подготовки к Великому посту, с притчами о мытаре и фарисее и о блудном сыне.","Великим постом по будням читается молитва преподобного Ефрема Сирина, а по средам и пятницам служится Литургия Преждеосвященных Даров.","Страстная седмица: богослужения день за днём следуют за Христом к Кресту и Воскресению.","Пасхальный период: верующие приветствуют друг друга словами «Христос воскресе! — Воистину воскресе!»","После Вознесения Церковь готовится принять Святого Духа в день Пятидесятницы.","Петров пост: подготовка к празднику апостолов Петра и Павла.","Успенский пост: во многих приходах вечером служат молебен с канонами Богородице.","Рождественский пост: сорок дней подготовки к Рождеству Христову.","Святки — праздничные дни между Рождеством и Крещением: поста нет.","Каждое воскресенье — малая Пасха: Божественная литургия — сердце недели.","Адвент: каждое воскресенье на венке зажигают ещё одну свечу в ожидании Рождества.","Рождественский период: празднуем, что Бог стал человеком; время радости и семьи.","Рядовое время: воскресенье, день Господень, — сердце недели.","Великий пост: сорок дней молитвы, поста и милостыни; во многих приходах по пятницам совершают Крестный путь.","Пасхальное триденствие: Великий четверг, Страстная пятница и Пасхальное бдение — сердце христианского года.","Пасхальный период: пятьдесят дней радости о Воскресении, до Пятидесятницы.","Период Богоявления: Христос являет Себя как свет для всех народов.","Период после Пятидесятницы: Церковь живёт повседневной жизнью, ведомая Святым Духом."],"ft":["Сегодня поста нет: можно есть всё.","Строгий пост: без мяса, молочного, яиц, рыбы, растительного масла и вина.","Пост с маслом и вином: без мяса, молочного, яиц и рыбы.","Пост с рыбой: разрешены рыба, масло и вино; без мяса, молочного и яиц.","Сырная седмица: без мяса; разрешены молочное, яйца и рыба.","Великая Пятница: самый строгий постный день года; многие верующие не едят до вечера.","Пост и воздержание: одна полная трапеза и две лёгкие (с 18 до 59 лет) и без мяса (с 14 лет).","Воздержание от мяса (с 14 лет), как во все пятницы Великого поста.","Покаянный день: воздержание от мяса или иное покаяние, установленное епископской конференцией, например дело милосердия.","Сегодня торжество: воздержания нет, хотя и пятница.","Сегодня нет обязательного поста или воздержания.","В протестантских церквях нет обязательных постов: пост добровольный и совершается втайне (Мф. 6:16–18).","В период Великого поста многие церкви приглашают добровольно поститься или от чего-то отказаться.","Страстная пятница: многие христиане проводят её в посте и молитве."],"prn":["Царю Небесный","Трисвятое","Иисусова молитва","Свете тихий","Молитва Ефрема Сирина","Радуйся, Мария","Ангел Господень (Angelus)","Под Твою милость","Песнь Симеона Богоприимца","Песнь Богородицы (Magnificat)","Отче наш","Псалом"],"prt":["Царю Небесный, Утешителю, Душе истины, Иже везде сый и вся исполняяй, Сокровище благих и жизни Подателю, прииди и вселися в ны, и очисти ны от всякия скверны, и спаси, Блаже, души наша.","Святый Боже, Святый Крепкий, Святый Бессмертный, помилуй нас. (трижды) Слава Отцу и Сыну и Святому Духу, и ныне и присно и во веки веков. Аминь.","Господи Иисусе Христе, Сыне Божий, помилуй мя грешнаго.","Свете тихий святыя славы Безсмертнаго Отца Небеснаго, Святаго Блаженнаго, Иисусе Христе! Пришедше на запад солнца, видевше свет вечерний, поем Отца, Сына и Святаго Духа, Бога. Достоин еси во вся времена пет быти гласы преподобными, Сыне Божий, живот даяй, темже мир Тя славит.","Господи и Владыко живота моего, дух праздности, уныния, любоначалия и празднословия не даждь ми. Дух же целомудрия, смиренномудрия, терпения и любве даруй ми, рабу Твоему. Ей, Господи Царю, даруй ми зрети моя прегрешения и не осуждати брата моего, яко благословен еси во веки веков. Аминь.","Радуйся, Мария, благодати полная! Господь с Тобою; благословенна Ты между жёнами, и благословен плод чрева Твоего Иисус. Святая Мария, Матерь Божия, молись о нас, грешных, ныне и в час смерти нашей. Аминь.","Ангел Господень возвестил Марии, и Она зачала от Духа Святого. — Радуйся, Мария… — Се, раба Господня; да будет Мне по слову твоему. — Радуйся, Мария… — И Слово стало плотью и обитало с нами. — Радуйся, Мария…","Под Твою милость прибегаем, Богородице Дево, молений наших не презри в скорбех, но от бед избави нас, Едина Чистая и Благословенная."],"ui":["Сегодня","Церковный период","Сегодня празднуется","Сегодня нет великого праздника.","Пост сегодня","Молитва на это время","Ближайшие праздники","через {n} дн.","завтра","Полезно знать","Это ориентир: в каждом приходе может быть свой устав, а больные, беременные, дети и пожилые освобождаются от поста. Посоветуйтесь со священником или духовником.","Литургический цвет","Утро","Полдень","День","Вечер","Ночь","Великим постом читается также:","Новый календарь","Юлианский календарь","Русская, Сербская, Грузинская и Иерусалимская Церкви живут по юлианскому календарю: их непереходящие праздники наступают на 13 дней позже.","Перед Причастием соблюдается час евхаристического поста.","фиолетовый","белый","зелёный","красный","Сегодня"]},"ro":{"cn":["Duminica Vameșului și a Fariseului","Duminica Fiului Risipitor","Duminica Înfricoșătoarei Judecăți (a Lăsatului sec de carne)","Duminica Iertării (a Lăsatului sec de brânză)","Lunea curată: începe Postul Mare","Duminica Ortodoxiei","Duminica Sfântului Grigorie Palama","Duminica Sfintei Cruci","Duminica Sfântului Ioan Scărarul","Duminica Sfintei Maria Egipteanca","Sâm l și evanghelist","Sfântul Apostol Bartolomeu","Ziua Reformei"],"sn":["Triodul","Postul Mare","Săptămâna Mare","Perioada pascală","Perioada Rusaliilor","Postul Sfinților Apostoli","Postul Adormirii","Postul Crăciunului","Sărbătorile Crăciunului","Perioada de după Rusalii","Advent","Timpul Crăciunului","Timpul de peste an","Postul Mare","Triduumul pascal","Timpul pascal","Timpul Epifaniei","Timpul de după Rusalii"],"snote":["Începe Triodul: trei săptămâni de pregătire pentru Postul Mare, cu pildele vameșului și fiului risipitor.","În Postul Mare, în zilele de rând se rostește rugăciunea Sfântului Efrem Sirul, iar miercurea și vinerea se săvârșește Liturghia Darurilor mai înainte sfințite.","Săptămâna Mare: slujbele Îl însoțesc pe Hristos zi de zi până la Cruce și Înviere.","Perioada pascală: credincioșii se salută cu „Hristos a înviat! — Adevărat a înviat!”","După Înălțare, Biserica se pregătește să primească Duhul Sfânt la Rusalii.","Postul Sfinților Apostoli: pregătire pentru sărbătoarea Sfinților Petru și Pavel, pe 29 iunie.","Postul Adormirii: multe parohii săvârșesc seara Paraclisul Maicii Domnului.","Postul Crăciunului: patruzeci de zile de pregătire pentru Nașterea lui Hristos.","Zile de sărbătoare între Crăciun și Bobotează: nu se postește.","Fiecare duminică este un mic Paște: Sfânta Liturghie este inima săptămânii.","Advent: în fiecare duminică se aprinde încă o lumânare a coroanei, în așteptarea Crăciunului.","Timpul Crăciunului: sărbătorim că Dumnezeu S-a făcut om; vreme de bucurie și de familie.","Timpul de peste an: duminica, ziua Domnului, este inima săptămânii.","Postul Mare: patruzeci de zile de rugăciune, post și milostenie; multe parohii fac Calea Crucii vinerea.","Triduumul pascal: Joia Sfântă, Vinerea Sfântă și Vigilia pascală, inima anului creștin.","Timpul pascal: cincizeci de zile de bucurie pentru Înviere, până la Rusalii.","Timpul Epifaniei: Hristos Se arată ca lumină pentru toate neamurile.","Timpul de după Rusalii: Biserica își trăiește viața de zi cu zi călăuzită de Duhul Sfânt."],"ft":["Astăzi nu se postește: se poate mânca orice.","Post aspru: fără carne, lactate, ouă, pește, ulei și vin.","Post cu ulei și vin: fără carne, lactate, ouă și pește.","Post cu dezlegare la pește: se îngăduie pește, ulei și vin; fără carne, lactate și ouă.","Săptămâna brânzei: fără carne; se îngăduie lactate, ouă și pește.","Vinerea Mare: ziua de post cea mai aspră a anului; mulți credincioși nu mănâncă până seara.","Post și abstinență: o masă principală și două mai ușoare (între 18 și 59 de ani) și fără carne (de la 14 ani).","Abstinență de la carne (de la 14 ani), ca în toate vinerile Postului Mare.","Zi de pocăință: abstinență de la carne sau altă faptă de pocăință stabilită de conferința episcopală, cum ar fi o faptă de caritate.","Astăzi este solemnitate: nu există abstinență, deși e vineri.","Astăzi nu există post sau abstinență obligatorii.","În bisericile protestante nu există posturi obligatorii: postul este de bunăvoie și în ascuns (Mt 6,16-18).","În Postul Mare multe biserici invită la post sau la renunțarea de bunăvoie la ceva.","Vinerea Mare: mulți creștini o trăiesc în post și rugăciune."],"prn":["Împărate ceresc","Sfinte Dumnezeule (Trisaghion)","Rugăciunea lui Iisus","Lumină lină","Rugăciunea Sfântului Efrem Sirul","Bucură-te, Marie","Angelus","Sub milostivirea ta","Cântarea lui Simeon","Magnificat","Tatăl nostru","Psalm"],"prt":["Împărate ceresc, Mângâietorule, Duhul adevărului, Care pretutindenea ești și toate le plinești, Vistierul bunătăților și Dătătorule de viață, vino și Te sălășluiește întru noi și ne curățește pe noi de toată întinăciunea și mântuiește, Bunule, sufletele noastre.","Sfinte Dumnezeule, Sfinte Tare, Sfinte fără de moarte, miluiește-ne pe noi. (de trei ori) Slavă Tatălui și Fiului și Sfântului Duh, și acum și pururea și în vecii vecilor. Amin.","Doamne Iisuse Hristoase, Fiul lui Dumnezeu, miluiește-mă pe mine, păcătosul.","Lumină lină a sfintei slave a Tatălui ceresc, Celui fără de moarte, Sfântului, Fericitului, Iisuse Hristoase! Venind la apusul soarelui, văzând lumina cea de seară, lăudăm pe Tatăl, pe Fiul și pe Sfântul Duh, Dumnezeu. Vrednic ești în toate vremile a fi lăudat de glasuri cuvioase, Fiul lui Dumnezeu, Cel ce dai viață; pentru aceasta lumea Te slăvește.","Doamne și Stăpânul vieții mele, duhul trândăviei, al grijii de multe, al iubirii de stăpânire și al grăirii în deșert nu mi-l da mie. Iar duhul curăției, al gândului smerit, al răbdării și al dragostei dăruiește-mi mie, slugii Tale. Așa, Doamne, Împărate, dăruiește-mi să-mi văd greșelile mele și să nu osândesc pe fratele meu, că binecuvântat ești în vecii vecilor. Amin.","Bucură-te, Marie, cea plină de har, Domnul este cu tine. Binecuvântată ești tu între femei și binecuvântat este rodul trupului tău, Isus. Sfântă Marie, Maica lui Dumnezeu, roagă-te pentru noi, păcătoșii, acum și în ceasul morții noastre. Amin.","Îngerul Domnului a vestit-o pe Maria, și ea a zămislit de la Duhul Sfânt. — Bucură-te, Marie… — Iată slujitoarea Domnului; fie mie după cuvântul tău. — Bucură-te, Marie… — Și Cuvântul S-a făcut trup și a locuit între noi. — Bucură-te, Marie…","Sub milostivirea ta scăpăm, Născătoare de Dumnezeu Fecioară; rugăciunile noastre nu le trece cu vederea în nevoi, ci din primejdii ne izbăvește pe noi, una curată, una binecuvântată."],"ui":["Astăzi","Perioada liturgică","Astăzi se prăznuiește","Astăzi nu este o sărbătoare mare.","Postul de azi","Rugăciune pentru acest moment","Sărbători apropiate","peste {n} zile","mâine","Bine de știut","Este orientativ: fiecare parohie poate avea rânduiala ei, iar bolnavii, femeile însărcinate, copiii și vârstnicii sunt dezlegați. Întreabă-l pe preotul sau duhovnicul tău.","Culoare liturgică","Dimineața","Amiaza","După-amiaza","Seara","Noaptea","În Postul Mare se rostește și:","Calendar nou","Calendar iulian","Bisericile rusă, sârbă, georgiană și a Ierusalimului urmează calendarul iulian: sărbătorile lor cu dată fixă cad cu 13 zile mai târziu.","Înainte de împărtășanie se ține o oră de post euharistic.","violet","alb","verde","roșu","Astăzi"]}};

function yearEvents(br,y){
 const out=[],old=tdOld();
 if(br==='ortodoxa'){const P=oPascha(y);O_MOV.forEach(([id,o])=>out.push([id,P+o*DAY]));O_FIX.forEach(([id,m,d])=>out.push([id,utc(y,m,d)+(old?13*DAY:0)]))}
 else{const E=gEaster(y);(br==='catolica'?C_MOV:P_MOV).forEach(([id,o])=>out.push([id,E+o*DAY]));(br==='catolica'?C_FIX:P_FIX).forEach(([id,m,d])=>out.push([id,utc(y,m,d)]));
  // Traslados litúrgicos (católicos y protestantes): la Anunciación en Semana Santa u Octava de Pascua pasa al lunes tras el 2.º domingo de Pascua; en domingo de Cuaresma, al lunes. San José en Semana Santa pasa al sábado anterior al Domingo de Ramos; en domingo de Cuaresma, al lunes.
  for(const e of out){const dE=Math.round((e[1]-E)/DAY),sun=new Date(e[1]).getUTCDay()===0;
   if(e[0]==='annunciation'){if(dE>=-7&&dE<=7)e[1]=E+8*DAY;else if(sun&&dE>=-46&&dE<0)e[1]+=DAY}
   if(e[0]==='joseph'){if(dE>=-7&&dE<=-1)e[1]=E-8*DAY;else if(sun&&dE>=-46&&dE<0)e[1]+=DAY}}
  const A=advent1(y);out.push(['advent1',A]);if(br==='catolica'){out.push(['christKing',A-7*DAY]);out.push(['holyFamily',holyFamily(y)]);out.push(['baptism',baptismDay(y)])}}
 return out;
}

function upcoming(br,td,n){const y=new Date(td).getUTCFullYear(),maj=br==='ortodoxa'?O_MAJ:br==='catolica'?C_MAJ:P_MAJ;
