<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4A1416">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Phos">
<title>Phos · Biblia electrónica</title>

<link rel="stylesheet" href="/fonts/fonts.css">
<style>
:root{--wine:#4A1416;--gold:#E2C27A;--goldtx:#7A5A1C;--ground:#F6F1E7;--paper:#FBF8F2;--line:#E6DCCB;--ink:#231C1A;--muted:#5E5650;--fs:20px}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:'Source Sans 3',system-ui,sans-serif}
button{font:inherit;cursor:pointer}
a{color:var(--wine)}
.app{max-width:760px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
header.top{position:sticky;top:0;z-index:5;background:var(--wine);color:var(--ground);padding:12px 16px;display:flex;align-items:center;gap:10px}
.brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.brand b{font-family:'Cormorant Garamond',serif;font-size:26px;letter-spacing:.5px}
.brand small{display:block;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--gold)}
.iconbtn{width:44px;height:44px;border:0;border-radius:999px;background:transparent;color:inherit;display:flex;align-items:center;justify-content:center}
.iconbtn:hover{background:rgba(255,255,255,.1)}
main{flex:1;padding:18px 16px 40px}
h1{font-family:'Cormorant Garamond',serif;color:var(--wine);font-size:34px;margin:4px 0 6px}
h2{font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--goldtx);margin:22px 0 8px}
p.lead{margin:0 0 16px;color:var(--muted)}
.card{display:block;width:100%;text-align:left;border:0;background:#fff;border-radius:16px;padding:16px 18px;margin-bottom:12px;box-shadow:0 1px 3px rgba(74,20,22,.08);color:var(--ink)}
.card.main{background:var(--wine);color:var(--ground)}
.card .t{font-family:'Cormorant Garamond',serif;font-size:25px;font-weight:700;color:var(--wine);display:flex;justify-content:space-between;align-items:center;gap:8px}
.card.main .t{color:var(--ground)}
.card .s{font-size:14px;color:var(--muted);margin-top:4px}
.card.main .s{color:#EBDCD6}
.pill{font-family:'Source Sans 3',sans-serif;font-size:12px;font-weight:700;border-radius:999px;padding:3px 10px;background:var(--gold);color:var(--wine);white-space:nowrap}
.pill.soft{background:#F1E4C4;color:#5C3F0E}
.card.off{opacity:.7;cursor:default}
.edlist{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.ed{border:1px solid rgba(255,255,255,.35);background:transparent;color:inherit;border-radius:12px;padding:10px 12px;text-align:left}
.card:not(.main) .ed{border-color:var(--line)}
.ed b{display:block}
.ed span{font-size:13px;opacity:.85}
.seg{display:flex;gap:6px;background:#E3D9C6;border-radius:999px;padding:4px;margin:6px 0 12px}
.seg button{flex:1;min-height:40px;border:0;border-radius:999px;background:transparent;color:var(--wine);font-weight:700}
.seg button[aria-pressed=true]{background:var(--wine);color:var(--ground)}
.booklist{display:flex;flex-direction:column;gap:3px}
.book{display:flex;justify-content:space-between;align-items:center;min-height:48px;padding:0 14px;background:#fff;border:0;border-radius:10px;font-weight:600;color:var(--ink);text-align:left}
.book small{font-weight:400;color:var(--muted);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:8px}
.grid button{min-height:48px;border:0;border-radius:10px;background:#fff;font-weight:700;color:var(--wine)}
.reader{background:var(--paper);border-radius:14px;padding:22px 20px;box-shadow:0 1px 3px rgba(74,20,22,.06)}
.txt{font-family:'Noto Serif','Cormorant Garamond',serif;font-size:var(--fs);line-height:1.75;color:#2E2724}
.txt.he{font-family:'Noto Serif Hebrew','Noto Serif',serif;direction:rtl;text-align:right}
.txt p{margin:0 0 8px}
.txt sup{font-family:'Source Sans 3',sans-serif;font-size:12px;color:var(--goldtx);font-weight:700;margin:0 4px}
.txt p.hl{background:#F1E4C4;border-radius:6px}
.nav{display:flex;gap:10px;margin-top:16px}
.nav button,.btn{flex:1;min-height:48px;border:0;border-radius:999px;background:var(--wine);color:var(--ground);font-weight:700;padding:0 18px}
.btn.ghost{background:transparent;border:2px solid var(--wine);color:var(--wine)}
.nav button:disabled{opacity:.35;cursor:default}
.crumb{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.crumb button{border:0;background:transparent;color:var(--wine);font-weight:600;min-height:40px;padding:0 4px;text-decoration:underline}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 14px}
.tools button,.tools select{min-height:44px;border:1px solid #C9BDA8;background:#fff;border-radius:999px;padding:0 14px;color:var(--wine);font-weight:600}
.tools label{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
input[type=search]{width:100%;border:1px solid #C9BDA8;border-radius:12px;padding:13px 14px;font:inherit;background:#fff}
.res{background:#fff;border:0;border-radius:12px;padding:12px 14px;margin-bottom:8px;text-align:left;width:100%;color:var(--ink)}
.res b{color:var(--wine);display:block;font-size:14px;margin-bottom:2px}
.res span{font-family:'Noto Serif',serif;font-size:16px}
.note{font-size:13px;color:var(--muted);line-height:1.5}
.loading{padding:40px 0;text-align:center;color:var(--muted)}
.par{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:700px){.par.two{grid-template-columns:1fr 1fr}}
.vivlos{white-space:pre-line;background:#fff;border-radius:12px;padding:14px;font-size:13px;color:var(--muted)}
dialog{border:0;border-radius:16px;max-width:520px;width:calc(100% - 32px);padding:20px}
dialog::backdrop{background:rgba(35,28,26,.45)}
.tabs{position:sticky;top:68px;z-index:4;display:flex;gap:4px;overflow-x:auto;background:#3A0F11;padding:6px 10px;scrollbar-width:none}
.tabs button{flex:1 0 auto;min-height:40px;border:0;border-radius:999px;background:transparent;color:#EBDCD6;font-weight:700;padding:0 14px;white-space:nowrap}
.tabs button[aria-current=page]{background:var(--gold);color:var(--wine)}
.stats{display:flex;gap:10px;margin:4px 0 12px}.stat{display:flex;align-items:center;gap:6px;background:#fff;border-radius:999px;padding:8px 14px;color:var(--wine);font-size:14px}
.pbar{position:relative;height:14px;background:#E3D9C6;border-radius:999px;overflow:hidden;margin:6px 0}.pbar i{display:block;height:100%;background:linear-gradient(90deg,#7A5A1C,#E2C27A);border-radius:999px;transition:width .4s}
.pbar .mark{position:absolute;top:0;bottom:0;width:2px;background:var(--wine)}.pbar.small{flex:1;height:12px;margin:0}
.path{display:flex;flex-direction:column;align-items:center;gap:14px;padding:6px 0 10px}.node-wrap{display:flex;flex-direction:column;align-items:center;gap:4px}
.node{width:68px;height:68px;border-radius:50%;border:0;font-weight:700;font-size:16px;box-shadow:0 5px 0 rgba(0,0,0,.18)}
.node.done{background:var(--gold);color:var(--wine)}.node.cur{background:var(--wine);color:var(--ground);animation:pulse 1.6s infinite}.node.locked{background:#D9D0C0;color:#6E6560;box-shadow:0 5px 0 #BFB4A2}.node.rev{border-radius:20px}
.node:active:not([disabled]){transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.18)}
@keyframes pulse{0%,100%{box-shadow:0 5px 0 rgba(0,0,0,.18),0 0 0 0 rgba(226,194,122,.7)}50%{box-shadow:0 5px 0 rgba(0,0,0,.18),0 0 0 10px rgba(226,194,122,0)}}
@media (prefers-reduced-motion:reduce){.node.cur{animation:none}}
.nlabel{font-size:12px;color:var(--muted);max-width:110px;text-align:center}
.lhead{display:flex;align-items:center;gap:10px;margin-bottom:18px}.iconbtn.x{color:var(--muted)}.hearts{display:flex;align-items:center;gap:4px;font-weight:700;color:#C0392B}
.qp{font-size:28px;line-height:1.2}.qx{font-family:'Noto Serif',serif;font-size:18px;line-height:1.6;background:var(--paper);border-radius:12px;padding:14px;margin:0 0 14px}
.opts{display:flex;flex-direction:column;gap:10px}.opt{min-height:54px;border:2px solid #D9D0C0;border-bottom-width:4px;border-radius:14px;background:#fff;text-align:left;padding:10px 16px;font-size:17px;color:var(--ink)}
.opt[aria-pressed=true]{border-color:var(--wine);background:#F6ECEC}.opt.ok{border-color:#2E7D32;background:#E8F5E9}.opt.bad{border-color:#C0392B;background:#FDECEA}
.lfoot{position:sticky;bottom:0;margin:22px -16px -40px;padding:14px 16px 22px;background:var(--ground);border-top:1px solid var(--line)}.lfoot.good{background:#E8F5E9}.lfoot.nogood{background:#FDECEA}
.fb{margin-bottom:10px}.fb b{display:block;font-size:19px}.lfoot.good .fb b{color:#1B5E20}.lfoot.nogood .fb b{color:#A12A1E}.fb span{color:var(--ink)}
.btn:disabled{opacity:.4;cursor:default}.lcard{background:#fff;border-radius:18px;padding:22px;box-shadow:0 1px 3px rgba(74,20,22,.08)}
.endc{text-align:center;padding:30px 0}.endc .big{font-family:'Cormorant Garamond',serif;font-size:56px;font-weight:700;color:var(--goldtx)}
.art{background:#fff;border-radius:16px;padding:18px;margin-bottom:14px}.art p{line-height:1.6;margin:0 0 10px}.ah{font-family:'Cormorant Garamond',serif;font-size:26px;letter-spacing:0;text-transform:none;color:var(--wine);margin:0 0 8px}
.vq{margin:10px 0 0;border-radius:12px;background:var(--paper);padding:12px 14px;font-family:'Noto Serif',serif}.vq cite{display:block;font-family:'Source Sans 3',sans-serif;font-style:normal;font-size:13px;color:var(--goldtx);font-weight:700;margin-top:6px}
.bil .pair{padding:6px 8px;margin:0 -8px 6px;border-radius:10px}
.bil .pair .txt{margin:0}
.bil .pair .tr{margin:4px 0 0;font-family:'Source Sans 3',system-ui,sans-serif;font-size:calc(var(--fs) * .85);line-height:1.6;color:#4E4540}
.txt p.hl,.pair.hl{background:#F1E4C4}
.mk-gold{background:rgba(226,194,122,.38)!important}.mk-blue{background:rgba(90,150,220,.25)!important}.mk-green{background:rgba(80,170,110,.25)!important}
.has-bm sup::before{content:"★";margin-right:2px}.has-note sup::after{content:"✎";margin-left:2px}
[data-v]{cursor:pointer;border-radius:8px}[data-v]:focus-visible{outline:2px solid var(--goldtx)}
.sw{width:44px;height:44px;border-radius:50%!important;padding:0!important;border:2px solid transparent!important}.sw[aria-pressed=true]{border-color:var(--wine)!important;box-shadow:0 0 0 2px #fff inset}
.sw-gold{background:#E2C27A!important}.sw-blue{background:#8FB7E6!important}.sw-green{background:#8CCB9F!important}
[data-theme=dark]{--ground:#17110F;--paper:#211916;--line:#3A2C27;--ink:#EDE3D6;--muted:#BBAEA2;--goldtx:#E2C27A;color-scheme:dark}
[data-theme=dark] body{background:var(--ground);color:var(--ink)}
[data-theme=dark] .card:not(.main),[data-theme=dark] .book,[data-theme=dark] .grid button,[data-theme=dark] .res,[data-theme=dark] .art,[data-theme=dark] .lcard,[data-theme=dark] .stat,[data-theme=dark] .opt,[data-theme=dark] .tools button,[data-theme=dark] .tools select,[data-theme=dark] input,[data-theme=dark] textarea,[data-theme=dark] dialog,[data-theme=dark] .vivlos{background:#241B18;color:var(--ink);border-color:#3A2C27}
[data-theme=dark] h1,[data-theme=dark] .card:not(.main) .t,[data-theme=dark] .ah,[data-theme=dark] .grid button,[data-theme=dark] .tools button,[data-theme=dark] .crumb button,[data-theme=dark] .tools select{color:#F1D9A0}
[data-theme=dark] .txt{color:var(--ink)}[data-theme=dark] .bil .pair .tr{color:var(--muted)}
[data-theme=dark] .seg{background:#2C221E}[data-theme=dark] .seg button{color:#F1D9A0}[data-theme=dark] .seg button[aria-pressed=true]{background:var(--gold);color:var(--wine)}
[data-theme=dark] .opt[aria-pressed=true]{background:#3A2422;border-color:#E2C27A}[data-theme=dark] .opt.ok{background:#1E3A24}[data-theme=dark] .opt.bad{background:#47201C}
[data-theme=dark] .lfoot{background:var(--ground)}[data-theme=dark] .lfoot.good{background:#1E3A24}[data-theme=dark] .lfoot.nogood{background:#47201C}[data-theme=dark] .lfoot.good .fb b{color:#9FE0A9}[data-theme=dark] .lfoot.nogood .fb b{color:#F4A79D}[data-theme=dark] .fb span{color:var(--ink)}
[data-theme=dark] .pbar{background:#2C221E}[data-theme=dark] .node.locked{background:#3A2C27;color:#BBAEA2;box-shadow:0 5px 0 #2A1F1B}
[data-theme=dark] .btn.ghost{border-color:#E2C27A;color:#E2C27A}[data-theme=dark] .txt p.hl,[data-theme=dark] .pair.hl{background:#4A3A1C}
[data-theme=dark] .pill.soft{background:#4A3A1C;color:#F1D9A0}[data-theme=dark] .nlabel{color:var(--muted)}

.picked{list-style:none;margin:0 0 12px;padding:0;display:flex;flex-direction:column;gap:8px;min-height:20px}.picked li{display:block}.picked .opt{width:100%;border-color:var(--wine)}

.bigglyph{font-size:56px;font-family:'Noto Serif','Noto Serif Hebrew',serif;color:var(--wine);line-height:1.25;margin:12px 0 4px;word-break:break-word}[data-theme=dark] .bigglyph{color:#F1D9A0}
.seg[role=tablist] button{min-height:44px}
.trbtn{min-height:44px;border:1px solid #C9BDA8;background:#fff;border-radius:999px;padding:0 16px;color:var(--wine);font:inherit;font-weight:600;margin:0 0 10px;cursor:pointer}
.qtr{background:#FFF6E0;border-radius:12px;padding:12px 14px;margin:0 0 14px;font-size:16px;line-height:1.55;color:var(--ink)}
[data-theme=dark] .trbtn{background:#241B18;color:#F1D9A0;border-color:#3A2C27}[data-theme=dark] .qtr{background:#2C2418}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.badge{background:#fff;border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:4px;opacity:.55;filter:grayscale(1)}
.badge.on{opacity:1;filter:none;box-shadow:0 1px 3px rgba(74,20,22,.12)}
.bico{width:44px;height:44px;border-radius:50%;background:var(--gold);color:var(--wine);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.badge b{color:var(--wine)}.badge>span:last-child{font-size:13px;color:var(--muted)}
[data-theme=dark] .badge{background:#241B18}[data-theme=dark] .badge b{color:#F1D9A0}
.seg[role=tablist]{flex-wrap:wrap}.seg[role=tablist] button{flex:1 1 auto;padding:0 10px}
.hnote{position:relative;background:#FFF8EA;border:1px solid #EAD9B2;border-radius:16px;padding:14px 44px 14px 16px;margin:4px 0 16px;color:var(--ink);transition:opacity .25s,transform .25s}
.hnote.out{opacity:0;transform:translateY(-6px)}
.hnote .hnt{margin:0 0 4px;font-weight:700;color:var(--wine);font-size:15px}
.hnote .hnb{margin:0;font-size:15px;line-height:1.45;color:var(--muted)}
.hnote .hnok{margin-top:10px;border:0;background:var(--gold);color:var(--wine);font-weight:700;border-radius:999px;padding:7px 16px;font-size:14px}
.hnote .hnx{position:absolute;top:6px;right:6px;width:36px;height:36px;border:0;background:none;color:var(--muted);font-size:16px;border-radius:50%}
[data-theme=dark] .hnote{background:#2A2320;border-color:#4A3B2C}
[data-theme=dark] .hnote .hnt{color:var(--gold)}
[data-theme=dark] .hnote .hnb{color:#CFC6BC}
.fdentry{display:flex;align-items:center;gap:14px;background:linear-gradient(135deg,#4A1416,#6E2A22);color:#FBF3E2;border:0;border-radius:18px;padding:16px 18px;margin:6px 0 18px;text-align:left;box-shadow:0 4px 14px rgba(74,20,22,.25)}
.fdentry .fdico{font-size:26px;letter-spacing:-4px;flex:0 0 auto}
.fdentry .fdtx{flex:1;min-width:0}
.fdentry b{display:block;font-family:'Cormorant Garamond',serif;font-size:23px;font-weight:700;color:#E2C27A;line-height:1.15}
.fdentry small{display:block;font-size:14px;opacity:.9;margin-top:3px}
.fdentry .fdgo{font-size:30px;color:#E2C27A;flex:0 0 auto}
.fdchart .note{margin-top:0}
.fdleg{display:flex;gap:16px;font-size:13px;color:var(--muted);margin:0 0 10px}
.fsw{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.fsw.g,.fdbar .g{background:var(--wine)}
.fsw.j,.fdbar .j{background:var(--gold)}
.fdrow{display:grid;grid-template-columns:minmax(7.5em,38%) 1fr 2em;align-items:center;gap:8px;width:100%;background:none;border:0;padding:5px 0;text-align:left;color:var(--ink);font:inherit;font-size:15px;border-radius:8px}
.fdrow:active{background:var(--paper)}
.fdl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fdbar{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--paper)}
.fdbar i{display:block;height:100%}
.fdn{text-align:right;font-variant-numeric:tabular-nums;color:var(--goldtx);font-weight:700}
.fdgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(8.5em,1fr));gap:10px;margin:8px 0 14px}
.fdchip{display:flex;flex-direction:column;align-items:center;gap:2px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px 8px;color:var(--ink);font:inherit;text-align:center}
.fdchip .fdce{font-size:28px}
.fdchip b{font-size:15px;line-height:1.2}
.fdchip small{font-size:12px;color:var(--muted)}
.fdtags{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:0 0 4px}
.pill.fdg{background:var(--wine);color:#FBF3E2}
.pill.fdj{background:var(--gold);color:var(--wine)}
.fdoc{font-size:12px;color:var(--muted);font-style:italic}
.fdfoods{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 0}
.fdfoods:empty{display:none}
.fdmini{border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:999px;padding:4px 10px;font:inherit;font-size:13px}
.fdread{margin-top:12px;flex:none;width:100%}
[data-theme=dark] .fdchip{background:var(--paper);border-color:var(--line)}
[data-theme=dark] .fsw.g,[data-theme=dark] .fdbar .g,[data-theme=dark] .pill.fdg{background:#B5574C}
[data-theme=dark] .fdbar{background:var(--ground)}
[data-theme=dark] .fdmini{background:var(--ground)}
.tpcards{display:flex;flex-direction:column;gap:12px;margin:0 0 16px}
.tpcard{display:flex;align-items:center;gap:14px;border:1px solid var(--line);border-radius:18px;padding:14px 16px;text-align:left;background:#fff;color:var(--ink)}
.tpcard .tpci{font-size:30px;flex:0 0 auto}
.tpcard .tpct{flex:1;min-width:0}
.tpcard b{display:block;font-family:'Cormorant Garamond',serif;font-size:23px;color:var(--wine);line-height:1.15}
.tpcard small{display:block;font-size:13px;color:var(--muted);margin:2px 0 6px}
.tpcard .fdgo{font-size:28px;color:var(--goldtx)}
.tpcard.all{border-color:#8FAE74;background:#F1F6EB}
.tpbar{display:block;height:6px;border-radius:3px;background:var(--paper);overflow:hidden}
.tpbar i{display:block;height:100%;background:#6E9150;border-radius:3px;transition:width .3s}
.tpbar.big{height:10px;flex:1}
.tphead{display:flex;align-items:center;gap:12px;margin:14px 0 4px}
.tpprog{font-size:14px;font-weight:700;color:#4F6E38;white-space:nowrap}
.tpintro p{margin:0 0 8px}
.tpnote{margin:6px 0 10px;padding:12px 16px}
.tplist{display:flex;flex-direction:column;gap:10px;margin-bottom:18px}
.tch{background:#fff;border:1px solid var(--line);border-left:5px solid var(--gold);border-radius:14px;overflow:hidden;transition:background .25s,border-color .25s}
.tch summary{display:flex;align-items:center;gap:12px;padding:12px 14px;cursor:pointer;list-style:none}
.tch summary::-webkit-details-marker{display:none}
.tpn{flex:0 0 2em;height:2em;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--paper);color:var(--goldtx);font-weight:700;font-size:14px}
.tps{flex:1;min-width:0}
.tps b{display:block;font-size:17px;line-height:1.25;color:var(--ink)}
.tps small{display:block;font-size:13px;color:var(--muted);margin-top:2px}
.tpchev{font-size:22px;color:var(--goldtx);transition:transform .2s}
.tch[open] .tpchev{transform:rotate(90deg)}
.tpbody{padding:0 14px 14px}
.tprefl{margin-top:12px;background:#FFF8EA;border-radius:12px;padding:12px 14px}

sum:"Création, chute, déluge et les patriarches Abraham, Isaac, Jacob et Joseph.|Moïse fait sortir Israël d’Égypte et Dieu donne la Loi au Sinaï.|Lois sur les sacrifices, le sacerdoce et la sainteté.|Le recensement du peuple et les quarante ans au désert.|Discours d’adieu de Moïse avant l’entrée en Terre promise.|Josué conquiert et partage le pays de Canaan.|Cycles d’infidélité et de délivrance avec des juges comme Débora, Gédéon et Samson.|Ruth la Moabite, fidèle à sa belle-mère Noémi, arrière-grand-mère du roi David.|Samuel, le roi Saül et le jeune David face à Goliath.|Le règne de David à Jérusalem.|Salomon bâtit le Temple, le royaume se divise et le prophète Élie apparaît.|Élisée et les rois d’Israël et de Juda jusqu’à l’exil à Babylone.|Généalogies et règne de David racontés à nouveau.|Histoire de Juda depuis Salomon jusqu’à l’exil.|Retour d’exil et reconstruction du Temple.|Néhémie reconstruit les murailles de Jérusalem.|La reine Esther sauve son peuple en Perse.|Job, un juste qui souffre, discute avec ses amis et rencontre Dieu.|Chants et prières d’Israël : 150 psaumes, ou 151 dans la tradition orthodoxe.|Proverbes de sagesse pour la vie quotidienne.|Réflexion sur le sens de la vie : « vanité des vanités ».|Poème d’amour entre le bien-aimé et la bien-aimée.|Prophéties de jugement, de consolation et sur le Messie.|Jérémie annonce la chute de Jérusalem et une alliance nouvelle.|Lamentations sur la destruction de Jérusalem.|Visions du prophète en exil, comme la vallée des ossements desséchés.|Daniel à Babylone : la fosse aux lions et des visions de l’avenir.|L’amour fidèle de Dieu pour un peuple infidèle, comme celui d’un époux.|Une invasion de sauterelles et la promesse de l’Esprit.|Un berger dénonce l’injustice sociale.|Prophétie contre Édom ; le livre le plus court de l’Ancien Testament.|Jonas fuit Dieu, est avalé par un grand poisson et prêche à Ninive.|Justice, miséricorde et Bethléem comme berceau du chef.|Annonce de la chute de Ninive.|Le prophète interroge Dieu sur le mal : « le juste vivra par sa foi ».|Le jour du Seigneur et l’espérance pour un reste humble.|Appel à reconstruire le Temple.|Visions de restauration et du roi humble monté sur un âne.|Le dernier prophète : il annonce le messager qui prépare le chemin.|Tobie voyage guidé par l’ange Raphaël et guérit son père Tobit.|Judith, une veuve courageuse, sauve sa ville d’Holopherne.|Le livre d’Esther avec des prières et des passages qui n’existent qu’en grec.|Éloge de la Sagesse, attribué à Salomon.|Enseignements de Jésus fils de Sirac sur la vie droite.|Baruch, secrétaire de Jérémie, écrit aux exilés.|Lettre contre les idoles adressée aux exilés.|Prière et cantique des trois jeunes gens dans la fournaise.|Daniel défend Suzanne, faussement accusée.|Daniel démasque l’idole Bel et vainc un dragon.|Les Maccabées se soulèvent contre la persécution grecque.|Martyrs et victoires de la révolte des Maccabées.|Les Juifs d’Égypte sauvés de la persécution de Ptolémée.|Récit grec du retour d’exil, avec l’histoire des trois gardes.|Le livre d’Esdras dans sa version grecque (Esdras B).|Daniel dans la version grecque de la Septante.|La vie de Jésus, le Messie promis, avec le Sermon sur la montagne.|L’évangile le plus bref : Jésus en action.|Jésus sauve les pauvres et les pécheurs ; paraboles comme celle du fils prodigue.|Jésus, le Verbe fait chair, et ses signes.|Les apôtres répandent l’Église après la Pentecôte.|Paul explique le salut par la foi en Christ.|Les problèmes de la communauté de Corinthe et l’hymne à l’amour.|Paul défend son ministère : la force dans la faiblesse.|La liberté chrétienne face à la Loi.|L’Église, corps du Christ.|Une lettre de joie écrite en prison.|Le Christ, tête de toute la création.|La venue du Seigneur et la vie sainte.|Précisions sur le jour du Seigneur.|Conseils à Timothée pour guider l’Église.|Les dernières paroles de Paul : « j’ai gardé la foi ».|Instructions pour l’Église de Crète.|Paul intercède pour Onésime, un esclave en fuite.|Le Christ, grand prêtre de l’alliance nouvelle.|La foi se montre par les œuvres.|Espérance pour les chrétiens qui souffrent.|Mise en garde contre les faux docteurs.|Dieu est amour : aimez-vous les uns les autres.|Courte lettre sur la vérité et l’amour.|Lettre à Gaïus sur l’hospitalité.|Appel à combattre pour la foi.|Visions de Jean sur la fin des temps et la Jérusalem nouvelle.",

art:{health:[["Jeûne et alimentation","La tradition orthodoxe jeûne le mercredi et le vendredi et pendant quatre périodes de l’année, comme le Grand Carême avant Pâques. On renonce à la viande, aux laitages et parfois à l’huile et au vin, et l’on mange simplement.","Le jeûne n’est pas un régime : il vise à maîtriser l’appétit, à prier davantage et à partager avec ceux qui sont dans le besoin. Légumineuses, légumes, céréales, fruits et fruits secs forment la base de la table de jeûne.","Si vous êtes enceinte, malade ou sous traitement, parlez à votre médecin et à votre prêtre avant de jeûner : l’Église adapte le jeûne à chacun."],["Repos et sommeil","Jésus a invité ses disciples à se retirer pour se reposer. Se reposer, c’est aussi prendre soin du corps que Dieu nous a donné.","Essayez de vous coucher à une heure semblable chaque jour, laissez les écrans un moment avant de dormir et terminez la journée par une courte prière."],["Calme et prière","La prière de Jésus (« Seigneur Jésus-Christ, Fils de Dieu, aie pitié de moi ») se dit lentement, au rythme calme de la respiration.","Essayez cinq minutes par jour : asseyez-vous, respirez profondément et répétez la prière sans hâte. Si l’anxiété persiste, demandez l’aide d’un professionnel."]],
 sport:[["L’athlète de la foi","Saint Paul compare la vie chrétienne à une course : persévérance, entraînement et regard fixé sur le but.","Pratiquer un sport avec discipline et humilité peut être une école de vertus : patience, effort et esprit d’équipe."],["Marcher et pèleriner","La marche est l’exercice le plus simple et une forme ancienne de prière. Beaucoup de fidèles vont à pied en pèlerinage vers des monastères et des églises.","Commencez par 20 à 30 minutes par jour à allure confortable. Vous pouvez prier ou écouter les Psaumes en marchant."],["Corps et âme","La Bible honore le corps comme temple de l’Esprit, mais place la vie spirituelle avant l’exercice physique.","Un bon équilibre : bouger chaque jour, manger avec modération, se reposer et prendre du temps pour prier."]],
 more:[["Famille et foyer","Dans beaucoup de foyers orthodoxes, il y a un coin d’icônes avec une veilleuse, où la famille prie ensemble le matin ou le soir.","Bénir le repas et lire ensemble un court passage sont des coutumes simples qui rapprochent la famille."],["Servir les autres","La foi se vit dans la charité : rendre visite à un malade, aider un voisin ou s’engager dans sa paroisse."],["Gratitude quotidienne","Avant de dormir, pensez à trois choses pour lesquelles rendre grâce aujourd’hui. Saint Jean Chrysostome est mort en disant : « Gloire à Dieu pour tout »."]]},

sum:"Creazione, caduta, diluvio e i patriarchi Abramo, Isacco, Giacobbe e Giuseppe.|Mosè fa uscire Israele dall’Egitto e Dio dona la Legge sul Sinai.|Leggi sui sacrifici, sul sacerdozio e sulla santità.|Il censimento del popolo e i quarant’anni nel deserto.|Discorsi di commiato di Mosè prima dell’ingresso nella Terra promessa.|Giosuè conquista e divide la terra di Canaan.|Cicli di infedeltà e liberazione con giudici come Debora, Gedeone e Sansone.|Rut la moabita, fedele alla suocera Noemi, bisnonna del re Davide.|Samuele, il re Saul e il giovane Davide contro Golia.|Il regno di Davide a Gerusalemme.|Salomone costruisce il Tempio, il regno si divide e compare il profeta Elia.|Eliseo e i re di Israele e di Giuda fino all’esilio a Babilonia.|Genealogie e regno di Davide raccontati di nuovo.|Storia di Giuda da Salomone all’esilio.|Ritorno dall’esilio e ricostruzione del Tempio.|Neemia ricostruisce le mura di Gerusalemme.|La regina Ester salva il suo popolo in Persia.|Giobbe, un giusto che soffre, discute con gli amici e incontra Dio.|Canti e preghiere d’Israele: 150 salmi, o 151 nella tradizione ortodossa.|Proverbi di saggezza per la vita quotidiana.|Riflessione sul senso della vita: «vanità delle vanità».|Poema d’amore tra l’amato e l’amata.|Profezie di giudizio, di consolazione e sul Messia.|Geremia annuncia la caduta di Gerusalemme e una nuova alleanza.|Lamenti per la distruzione di Gerusalemme.|Visioni del profeta in esilio, come la valle delle ossa aride.|Daniele a Babilonia: la fossa dei leoni e visioni del futuro.|L’amore fedele di Dio per un popolo infedele, come quello di uno sposo.|Un’invasione di cavallette e la promessa dello Spirito.|Un pastore denuncia l’ingiustizia sociale.|Profezia contro Edom; il libro più breve dell’Antico Testamento.|Giona fugge da Dio, viene inghiottito da un grande pesce e predica a Ninive.|Giustizia, misericordia e Betlemme come culla del sovrano.|Annuncio della caduta di Ninive.|Il profeta interroga Dio sul male: «il giusto vivrà per la sua fede».|Il giorno del Signore e la speranza per un resto umile.|Appello a ricostruire il Tempio.|Visioni di restaurazione e del re umile in groppa a un asino.|L’ultimo profeta: annuncia il messaggero che prepara la via.|Tobia viaggia guidato dall’angelo Raffaele e guarisce il padre Tobi.|Giuditta, una vedova coraggiosa, salva la sua città da Oloferne.|Il libro di Ester con preghiere e passi che esistono solo in greco.|Elogio della Sapienza, attribuito a Salomone.|Insegnamenti di Gesù figlio di Sirach sulla vita retta.|Baruc, segretario di Geremia, scrive agli esiliati.|Lettera contro gli idoli indirizzata agli esiliati.|Preghiera e cantico dei tre giovani nella fornace ardente.|Daniele difende Susanna, accusata ingiustamente.|Daniele smaschera l’idolo Bel e sconfigge un drago.|I Maccabei insorgono contro la persecuzione greca.|Martiri e vittorie della rivolta maccabaica.|Gli ebrei d’Egitto salvati dalla persecuzione di Tolomeo.|Racconto greco del ritorno dall’esilio, con la storia delle tre guardie.|Il libro di Esdra nella versione greca (Esdra B).|Daniele nella versione greca della Settanta.|La vita di Gesù, il Messia promesso, con il Discorso della montagna.|Il vangelo più breve: Gesù in azione.|Gesù salva poveri e peccatori; parabole come quella del figlio prodigo.|Gesù, il Verbo fatto carne, e i suoi segni.|Gli apostoli diffondono la Chiesa dopo la Pentecoste.|Paolo spiega la salvezza per la fede in Cristo.|I problemi della comunità di Corinto e l’inno all’amore.|Paolo difende il suo ministero: la forza nella debolezza.|La libertà cristiana di fronte alla Legge.|La Chiesa come corpo di Cristo.|Una lettera di gioia scritta in prigione.|Cristo, capo di tutta la creazione.|La venuta del Signore e la vita santa.|Chiarimenti sul giorno del Signore.|Consigli a Timoteo per guidare la Chiesa.|Le ultime parole di Paolo: «ho conservato la fede».|Istruzioni per la Chiesa di Creta.|Paolo intercede per Onesimo, uno schiavo fuggitivo.|Cristo, sommo sacerdote della nuova alleanza.|La fede si dimostra con le opere.|Speranza per i cristiani che soffrono.|Avvertimento contro i falsi maestri.|Dio è amore: amatevi gli uni gli altri.|Breve lettera sulla verità e sull’amore.|Lettera a Gaio sull’ospitalità.|Appello a difendere la fede.|Visioni di Giovanni sulla fine dei tempi e sulla nuova Gerusalemme.",
ct:{learnTitle:"Impara la Bibbia",learnLead:"Un corso per ogni Bibbia, libro per libro. Arriva all’85% per ottenere la padronanza.",course:"Corso",xp:"XP",streak:"giorni di fila",hearts:"vite",intro:"Conosci questa Bibbia",start:"Inizia",check:"Verifica",cont:"Continua",right:"Giusto!",wrong:"Non proprio",answerWas:"Risposta corretta:",done:"Lezione completata!",gained:"Hai guadagnato",retry:"Riprova",out:"Hai finito le vite",outNote:"Ripassa e riprova.",back:"Torna al corso",progress:"completato",mastery:"Padronanza raggiunta",masteryNote:"Completa l’85% delle lezioni per sbloccare l’esame finale.",exam:"Esame finale",examNote:"20 domande. Serve l’85% per superarlo.",pass:"Superato! Conosci a fondo questa Bibbia.",fail:"Quasi! Serve l’85%.",score:"Il tuo voto",newBook:"Nuovo libro",chapters:"capitoli",read:"Leggi questo libro",review:"Ripasso",g_law:"Legge (Pentateuco)",g_history:"Libri storici",g_wisdom:"Libri sapienziali",g_prophets:"Profeti",g_gospels:"Vangeli e Atti",g_letters:"Lettere",g_apoc:"Apocalisse",qSum:"Che libro è questo?",qCh:"Quanti capitoli ha {b}?",qNext:"Quale libro viene subito dopo {b} in questa Bibbia?",qFill:"Completa il versetto ({r})",qVerse:"Da quale libro viene questo versetto?",qCanon:"{b} è nella Bibbia protestante?",qGroup:"A quale parte della Bibbia appartiene {b}?",yes:"Sì",no:"No",locked:"Bloccato",onlyEsEn:""},
intro:{ortodoxa:[["Quale testo dell’Antico Testamento usa la Chiesa ortodossa?","La Settanta, in greco","Il testo masoretico ebraico","La Vulgata latina","La Reina-Valera"],["Quanti libri ha, all’incirca, la Bibbia ortodossa?","Circa 76","66","73","81"],["Quale salmo in più contiene la Bibbia ortodossa?","Il Salmo 151","Il Salmo 119","Il Salmo 1","Il Salmo 23"],["Come chiama la tradizione ortodossa i libri assenti dal canone ebraico?","Anagignoskomena, «quelli che si leggono»","Vangeli apocrifi","Targumim","Lettere cattoliche"],["In che lingua è il testo patriarcale del Nuovo Testamento del 1904?","Greco","Latino","Ebraico","Slavo ecclesiastico"],["Quale di questi libri è nella Bibbia ortodossa ma non in quella cattolica?","3 Maccabei","Tobia","Giuditta","Sapienza"]],

art:{health:[["Digiuno e alimentazione","La tradizione ortodossa digiuna il mercoledì e il venerdì e in quattro periodi dell’anno, come la Grande Quaresima prima di Pasqua. Si rinuncia alla carne, ai latticini e a volte all’olio e al vino, e si mangia in modo semplice.","Il digiuno non è una dieta: serve a dominare l’appetito, pregare di più e condividere con chi ha bisogno. Legumi, verdure, cereali, frutta e frutta secca sono la base della tavola di digiuno.","Se sei incinta, malato o prendi farmaci, parla con il tuo medico e con il tuo sacerdote prima di digiunare: la Chiesa adatta il digiuno a ciascuno."],["Riposo e sonno","Gesù invitò i discepoli a ritirarsi e riposare. Riposare è anche prendersi cura del corpo che Dio ci ha dato.","Prova ad andare a letto a un’ora simile ogni giorno, lascia gli schermi un po’ prima di dormire e chiudi la giornata con una breve preghiera."],["Calma e preghiera","La Preghiera di Gesù («Signore Gesù Cristo, Figlio di Dio, abbi pietà di me») si recita lentamente, al ritmo calmo del respiro.","Prova cinque minuti al giorno: siediti, respira a fondo e ripeti la preghiera senza fretta. Se l’ansia non passa, chiedi aiuto a un professionista."]],
 sport:[["L’atleta della fede","San Paolo paragona la vita cristiana a una corsa: costanza, allenamento e lo sguardo fisso sul traguardo.","Fare sport con disciplina e umiltà può essere una scuola di virtù: pazienza, impegno e lavoro di squadra."],["Camminare e pellegrinare","Camminare è l’esercizio più semplice e un’antica forma di preghiera. Molti fedeli vanno a piedi in pellegrinaggio a monasteri e chiese.","Inizia con 20-30 minuti al giorno a passo comodo. Puoi pregare o ascoltare i Salmi mentre cammini."],["Corpo e anima","La Bibbia stima il corpo come tempio dello Spirito, ma mette la vita spirituale prima dell’esercizio fisico.","Un buon equilibrio: muoversi ogni giorno, mangiare con moderazione, riposare e dedicare tempo alla preghiera."]],
 more:[["Famiglia e casa","In molte case ortodosse c’è un angolo delle icone con una lampada, dove la famiglia prega insieme al mattino o alla sera.","Benedire la tavola e leggere insieme un breve passo sono abitudini semplici che uniscono la famiglia."],["Servire gli altri","La fede si vive nella carità: visitare un malato, aiutare un vicino o collaborare con la propria parrocchia."],["Gratitudine quotidiana","Prima di dormire, pensa a tre cose per cui ringraziare oggi. San Giovanni Crisostomo morì dicendo: «Gloria a Dio per tutto»."]]},

sum:"Schöpfung, Sündenfall, Sintflut und die Erzväter Abraham, Isaak, Jakob und Josef.|Mose führt Israel aus Ägypten, und Gott gibt am Sinai das Gesetz.|Gesetze über Opfer, Priestertum und Heiligkeit.|Die Zählung des Volkes und die vierzig Jahre in der Wüste.|Abschiedsreden des Mose vor dem Einzug ins Gelobte Land.|Josua erobert und verteilt das Land Kanaan.|Kreisläufe von Untreue und Rettung mit Richtern wie Debora, Gideon und Simson.|Rut, die Moabiterin, bleibt ihrer Schwiegermutter Noomi treu; sie ist die Urgroßmutter König Davids.|Samuel, König Saul und der junge David gegen Goliat.|Die Herrschaft Davids in Jerusalem.|Salomo baut den Tempel, das Reich zerfällt, und der Prophet Elija tritt auf.|Elischa und die Könige von Israel und Juda bis zum Exil in Babylon.|Stammbäume und die Herrschaft Davids neu erzählt.|Geschichte Judas von Salomo bis zum Exil.|Rückkehr aus dem Exil und Wiederaufbau des Tempels.|Nehemia baut die Mauern Jerusalems wieder auf.|Königin Ester rettet ihr Volk in Persien.|Ijob, ein leidender Gerechter, streitet mit seinen Freunden und begegnet Gott.|Lieder und Gebete Israels: 150 Psalmen, in der orthodoxen Tradition 151.|Sprüche der Weisheit für den Alltag.|Nachdenken über den Sinn des Lebens: „Windhauch, Windhauch“.|Ein Liebesgedicht zwischen dem Geliebten und der Geliebten.|Prophezeiungen über Gericht, Trost und den Messias.|Jeremia kündigt den Fall Jerusalems und einen neuen Bund an.|Klagelieder über die Zerstörung Jerusalems.|Visionen des Propheten im Exil, etwa das Feld der verdorrten Gebeine.|Daniel in Babylon: die Löwengrube und Visionen der Zukunft.|Gottes treue Liebe zu einem untreuen Volk, wie die eines Ehemanns.|Eine Heuschreckenplage und die Verheißung des Geistes.|Ein Hirte prangert soziale Ungerechtigkeit an.|Prophezeiung gegen Edom; das kürzeste Buch des Alten Testaments.|Jona flieht vor Gott, wird von einem großen Fisch verschluckt und predigt in Ninive.|Gerechtigkeit, Barmherzigkeit und Betlehem als Geburtsort des Herrschers.|Ankündigung des Falls von Ninive.|Der Prophet fragt Gott nach dem Bösen: „Der Gerechte wird durch seinen Glauben leben.“|Der Tag des Herrn und Hoffnung für einen demütigen Rest.|Aufruf zum Wiederaufbau des Tempels.|Visionen der Wiederherstellung und vom demütigen König auf einem Esel.|Der letzte Prophet kündigt den Boten an, der den Weg bereitet.|Tobias reist, geführt vom Engel Rafael, und heilt seinen Vater Tobit.|Judit, eine mutige Witwe, rettet ihre Stadt vor Holofernes.|Das Buch Ester mit Gebeten und Abschnitten, die es nur auf Griechisch gibt.|Lob der Weisheit, Salomo zugeschrieben.|Lehren Jesus’, des Sohnes Sirachs, über ein rechtschaffenes Leben.|Baruch, der Schreiber Jeremias, schreibt an die Verbannten.|Ein Brief gegen die Götzen an die Verbannten.|Gebet und Lobgesang der drei jungen Männer im Feuerofen.|Daniel verteidigt die zu Unrecht angeklagte Susanna.|Daniel entlarvt den Götzen Bel und besiegt einen Drachen.|Die Makkabäer erheben sich gegen die griechische Verfolgung.|Märtyrer und Siege des Makkabäeraufstands.|Die Juden Ägyptens werden vor der Verfolgung durch Ptolemäus gerettet.|Griechischer Bericht über die Rückkehr aus dem Exil, mit der Geschichte der drei Leibwächter.|Das Buch Esra in seiner griechischen Fassung (Esra B).|Daniel in der griechischen Fassung der Septuaginta.|Das Leben Jesu, des verheißenen Messias, mit der Bergpredigt.|Das kürzeste Evangelium: Jesus in Aktion.|Jesus rettet Arme und Sünder; Gleichnisse wie das vom verlorenen Sohn.|Jesus, das fleischgewordene Wort, und seine Zeichen.|Die Apostel breiten die Kirche nach Pfingsten aus.|Paulus erklärt die Rettung durch den Glauben an Christus.|Die Probleme der Gemeinde in Korinth und das Hohelied der Liebe.|Paulus verteidigt seinen Dienst: Kraft in der Schwachheit.|Christliche Freiheit gegenüber dem Gesetz.|Die Kirche als Leib Christi.|Ein Brief der Freude, im Gefängnis geschrieben.|Christus, das Haupt der ganzen Schöpfung.|Das Kommen des Herrn und ein heiliges Leben.|Klarstellungen über den Tag des Herrn.|Ratschläge an Timotheus zur Leitung der Kirche.|Die letzten Worte des Paulus: „Ich habe den Glauben bewahrt.“|Anweisungen für die Kirche auf Kreta.|Paulus bittet für Onesimus, einen entlaufenen Sklaven.|Christus, der Hohepriester des neuen Bundes.|Der Glaube zeigt sich in Werken.|Hoffnung für leidende Christen.|Warnung vor falschen Lehrern.|Gott ist Liebe: Liebt einander.|Kurzer Brief über Wahrheit und Liebe.|Brief an Gaius über die Gastfreundschaft.|Aufruf, für den Glauben zu kämpfen.|Visionen des Johannes über das Ende der Zeiten und das neue Jerusalem.",

art:{health:[["Fasten und Ernährung","Die orthodoxe Tradition fastet am Mittwoch und Freitag und in vier Zeiten des Jahres, etwa in der Großen Fastenzeit vor Ostern. Man verzichtet auf Fleisch, Milchprodukte und manchmal auf Öl und Wein und isst einfach.","Fasten ist keine Diät: Es soll den Appetit zügeln, mehr Zeit zum Beten schaffen und das Teilen mit Bedürftigen fördern. Hülsenfrüchte, Gemüse, Getreide, Obst und Nüsse sind die Grundlage des Fastentisches.","Wenn du schwanger, krank bist oder Medikamente nimmst, sprich vor dem Fasten mit deinem Arzt und deinem Priester: Die Kirche passt das Fasten jedem Menschen an."],["Ruhe und Schlaf","Jesus lud seine Jünger ein, sich zurückzuziehen und auszuruhen. Ruhe ist auch eine Art, für den Körper zu sorgen, den Gott uns gegeben hat.","Versuche, jeden Tag ungefähr zur gleichen Zeit schlafen zu gehen, lege Bildschirme vorher weg und beende den Tag mit einem kurzen Gebet."],["Ruhe und Gebet","Das Jesusgebet („Herr Jesus Christus, Sohn Gottes, erbarme dich meiner“) wird langsam gebetet, im ruhigen Rhythmus des Atems.","Probiere fünf Minuten am Tag: setz dich, atme tief und wiederhole das Gebet ohne Eile. Wenn die Angst nicht nachlässt, hol dir professionelle Hilfe."]],
 sport:[["Der Athlet des Glaubens","Der heilige Paulus vergleicht das christliche Leben mit einem Wettlauf: Ausdauer, Training und der Blick aufs Ziel.","Sport mit Disziplin und Demut kann eine Schule der Tugenden sein: Geduld, Einsatz und Teamgeist."],["Gehen und pilgern","Gehen ist die einfachste Bewegung und eine alte Form des Gebets. Viele Gläubige pilgern zu Fuß zu Klöstern und Kirchen.","Beginne mit 20 bis 30 Minuten am Tag in angenehmem Tempo. Du kannst beim Gehen beten oder die Psalmen hören."],["Leib und Seele","Die Bibel achtet den Leib als Tempel des Geistes, stellt aber das geistliche Leben vor die körperliche Übung.","Ein gutes Gleichgewicht: sich täglich bewegen, maßvoll essen, ruhen und Zeit für das Gebet nehmen."]],
 more:[["Familie und Zuhause","In vielen orthodoxen Häusern gibt es eine Ikonenecke mit einem Lämpchen, wo die Familie morgens oder abends gemeinsam betet.","Das Tischgebet und das gemeinsame Lesen eines kurzen Abschnitts sind einfache Bräuche, die die Familie verbinden."],["Anderen dienen","Der Glaube wird in der Nächstenliebe gelebt: einen Kranken besuchen, einem Nachbarn helfen oder in der Gemeinde mitarbeiten."],["Tägliche Dankbarkeit","Denk vor dem Schlafen an drei Dinge, für die du heute danken kannst. Der heilige Johannes Chrysostomos starb mit den Worten: „Ehre sei Gott für alles.“"]]},

sum:"Η δημιουργία, η πτώση, ο κατακλυσμός και οι πατριάρχες Αβραάμ, Ισαάκ, Ιακώβ και Ιωσήφ.|Ο Μωυσής βγάζει τον Ισραήλ από την Αίγυπτο και ο Θεός δίνει τον Νόμο στο Σινά.|Νόμοι για τις θυσίες, την ιερωσύνη και την αγιότητα.|Η απογραφή του λαού και τα σαράντα χρόνια στην έρημο.|Οι αποχαιρετιστήριοι λόγοι του Μωυσή πριν από τη Γη της Επαγγελίας.|Ο Ιησούς του Ναυή κατακτά και μοιράζει τη γη Χαναάν.|Κύκλοι απιστίας και σωτηρίας με κριτές όπως η Δεβόρρα, ο Γεδεών και ο Σαμψών.|Η Μωαβίτισσα Ρουθ, πιστή στην πεθερά της Νωεμίν, προγιαγιά του βασιλιά Δαβίδ.|Ο Σαμουήλ, ο βασιλιάς Σαούλ και ο νεαρός Δαβίδ απέναντι στον Γολιάθ.|Η βασιλεία του Δαβίδ στην Ιερουσαλήμ.|Ο Σολομών χτίζει τον Ναό, το βασίλειο διαιρείται και εμφανίζεται ο προφήτης Ηλίας.|Ο Ελισαίος και οι βασιλείς του Ισραήλ και του Ιούδα ως την αιχμαλωσία στη Βαβυλώνα.|Γενεαλογίες και η βασιλεία του Δαβίδ ξαναδιηγημένες.|Η ιστορία του Ιούδα από τον Σολομώντα ως την αιχμαλωσία.|Η επιστροφή από την αιχμαλωσία και η ανοικοδόμηση του Ναού.|Ο Νεεμίας ξαναχτίζει τα τείχη της Ιερουσαλήμ.|Η βασίλισσα Εσθήρ σώζει τον λαό της στην Περσία.|Ο Ιώβ, ένας δίκαιος που υποφέρει, συζητά με τους φίλους του και συναντά τον Θεό.|Ύμνοι και προσευχές του Ισραήλ: 150 ψαλμοί, ή 151 στην ορθόδοξη παράδοση.|Γνωμικά σοφίας για την καθημερινή ζωή.|Στοχασμός για το νόημα της ζωής: «ματαιότης ματαιοτήτων».|Ποίημα αγάπης ανάμεσα στον αγαπημένο και την αγαπημένη.|Προφητείες κρίσεως, παρηγοριάς και για τον Μεσσία.|Ο Ιερεμίας προαναγγέλλει την πτώση της Ιερουσαλήμ και μια καινή διαθήκη.|Θρήνοι για την καταστροφή της Ιερουσαλήμ.|Οράματα του προφήτη στην εξορία, όπως η κοιλάδα με τα ξερά οστά.|Ο Δανιήλ στη Βαβυλώνα: ο λάκκος των λεόντων και οράματα του μέλλοντος.|Η πιστή αγάπη του Θεού για έναν άπιστο λαό, σαν αγάπη συζύγου.|Μια πληγή από ακρίδες και η υπόσχεση του Πνεύματος.|Ένας βοσκός καταγγέλλει την κοινωνική αδικία.|Προφητεία κατά του Εδώμ· το συντομότερο βιβλίο της Παλαιάς Διαθήκης.|Ο Ιωνάς φεύγει από τον Θεό, τον καταπίνει ένα μεγάλο ψάρι και κηρύττει στη Νινευή.|Δικαιοσύνη, έλεος και η Βηθλεέμ ως τόπος γέννησης του άρχοντα.|Η αναγγελία της πτώσης της Νινευή.|Ο προφήτης ρωτά τον Θεό για το κακό: «ο δίκαιος εκ πίστεως ζήσεται».|Η ημέρα του Κυρίου και η ελπίδα για ένα ταπεινό υπόλοιπο.|Κάλεσμα για την ανοικοδόμηση του Ναού.|Οράματα αποκατάστασης και του ταπεινού βασιλιά πάνω σε γαϊδουράκι.|Ο τελευταίος προφήτης αναγγέλλει τον αγγελιαφόρο που ετοιμάζει τον δρόμο.|Ο Τωβίας ταξιδεύει με οδηγό τον άγγελο Ραφαήλ και θεραπεύει τον πατέρα του Τωβίτ.|Η Ιουδίθ, μια γενναία χήρα, σώζει την πόλη της από τον Ολοφέρνη.|Το βιβλίο της Εσθήρ με προσευχές και χωρία που σώζονται μόνο στα ελληνικά.|Εγκώμιο της Σοφίας, που αποδίδεται στον Σολομώντα.|Διδαχές του Ιησού του Σειράχ για την ενάρετη ζωή.|Ο Βαρούχ, γραμματέας του Ιερεμία, γράφει στους αιχμαλώτους.|Επιστολή κατά των ειδώλων προς τους αιχμαλώτους.|Η προσευχή και ο ύμνος των τριών παίδων στην κάμινο.|Ο Δανιήλ υπερασπίζεται τη Σωσάννα, που κατηγορήθηκε ψευδώς.|Ο Δανιήλ ξεσκεπάζει το είδωλο Βηλ και νικά έναν δράκοντα.|Οι Μακκαβαίοι ξεσηκώνονται ενάντια στον ελληνιστικό διωγμό.|Μάρτυρες και νίκες της επανάστασης των Μακκαβαίων.|Οι Ιουδαίοι της Αιγύπτου σώζονται από τον διωγμό του Πτολεμαίου.|Ελληνική αφήγηση της επιστροφής από την αιχμαλωσία, με την ιστορία των τριών σωματοφυλάκων.|Το βιβλίο του Έσδρα στην ελληνική του μορφή (Έσδρας Β΄).|Ο Δανιήλ κατά τη μετάφραση των Εβδομήκοντα.|Η ζωή του Ιησού, του επαγγελμένου Μεσσία, με την Επί του Όρους Ομιλία.|Το συντομότερο ευαγγέλιο: ο Ιησούς σε δράση.|Ο Ιησούς σώζει φτωχούς και αμαρτωλούς· παραβολές όπως του ασώτου υιού.|Ο Ιησούς, ο Λόγος που έγινε σάρκα, και τα σημεία του.|Οι απόστολοι διαδίδουν την Εκκλησία μετά την Πεντηκοστή.|Ο Παύλος εξηγεί τη σωτηρία διά της πίστεως στον Χριστό.|Τα προβλήματα της κοινότητας της Κορίνθου και ο ύμνος της αγάπης.|Ο Παύλος υπερασπίζεται τη διακονία του: η δύναμη στην αδυναμία.|Η χριστιανική ελευθερία απέναντι στον Νόμο.|Η Εκκλησία ως σώμα του Χριστού.|Μια επιστολή χαράς γραμμένη στη φυλακή.|Ο Χριστός, κεφαλή όλης της κτίσης.|Ο ερχομός του Κυρίου και η αγία ζωή.|Διευκρινίσεις για την ημέρα του Κυρίου.|Συμβουλές προς τον Τιμόθεο για την καθοδήγηση της Εκκλησίας.|Τα τελευταία λόγια του Παύλου: «την πίστιν τετήρηκα».|Οδηγίες για την Εκκλησία της Κρήτης.|Ο Παύλος μεσιτεύει για τον Ονήσιμο, έναν δραπέτη δούλο.|Ο Χριστός, αρχιερέας της καινής διαθήκης.|Η πίστη φανερώνεται με τα έργα.|Ελπίδα για τους χριστιανούς που υποφέρουν.|Προειδοποίηση για τους ψευδοδιδασκάλους.|Ο Θεός είναι αγάπη: αγαπάτε αλλήλους.|Σύντομη επιστολή για την αλήθεια και την αγάπη.|Επιστολή προς τον Γάιο για τη φιλοξενία.|Κάλεσμα να αγωνιστούμε για την πίστη.|Τα οράματα του Ιωάννη για τα έσχατα και τη νέα Ιερουσαλήμ.",

intro:{ortodoxa:[["Ποιο κείμενο της Παλαιάς Διαθήκης χρησιμοποιεί η Ορθόδοξη Εκκλησία;","Τους Εβδομήκοντα, στα ελληνικά","Το εβραϊκό μασοριτικό κείμενο","Τη λατινική Βουλγάτα","Τη Reina-Valera"],["Πόσα βιβλία έχει περίπου η ορθόδοξη Αγία Γραφή;","Περίπου 76","66","73","81"],["Ποιον επιπλέον ψαλμό περιέχει η ορθόδοξη Γραφή;","Τον Ψαλμό 151","Τον Ψαλμό 119","Τον Ψαλμό 1","Τον Ψαλμό 23"],["Πώς ονομάζει η ορθόδοξη παράδοση τα βιβλία που δεν είναι στον εβραϊκό κανόνα;","Αναγινωσκόμενα","Απόκρυφα ευαγγέλια","Ταργκούμ","Καθολικές επιστολές"],["Σε ποια γλώσσα είναι το Πατριαρχικό κείμενο της Καινής Διαθήκης του 1904;","Ελληνικά","Λατινικά","Εβραϊκά","Εκκλησιαστικά σλαβονικά"],["Ποιο από αυτά τα βιβλία υπάρχει στην ορθόδοξη αλλά όχι στην καθολική Γραφή;","Γ΄ Μακκαβαίων","Τωβίτ","Ιουδίθ","Σοφία Σολομώντος"]],
 catolica:[["Πόσα βιβλία έχει η καθολική Βίβλος;","73","66","76","81"],["Ποια σύνοδος όρισε επίσημα τον καθολικό κανόνα το 1546;","Η Σύνοδος του Τριδέντου","Η Σύνοδος της Νίκαιας","Η Β΄ Σύνοδος του Βατικανού","Η Σύνοδος της Χαλκηδόνας"],["Ποιος μετέφρασε τη Βίβλο στα λατινικά στη μετάφραση που λέγεται Βουλγάτα;","Ο άγιος Ιερώνυμος","Ο ιερός Αυγουστίνος","Ο Έρασμος","Ο Μαρτίνος Λούθηρος"],["Πώς ονομάζει η Καθολική Εκκλησία βιβλία όπως το Τωβίτ, η Ιουδίθ ή η Σοφία;","Δευτεροκανονικά","Γνωστικά απόκρυφα","Ψευδεπίγραφα","Ελάσσονα ευαγγέλια"],["Ποιος πάπας δίνει το όνομά του στην Κλημεντίνειο Βουλγάτα;","Ο Κλήμης Η΄","Ο Κλήμης Α΄","Ο Λέων ΙΓ΄","Ο Γρηγόριος ο Μέγας"],["Πόσα βιβλία έχει η καθολική Καινή Διαθήκη;","27","22","30","39"]],

art:{health:[["Νηστεία και διατροφή","Η ορθόδοξη παράδοση νηστεύει κάθε Τετάρτη και Παρασκευή και σε τέσσερις περιόδους του έτους, όπως η Μεγάλη Τεσσαρακοστή πριν από το Πάσχα. Αποφεύγονται το κρέας, τα γαλακτοκομικά και κάποτε το λάδι και το κρασί, και το φαγητό είναι λιτό.","Η νηστεία δεν είναι δίαιτα: στοχεύει να δαμάσει την όρεξη, να δώσει χρόνο στην προσευχή και να μοιραστούμε με όσους έχουν ανάγκη. Όσπρια, λαχανικά, δημητριακά, φρούτα και ξηροί καρποί είναι η βάση του νηστίσιμου τραπεζιού.","Αν είστε έγκυος, άρρωστος ή παίρνετε φάρμακα, μιλήστε με τον γιατρό και τον πνευματικό σας πριν νηστέψετε: η Εκκλησία προσαρμόζει τη νηστεία σε κάθε άνθρωπο."],["Ανάπαυση και ύπνος","Ο Ιησούς κάλεσε τους μαθητές να αποσυρθούν και να αναπαυθούν. Η ανάπαυση είναι κι αυτή φροντίδα για το σώμα που μας χάρισε ο Θεός.","Προσπαθήστε να κοιμάστε περίπου την ίδια ώρα κάθε μέρα, αφήστε τις οθόνες λίγο πριν από τον ύπνο και κλείστε τη μέρα με μια σύντομη προσευχή."],["Γαλήνη και προσευχή","Η Ευχή του Ιησού («Κύριε Ιησού Χριστέ, Υιέ του Θεού, ελέησόν με») λέγεται αργά, με τον ήρεμο ρυθμό της αναπνοής.","Δοκιμάστε πέντε λεπτά τη μέρα: καθίστε, αναπνεύστε βαθιά και επαναλάβετε την ευχή χωρίς βιασύνη. Αν το άγχος δεν υποχωρεί, ζητήστε βοήθεια από έναν ειδικό."]],
 sport:[["Ο αθλητής της πίστης","Ο απόστολος Παύλος συγκρίνει τη χριστιανική ζωή με αγώνα δρόμου: επιμονή, άσκηση και το βλέμμα στον στόχο.","Ο αθλητισμός με πειθαρχία και ταπείνωση μπορεί να γίνει σχολείο αρετών: υπομονή, κόπος και ομαδικότητα."],["Περπάτημα και προσκύνημα","Το περπάτημα είναι η πιο απλή άσκηση και ένας αρχαίος τρόπος προσευχής. Πολλοί πιστοί πηγαίνουν με τα πόδια για προσκύνημα σε μοναστήρια και εκκλησίες.","Ξεκινήστε με 20 έως 30 λεπτά τη μέρα με άνετο ρυθμό. Μπορείτε να προσεύχεστε ή να ακούτε τους Ψαλμούς ενώ περπατάτε."],["Σώμα και ψυχή","Η Γραφή τιμά το σώμα ως ναό του Πνεύματος, αλλά βάζει την πνευματική ζωή πάνω από τη σωματική άσκηση.","Μια καλή ισορροπία: κίνηση κάθε μέρα, μέτρο στο φαγητό, ανάπαυση και χρόνος για προσευχή."]],
 more:[["Οικογένεια και σπίτι","Σε πολλά ορθόδοξα σπίτια υπάρχει εικονοστάσι με καντήλι, όπου η οικογένεια προσεύχεται μαζί το πρωί ή το βράδυ.","Η ευλογία του τραπεζιού και η κοινή ανάγνωση ενός μικρού χωρίου είναι απλές συνήθειες που ενώνουν την οικογένεια."],["Διακονία των άλλων","Η πίστη ζει μέσα στην αγάπη: να επισκεφθείς έναν άρρωστο, να βοηθήσεις έναν γείτονα ή να προσφέρεις στην ενορία σου."],["Καθημερινή ευγνωμοσύνη","Πριν κοιμηθείτε, σκεφτείτε τρία πράγματα για τα οποία ευχαριστείτε σήμερα. Ο άγιος Ιωάννης ο Χρυσόστομος εκοιμήθη λέγοντας: «Δόξα τω Θεώ πάντων ένεκεν»."]]},

 protestante:[["Сколько книг в протестантской Библии?","66","73","76","81"],["Какому канону следует её Ветхий Завет?","Еврейскому канону","Канону Септуагинты","Канону Вульгаты","Эфиопскому канону"],["Кто издал первое издание Reina-Valera в 1569 году?","Касиодоро де Рейна","Сиприано де Валера","Мартин Лютер","Феликс Торрес Амат"],["Как называют издание 1569 года?","Библия Медведя","Библия Кувшина","Феррарская Библия","Иерусалимская Библия"],["Какое движение XVI века породило протестантские Библии?","Реформация","Великий раскол","Контрреформация","Просвещение"],["Какой протестантский принцип делает Писание высшим авторитетом?","Sola Scriptura","Ora et labora","Lex orandi","Ad fontes"]]},
art:{health:[["Пост и питание","В православной традиции постятся по средам и пятницам и в четыре периода года, например в Великий пост перед Пасхой. Отказываются от мяса, молочных продуктов, а иногда от масла и вина, и едят просто.","Пост — это не диета: он помогает обуздать аппетит, больше молиться и делиться с нуждающимися. Основа постного стола — бобовые, овощи, крупы, фрукты и орехи.","Если вы беременны, больны или принимаете лекарства, перед постом поговорите с врачом и с духовником: Церковь приспосабливает пост к каждому человеку."],["Отдых и сон","Иисус пригласил учеников уединиться и отдохнуть. Отдых — это тоже забота о теле, данном нам Богом.","Старайтесь ложиться спать примерно в одно и то же время, откладывайте экраны заранее и завершайте день короткой молитвой."],["Покой и молитва","Иисусову молитву («Господи Иисусе Христе, Сыне Божий, помилуй мя») читают медленно, в спокойном ритме дыхания.","Попробуйте по пять минут в день: сядьте, глубоко дышите и неспешно повторяйте молитву. Если тревога не проходит, обратитесь к специалисту."]],
 sport:[["Подвижник веры","Апостол Павел сравнивает христианскую жизнь с бегом на ристалище: постоянство, упражнение и взгляд, устремлённый к цели.","Спорт с дисциплиной и смирением может стать школой добродетелей: терпения, усердия и командной работы."],["Ходьба и паломничество","Ходьба — самое простое упражнение и древний вид молитвы. Многие верующие идут пешком в паломничество к монастырям и храмам.","Начните с 20–30 минут в день в удобном темпе. Во время ходьбы можно молиться или слушать Псалтирь."],["Тело и душа","Библия почитает тело как храм Духа, но ставит духовную жизнь выше телесных упражнений.","Хорошее равновесие: двигаться каждый день, есть умеренно, отдыхать и находить время для молитвы."]],
 more:[["Семья и дом","Во многих православных домах есть красный угол с иконами и лампадой, где семья вместе молится утром или вечером.","Молитва перед едой и совместное чтение небольшого отрывка — простые обычаи, которые объединяют семью."],["Служение другим","Вера живёт в любви к ближнему: навестить больного, помочь соседу или потрудиться в своём приходе."],["Ежедневная благодарность","Перед сном вспомните три вещи, за которые сегодня можно поблагодарить. Святитель Иоанн Златоуст скончался со словами: «Слава Богу за всё»."]]},

sum:"Creația, căderea, potopul și patriarhii Avraam, Isaac, Iacob și Iosif.|Moise scoate pe Israel din Egipt, iar Dumnezeu dă Legea pe Sinai.|Legi despre jertfe, preoție și sfințenie.|Numărătoarea poporului și cei patruzeci de ani în pustie.|Cuvântările de rămas-bun ale lui Moise înainte de intrarea în Țara Făgăduinței.|Iosua cucerește și împarte țara Canaanului.|Cicluri de necredincioșie și izbăvire cu judecători precum Debora, Ghedeon și Samson.|Rut moabiteanca, credincioasă soacrei sale Noemi, străbunica regelui David.|Samuel, regele Saul și tânărul David în fața lui Goliat.|Domnia lui David la Ierusalim.|Solomon zidește Templul, regatul se împarte și apare proorocul Ilie.|Elisei și regii lui Israel și Iuda până la robia babilonică.|Genealogii și domnia lui David povestite din nou.|Istoria lui Iuda de la Solomon până la robie.|Întoarcerea din robie și rezidirea Templului.|Neemia rezidește zidurile Ierusalimului.|Regina Estera își salvează poporul în Persia.|Iov, un drept care suferă, discută cu prietenii săi și Îl întâlnește pe Dumnezeu.|Cântările și rugăciunile lui Israel: 150 de psalmi, sau 151 în tradiția ortodoxă.|Proverbe de înțelepciune pentru viața de zi cu zi.|Reflecție asupra sensului vieții: „deșertăciunea deșertăciunilor”.|Poem de iubire între iubit și iubită.|Prorociri despre judecată, mângâiere și Mesia.|Ieremia vestește căderea Ierusalimului și un legământ nou.|Plângeri pentru distrugerea Ierusalimului.|Vedeniile proorocului în robie, precum valea oaselor uscate.|Daniel în Babilon: groapa cu lei și vedenii despre viitor.|Iubirea credincioasă a lui Dumnezeu față de un popor necredincios, ca a unui soț.|O invazie de lăcuste și făgăduința Duhului.|Un păstor denunță nedreptatea socială.|Prorocie împotriva Edomului; cea mai scurtă carte a Vechiului Testament.|Iona fuge de Dumnezeu, este înghițit de un pește mare și propovăduiește în Ninive.|Dreptate, milostivire și Betleemul ca loc de naștere al stăpânitorului.|Vestirea căderii Ninivei.|Proorocul Îl întreabă pe Dumnezeu despre rău: „dreptul prin credință va fi viu”.|Ziua Domnului și nădejdea pentru o rămășiță smerită.|Chemare la rezidirea Templului.|Vedenii ale restaurării și ale regelui smerit călare pe un asin.|Ultimul prooroc vestește pe trimisul care pregătește calea.|Tobie călătorește călăuzit de îngerul Rafael și își vindecă tatăl, pe Tobit.|Iudita, o văduvă curajoasă, își salvează cetatea de Olofern.|Cartea Esterei cu rugăciuni și pasaje care există doar în greacă.|Lauda Înțelepciunii, atribuită lui Solomon.|Învățăturile lui Isus, fiul lui Sirah, despre viața dreaptă.|Baruh, secretarul lui Ieremia, le scrie celor robiți.|O epistolă împotriva idolilor către cei robiți.|Rugăciunea și cântarea celor trei tineri în cuptorul de foc.|Daniel o apără pe Suzana, acuzată pe nedrept.|Daniel demască idolul Bel și învinge un balaur.|Macabeii se ridică împotriva persecuției grecești.|Mucenicii și biruințele răscoalei Macabeilor.|Iudeii din Egipt sunt salvați de persecuția lui Ptolemeu.|Relatare grecească a întoarcerii din robie, cu povestea celor trei străjeri.|Cartea lui Ezdra în versiunea grecească (Ezdra B).|Daniel în versiunea grecească a Septuagintei.|Viața lui Iisus, Mesia cel făgăduit, cu Predica de pe Munte.|Cea mai scurtă Evanghelie: Iisus în acțiune.|Iisus îi mântuiește pe săraci și pe păcătoși; pilde precum cea a fiului risipitor.|Iisus, Cuvântul făcut trup, și semnele Lui.|Apostolii răspândesc Biserica după Cincizecime.|Pavel explică mântuirea prin credința în Hristos.|Problemele comunității din Corint și imnul iubirii.|Pavel își apără slujirea: puterea în slăbiciune.|Libertatea creștină față de Lege.|Biserica, trupul lui Hristos.|O epistolă a bucuriei scrisă din închisoare.|Hristos, capul întregii creații.|Venirea Domnului și viața sfântă.|Lămuriri despre ziua Domnului.|Sfaturi către Timotei pentru conducerea Bisericii.|Ultimele cuvinte ale lui Pavel: „credința am păzit”.|Îndrumări pentru Biserica din Creta.|Pavel mijlocește pentru Onisim, un sclav fugar.|Hristos, Arhiereul legământului celui nou.|Credința se arată prin fapte.|Nădejde pentru creștinii care suferă.|Avertisment împotriva învățătorilor mincinoși.|Dumnezeu este iubire: iubiți-vă unii pe alții.|Scurtă epistolă despre adevăr și iubire.|Epistolă către Gaius despre ospitalitate.|Chemare de a lupta pentru credință.|Vedeniile lui Ioan despre sfârșitul vremurilor și noul Ierusalim.",

art:{health:[["Post și alimentație","Tradiția ortodoxă postește miercurea și vinerea și în patru perioade ale anului, precum Postul Mare dinaintea Paștilor. Se renunță la carne, la lactate și uneori la ulei și vin, iar mâncarea este simplă.","Postul nu este o dietă: urmărește stăpânirea poftei, mai multă rugăciune și împărțirea cu cei în nevoie. Leguminoasele, legumele, cerealele, fructele și nucile sunt baza mesei de post.","Dacă ești însărcinată, bolnav sau iei medicamente, vorbește cu medicul și cu duhovnicul înainte de a posti: Biserica potrivește postul fiecărui om."],["Odihnă și somn","Iisus i-a chemat pe ucenici să se retragă și să se odihnească. Odihna este și ea o grijă pentru trupul pe care ni l-a dat Dumnezeu.","Încearcă să te culci cam la aceeași oră în fiecare zi, lasă ecranele deoparte înainte de somn și încheie ziua cu o rugăciune scurtă."],["Liniște și rugăciune","Rugăciunea lui Iisus („Doamne Iisuse Hristoase, Fiul lui Dumnezeu, miluiește-mă”) se rostește încet, în ritmul liniștit al respirației.","Încearcă cinci minute pe zi: așază-te, respiră adânc și repetă rugăciunea fără grabă. Dacă neliniștea nu trece, cere ajutorul unui specialist."]],
 sport:[["Atletul credinței","Sfântul Pavel aseamănă viața creștină cu o alergare: statornicie, antrenament și privirea ațintită spre țintă.","Sportul făcut cu disciplină și smerenie poate fi o școală a virtuților: răbdare, efort și lucru în echipă."],["Mers și pelerinaj","Mersul pe jos este cel mai simplu exercițiu și o formă veche de rugăciune. Mulți credincioși merg pe jos în pelerinaj la mănăstiri și biserici.","Începe cu 20–30 de minute pe zi, într-un ritm confortabil. Poți să te rogi sau să asculți Psalmii în timp ce mergi."],["Trup și suflet","Biblia cinstește trupul ca templu al Duhului, dar pune viața duhovnicească înaintea exercițiului trupesc.","Un echilibru bun: mișcare zilnică, cumpătare la mâncare, odihnă și timp pentru rugăciune."]],
 more:[["Familie și casă","În multe case ortodoxe există un colț cu icoane și o candelă, unde familia se roagă împreună dimineața sau seara.","Binecuvântarea mesei și citirea împreună a unui pasaj scurt sunt obiceiuri simple care unesc familia."],["Slujirea celorlalți","Credința se trăiește în dragoste: să vizitezi un bolnav, să ajuți un vecin sau să te implici în parohia ta."],["Recunoștință zilnică","Înainte de culcare, gândește-te la trei lucruri pentru care să mulțumești astăzi. Sfântul Ioan Gură de Aur a murit spunând: „Slavă lui Dumnezeu pentru toate”."]]},

// ---------- Datos: trozos, caché en memoria y en el dispositivo (IndexedDB) ----------
const MEM={};
let DB=null;
function idb(){if(DB)return DB;DB=new Promise(res=>{try{const r=indexedDB.open('phos',1);r.onupgradeneeded=()=>r.result.createObjectStore('chunks');r.onsuccess=()=>res(r.result);r.onerror=()=>res(null)}catch(e){res(null)}});return DB}
async function idbGet(k){const db=await idb();if(!db)return null;return new Promise(res=>{try{const q=db.transaction('chunks').objectStore('chunks').get(k);q.onsuccess=()=>res(q.result||null);q.onerror=()=>res(null)}catch(e){res(null)}})}
async function idbPut(k,v){const db=await idb();if(!db)return;try{db.transaction('chunks','readwrite').objectStore('chunks').put(v,k)}catch(e){}}
async function getChunk(id,n){
 const k=id+'/'+n;if(MEM[k])return MEM[k];
 let d=await idbGet(k);
 if(!d){const r=await fetch('data/'+k+'.json');if(!r.ok)throw new Error('load');d=await r.json();idbPut(k,d)}
 return MEM[k]=d;
}
const metaCache={};
function bookMeta(id){
 if(metaCache[id])return metaCache[id];
 const m=MANIFEST[id];const books=m.b.map(([c,k,f])=>({c,f,chs:typeof k==='number'?Array.from({length:k},(_,i)=>String(i+1)):k.split(',')}));
 const map={};books.forEach(b=>map[b.c]=b);
 return metaCache[id]={books,map,scheme:m.s,n:m.n};
}
async function getBook(id,c){const m=bookMeta(id).map[c];if(!m)return null;const ch=await getChunk(id,m.f);return ch[c]?{c,ch:ch[c],chs:m.chs}:null}
async function loadAll(id,onp){const n=MANIFEST[id].n;for(let i=0;i<n;i++){if(onp)onp(i,n);await getChunk(id,i)}}

// ---------- Numeración de los Salmos (Septuaginta/Vulgata ↔ hebrea) ----------
function lxx2heb(c,v){c=+c;if(c<=8)return[c,v];if(c===9)return v<=21?[9,v]:[10,v-21];if(c<=112)return[c+1,v];if(c===113)return v<=8?[114,v]:[115,v-8];if(c===114)return[116,v];if(c===115)return[116,v+9];if(c<=145)return[c+1,v];if(c===146)return[147,v];if(c===147)return[147,v+11];return[c,v]}
function heb2lxx(c,v){c=+c;if(c<=9)return[c,v];if(c===10)return[9,v+21];if(c<=113)return[c-1,v];if(c===114)return[113,v];if(c===115)return[113,v+8];if(c===116)return v<=9?[114,v]:[115,v-9];if(c<=146)return[c-1,v];if(c===147)return v<=11?[146,v]:[147,v-11];return[c,v]}
function mapRef(fromId,toId,book,c,v){
 const a=bookMeta(fromId).scheme,b=bookMeta(toId).scheme;
 if(book!=='PSA'||a===b)return[String(c),v];
 const r=a==='lxx'?lxx2heb(c,v):heb2lxx(c,v);return[String(r[0]),r[1]];
}

 });
 units.forEach((u,i)=>{if(i===0)return;u.id='u'+i;u.title=ct('g_'+u.g);u.lessons=u.books.concat(['rev:'+i])});

function addXP(n){const s=stats();s.xp+=n;const t=today();
 if(s.last!==t){const y=new Date(Date.now()-864e5).toISOString().slice(0,10);s.streak=s.last===y?s.streak+1:1;s.last=t}
 store.set('stats',s)}

const KEY={GEN:[1,2,3,6,7,12,22,37,45],EXO:[3,12,14,20],NUM:[13,14],DEU:[6,34],JOS:[6],JDG:[7,16],RUT:[1],"1SA":[3,16,17],"2SA":[7],"1KI":[3,18,19],"2KI":[2,5],NEH:[2],EST:[4],JOB:[1,42],PSA:[1,23,51,91,121,139],PRO:[3],ECC:[3],ISA:[6,9,40,53],JER:[1,31],EZE:[37],DAN:[3,6],JON:[1,2,3],MIC:[5],MAT:[2,5,6,14,26,27,28],MAR:[1,4,16],LUK:[1,2,10,15,24],JOH:[1,3,6,11,20,21],ACT:[2,9,27],ROM:[8,12],"1CO":[13,15],GAL:[5],EPH:[6],PHI:[2,4],HEB:[11],JAM:[2],"1JO":[4],REV:[1,21,22],TOB:[5],JDT:[13],"1MA":[2]};

function chOf(br,c){const b=COURSE_META[br].books.find(x=>x[0]===c);return b?b[1]:0}
function mcq(prompt,correct,wrongs,extra){return{type:'mcq',prompt,extra,options:shuffle([correct].concat(wrongs)),answer:correct}}
function qGen(br,c){
 const books=COURSE_META[br].books.map(b=>b[0]).filter(x=>SUM[x]);
 const same=books.filter(x=>GOF[x]===GOF[c]);
 const L=CL()==='es'?0:1;
 const gens=[];
 gens.push(()=>{const w=pickN(same.length>3?same:books,3,[c]);return mcq(ct('qSum'),bname(c),w.map(bname),sumOf(c))});
 gens.push(()=>{const n=chOf(br,c);const s=new Set();while(s.size<3){const d=n+(rnd(2)?1:-1)*(1+rnd(Math.max(3,Math.round(n*.3))));if(d>0&&d!==n)s.add(d)}return mcq(fmt(ct('qCh'),{b:bname(c)}),String(n),[...s].map(String))});
 const i=books.indexOf(c);
 if(i<books.length-1)gens.push(()=>{const nx=books[i+1];return mcq(fmt(ct('qNext'),{b:bname(c)}),bname(nx),pickN(books,3,[nx,c]).map(bname))});
 gens.push(()=>{const g=GOF[c];const others=shuffle(Object.keys(GROUP).filter(x=>x!==g)).slice(0,3);return mcq(fmt(ct('qGroup'),{b:bname(c)}),ct('g_'+g),others.map(x=>ct('g_'+x)))});
 if(br!=='protestante'&&NOTPROT.has(c))gens.push(()=>mcq(fmt(ct('qCanon'),{b:bname(c)}),ct('no'),[ct('yes')]));
 if(hasV(br,c)){
  const verse=()=>{const b=VB[vsrc(br)+':'+c];const chs=b.chs;for(let k=0;k<20;k++){const ch=chs[rnd(chs.length)];const vv=b.ch[ch];const v=vv[rnd(vv.length)];if(v[1].length>40&&v[1].length<260)return[ch,v]}return null};
  gens.push(()=>{const r=verse();if(!r)return null;const [ch,[vn,tx]]=r;const words=tx.split(/\s+/);const cand=words.map((w,k)=>[w.replace(/[^\p{L}]/gu,''),k]).filter(([w])=>w.length>=5);if(!cand.length)return null;const [w,k]=cand[rnd(cand.length)];
   const pool=[];for(let z=0;z<40&&pool.length<3;z++){const o=verse();if(!o)continue;o[1][1].split(/\s+/).map(x=>x.replace(/[^\p{L}]/gu,'')).filter(x=>x.length>=5&&x.toLowerCase()!==w.toLowerCase()&&!pool.includes(x)).slice(0,1).forEach(x=>pool.push(x))}
   if(pool.length<3)return null;const shown=words.map((x,j)=>j===k?x.replace(w,'_____'):x).join(' ');
   return mcq(fmt(ct('qFill'),{r:bname(c)+' '+ch+', '+vn}),w,pool,shown)});
  const keyCh=()=>{const b=VB[vsrc(br)+':'+c];const lxx=bookMeta(vsrc(br)).scheme==='lxx';const ks=(KEY[c]||[]).map(x=>c==='PSA'&&lxx?String(heb2lxx(x,1)[0]):String(x)).filter(x=>b.ch[x]);return ks.length?ks[rnd(ks.length)]:b.chs[rnd(b.chs.length)]};
  const clean=x=>x.length>220?x.slice(0,217)+'…':x;
  gens.push(()=>{const b=VB[vsrc(br)+':'+c];const ch=keyCh();const vv=b.ch[ch];if(!vv||vv.length<6)return null;const i=rnd(vv.length-1);const nx=vv[i+1][1];const others=pickN(vv.filter((_,k)=>k!==i&&k!==i+1).map(x=>x[1]),3,[nx]);if(others.length<3)return null;
   const q=mcq(ct('qNextV')+' ('+bname(c)+' '+ch+')',clean(nx),others.map(clean),clean(vv[i][1]));return q});
  gens.push(()=>{const b=VB[vsrc(br)+':'+c];const ch=keyCh();const vv=(b.ch[ch]||[]).filter(x=>x[1].length<200);if(vv.length<4)return null;const i=rnd(vv.length-2);const seq=b.ch[ch].slice(b.ch[ch].indexOf(vv[i]),b.ch[ch].indexOf(vv[i])+3);if(seq.length<3||seq.some(x=>x[1].length>200))return null;
   return {type:'order',prompt:ct('qOrder')+' ('+bname(c)+' '+ch+')',items:seq.map(x=>x[1]),answer:seq.map(x=>x[1])}});
  gens.push(()=>{const r=verse();if(!r)return null;const okb=same.filter(x=>hasV(br,x));const w=pickN(okb.length>3?okb:books,3,[c]);return mcq(ct('qVerse'),bname(c),w.map(bname),'«'+r[1][1]+'»')});
 }
 return gens.map(g=>()=>{const q=g();if(q){q.wk=c;q.wbr=br}return q});
}
function buildLesson(br,id){
 if(id==='intro'){const L=CX[CL()]?CX[CL()].intro[br]:INTRO[br][CL()];return shuffle(L).map(q=>mcq(q[0],q[1],q.slice(2)))}
 if(id.startsWith('rev:')){const u=courseUnits(br)[+id.slice(4)];return shuffle(u.books).flatMap(c=>shuffle(qGen(br,c)).slice(0,2).map(g=>g())).filter(Boolean).slice(0,8)}
 if(id==='exam'){const books=COURSE_META[br].books.map(b=>b[0]).filter(x=>SUM[x]);const out=[];for(let k=0;k<60&&out.length<20;k++){const c=books[rnd(books.length)];const g=qGen(br,c);const q=g[rnd(g.length)]();if(q)out.push(q)}return out}
 const qs=shuffle(qGen(br,id)).map(g=>g()).filter(Boolean).slice(0,6);
 return [{type:'card',book:id}].concat(qs);
}

 try{await needVerses(br,need)}catch(e){}
 const items=buildLesson(br,id);
 LS={br,id,items,i:0,hearts:id==='exam'?Infinity:3,right:0,total:items.filter(x=>x.type!=='card').length,sel:null,checked:false};

function drawLesson(){

 }
 view.innerHTML=`<div class="lhead"><button class="iconbtn x" id="quit" aria-label="${esc(ct('back'))}"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button><div class="pbar small"><i style="width:${per}%"></i></div>${LS.hearts!==Infinity?`<span class="hearts" aria-label="${LS.hearts} ${esc(ct('hearts'))}"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="#C0392B"><path d="M12 21s-8-5.2-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 5.8-8 11-8 11z"/></svg>${LS.hearts}</span>`:''}</div>
 <div class="lbody">${body}</div><div class="lfoot" id="foot"><button class="btn" id="act" ${(it.type==='mcq'&&LS.sel===null)||(it.type==='order'&&(LS.pick||[]).length<it.items.length)?'disabled':''}>${esc(it.type==='card'?ct('cont'):ct('check'))}</button></div>`;
 $('#quit').onclick=()=>{LS=null;go('learn')};
 const rb=$('#readB');if(rb)rb.onclick=()=>{const b=it.book;LS=null;go('chapters',{sec:'bible',ed:COURSE_ED[S.course],book:b})};
 view.querySelectorAll('.opt').forEach(x=>x.onclick=()=>{if(LS.checked)return;LS.sel=+x.dataset.o;view.querySelectorAll('.opt').forEach(y=>y.setAttribute('aria-pressed',y===x));$('#act').disabled=false});
 view.querySelectorAll('[data-pk]').forEach(x=>x.onclick=()=>{if(LS.checked)return;LS.pick.push(+x.dataset.pk);drawLesson()});

 $('#act').onclick=()=>{
  if(it.type==='card'||it.type==='lcard'){LS.i++;return next()}
  if(it.type==='order'&&!LS.checked){
   LS.checked=true;const got=LS.pick.map(k=>it.shown[k]);const ok=got.every((x,k)=>x===it.answer[k]);
   view.querySelectorAll('[data-un]').forEach((y,k)=>y.classList.add(got[k]===it.answer[k]?'ok':'bad'));
   recWeak(it,ok);if(ok)LS.right++;else{if(LS.hearts!==Infinity)LS.hearts--;if(LS.id!=='exam')LS.items.push({type:'order',prompt:it.prompt,items:it.items,answer:it.answer})}
   $('#foot').className='lfoot '+(ok?'good':'nogood');
   $('#foot').insertAdjacentHTML('afterbegin',`<div class="fb" role="status"><b>${esc(ok?ct('right'):ct('wrong'))}</b>${ok?'':`<span>${esc(ct('answerWas'))} ${it.answer.map((x,k)=>(k+1)+'. '+x).map(esc).join(' ')}</span>`}</div>`);
   $('#act').textContent=ct('cont');$('#act').disabled=false;return;
  }

   view.querySelectorAll('.opt').forEach((y,k)=>{if(it.options[k]===it.answer)y.classList.add('ok');else if(k===LS.sel)y.classList.add('bad')});
   recWeak(it,ok);if(ok)LS.right++;else{if(LS.hearts!==Infinity)LS.hearts--;if(LS.id!=='exam')LS.items.push(Object.assign({},it,{options:shuffle(it.options)}))}
   $('#foot').className='lfoot '+(ok?'good':'nogood');

   $('#act').textContent=ct('cont');return;
  }
  LS.i++;LS.sel=null;LS.pick=null;LS.checked=false;next();
 };
}

const VOTD="JOH 3:16|PSA 23:1|PHI 4:13|ROM 8:28|PRO 3:5|ISA 41:10|MAT 11:28|JER 29:11|1CO 13:4|PSA 46:1|MAT 5:9|JOH 14:6|ROM 12:12|GAL 5:22|HEB 11:1|1JO 4:8|PSA 119:105|MAT 6:33|ISA 40:31|JOS 1:9|PSA 27:1|JOH 1:1|MAT 5:3|LUK 6:31|2TI 1:7|JAM 1:5|PSA 34:8|ROM 5:8|EPH 2:8|COL 3:23|1PE 5:7|PSA 37:4|PRO 16:3|MIC 6:8|MAT 22:37|JOH 15:13|ROM 15:13|PSA 121:1|LAM 3:22|2CO 5:17".split('|');
const dayIdx=()=>Math.floor((Date.now()-new Date(new Date().getFullYear(),0,0))/864e5);
function planChunks(ed){const out=[];bookMeta(ed).books.forEach(b=>b.chs.forEach(c=>out.push([b.c,c])));const per=Math.ceil(out.length/365);const days=[];for(let i=0;i<365;i++)days.push(out.slice(i*per,(i+1)*per));return days.filter(d=>d.length)}
function planRange(d){if(!d.length)return '';const a=d[0],z=d[d.length-1];return a[0]===z[0]?`${bname(a[0])} ${a[1]}–${z[1]}`:`${bname(a[0])} ${a[1]} – ${bname(z[0])} ${z[1]}`}
function homeExtras(){
 const ref=VOTD[dayIdx()%VOTD.length];const [b,cv]=ref.split(' ');const [c,v]=cv.split(':');
 const p=store.get('plan',null);let plan='';
 if(p&&MANIFEST[p.ed]){const days=planChunks(p.ed);const n=Math.min(p.done||0,days.length-1);
  plan=`<div class="card"><div class="t">${esc(t('plan'))}<span class="pill soft">${esc(t('planDay').replace('{n}',n+1))}</span></div><div class="s">${esc(planRange(days[n]))} · ${esc(edName(p.ed))}</div><div class="pbar small" style="height:8px;margin-top:10px"><i style="width:${Math.round(n/days.length*100)}%"></i></div><div class="nav" style="margin-top:12px"><button id="plR">${esc(t('readBtn'))}</button><button id="plD" class="btn ghost">${esc(t('planDone'))}</button></div></div>`}
 else plan=`<div class="card"><div class="t">${esc(t('plan'))}</div><button class="btn" id="plS" style="width:100%;margin-top:10px">${esc(t('planStart'))}</button></div>`;
 return `<div class="card main" id="votd"><div class="t">${esc(t('votd'))}</div><div class="s" id="votdTxt" style="font-family:'Noto Serif',serif;font-size:18px;line-height:1.6;color:#F6F1E7;margin-top:8px">…</div><div class="s" style="margin-top:6px;color:#E2C27A;font-weight:700">${esc(bname(b))} ${c}, ${v}</div></div>`+plan;
}
async function bindHomeExtras(){
 const ref=VOTD[dayIdx()%VOTD.length];const [b,cv]=ref.split(' ');const [c,v]=cv.split(':');
 const src=TRMAP.protestante[LANG]||'en-kjv';
 try{const bk=await getBook(src,b);const [mc,mv]=mapRef('reina-valera-1909',src,b,c,+v);const row=bk&&bk.ch[mc]&&bk.ch[mc].find(r=>r[0]===mv);const el=$('#votdTxt');if(el&&row){el.textContent=row[1];el.lang=TRLANG[src]}}catch(e){}
 const vd=$('#votd');if(vd){vd.style.cursor='pointer';vd.onclick=()=>{const [oc,ov]=mapRef('reina-valera-1909','ortodoxa-griega',b,c,+v);const ed=bookMeta('ortodoxa-griega').map[b]?'ortodoxa-griega':'reina-valera-1909';go('read',{ed,book:b,ch:ed==='ortodoxa-griega'?oc:c,hl:ed==='ortodoxa-griega'?ov:+v})}}
 const ps=$('#plS');if(ps)ps.onclick=()=>{const last=store.get('last',null);store.set('plan',{ed:last&&MANIFEST[last.ed]&&ED[last.ed]?last.ed:'ortodoxa-griega',done:0,start:today()});renderHome()};
 const p=store.get('plan',null);
 const pr=$('#plR');if(pr)pr.onclick=()=>{const d=planChunks(p.ed)[Math.min(p.done||0,364)];go('read',{ed:p.ed,book:d[0][0],ch:d[0][1],hl:null})};
 const pd=$('#plD');if(pd)pd.onclick=()=>{p.done=(p.done||0)+1;store.set('plan',p);addXP(5);renderHome()};
}
