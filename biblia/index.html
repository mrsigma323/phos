 giorno","La profetessa Anna serve Dio nel tempio con digiuni e preghiere, ed è tra le prime a riconoscere il Bambino Gesù. Il digiuno perseverante affina lo sguardo del cuore."],["Gesù digiuna nel deserto","Prima di iniziare la sua missione, Gesù digiuna quaranta giorni e vince la tentazione con la Parola: «Non di solo pane vivrà l’uomo». La Grande Quaresima imita questi quaranta giorni."],["Digiunare nel segreto","Gesù dà per scontato che i suoi discepoli digiuneranno, ma chiede di farlo senza ostentazione, con il volto lavato. Il digiuno è una cosa tra l’anima e il Padre, che vede nel segreto."],["Quando lo sposo sarà loro tolto","Finché Gesù è con loro, i discepoli non digiunano; lo faranno quando sarà loro tolto. Per questo la Chiesa digiuna il venerdì, giorno della Croce, e unisce sempre il digiuno alla preghiera."],["La Chiesa digiuna e prega","La prima comunità cristiana digiuna e prega prima di inviare Paolo e Barnaba, e anche quando sceglie i suoi presbiteri. Il digiuno accompagna le decisioni importanti della Chiesa."]],"pray":[["Meditare giorno e notte","Il giusto medita la Parola di Dio giorno e notte, come un albero piantato lungo corsi d’acqua. Meditare non è svuotare la mente, ma riempirla lentamente di ciò che Dio ha detto."],["Anna effonde la sua anima","Anna prega in silenzio, muovendo solo le labbra, con il cuore spezzato. Il sacerdote non la capisce, ma Dio sì. La preghiera sincera non ha bisogno di belle parole."],["La preghiera di Salomone","Salomone riconosce che neppure i cieli possono contenere Dio e, tuttavia, gli chiede di ascoltare dal tempio. Ogni preghiera è un incontro tra la grandezza di Dio e la nostra piccolezza."],["La brezza leggera","Dio non era nel vento, né nel terremoto, né nel fuoco, ma in un sussurro di brezza leggera. Per ascoltarlo serve il silenzio: è il cuore della preghiera esicasta della tradizione ortodossa."],["Preghiera del mattino e della sera","Il salmista prega all’alba ed eleva la sua preghiera come incenso alla sera; Daniele prega tre volte al giorno. Pregare a orari fissi dà forma alla giornata ed è alla radice della preghiera della Chiesa."],["Dal profondo","L’anima ha sete di Dio come la cerva dell’acqua, e grida dal profondo aspettandolo più che le sentinelle l’aurora. I Salmi insegnano a pregare anche dalla tristezza."],["La mia anima riposa in silenzio","«Solo in Dio riposa l’anima mia», come un bambino in braccio a sua madre. La preghiera non sempre parla: a volte consiste solo nello stare in pace davanti a Dio."],["Meditare le sue opere e la sua Parola","Ricordare ciò che Dio ha fatto e meditare i suoi comandamenti sostiene la fede nei tempi difficili. Leggere lentamente un versetto e tornarci sopra è una forma semplice di meditazione."],["Giona nel ventre del pesce","Nel luogo più buio, Giona si ricorda del Signore e la sua preghiera giunge fino a lui. Nessun luogo è troppo lontano per pregare."],["La preghiera dell’umile penetra le nubi","Il Siracide insegna che la preghiera dell’umile arriva fino a Dio e non si dà pace finché non è ascoltata. L’umiltà è la porta di ogni vera preghiera."],["Il Padre nostro","Gesù insegna a pregare nel segreto, senza sprecare parole, e ci lascia il Padre nostro. È la preghiera che la Chiesa recita in ogni Divina Liturgia e che trova posto in ogni momento della giornata."],["Chiedete e vi sarà dato","Gesù incoraggia a chiedere, cercare e bussare con la fiducia di un figlio. Il Padre dà il più bello dei doni: lo Spirito Santo."],["Pregare sempre, senza stancarsi","La vedova insistente insegna a pregare senza stancarsi, e san Paolo chiede di pregare incessantemente. I monaci ortodossi lo vivono ripetendo una breve preghiera durante tutto il giorno."],["Abbi pietà di me peccatore","Il pubblicano non osa alzare gli occhi e dice soltanto: «O Dio, abbi pietà di me peccatore». Da qui nasce la Preghiera di Gesù: «Signore Gesù Cristo, Figlio di Dio, abbi pietà di me»."],["Gesù si ritira a pregare","Prima dell’alba, in luoghi deserti o tutta la notte sul monte: Gesù cerca momenti da solo con il Padre. Se lui ne aveva bisogno, anche noi."],["Getsemani: sia fatta la tua volontà","Nella più grande angoscia, Gesù prega con totale sincerità e conclude: «Sia fatta la tua volontà». Pregare non è convincere Dio, ma unirsi a ciò che lui vuole."],["Maria custodiva tutto nel suo cuore","La Madre di Dio non capiva tutto, ma custodiva e meditava ogni cosa nel suo cuore. È il modello della meditazione cristiana: accogliere la Parola, custodirla e lasciarla maturare."],["La pace che supera ogni intelligenza","Quando non sappiamo che cosa chiedere, lo Spirito prega in noi. San Paolo invita a presentare tutto a Dio con gratitudine e a pensare a ciò che è vero, buono e bello: così arriva la pace di Dio."]]},"de":{"rest":[["Gott ruhte am siebten Tag","Ruhe ist keine Faulheit: Sie gehört zur Schöpfung. Gott vollendet sein Werk und segnet den siebten Tag. Einen Tag in der Woche innezuhalten erinnert uns daran, dass die Welt nicht allein von unserer Mühe abhängt."],["Der Sabbat ist für den Menschen da","Mose verbindet die Ruhe mit der Freiheit: In Ägypten hatten die Sklaven keine Ruhe. Jesus fasst es zusammen: Der Sabbat ist um des Menschen willen gemacht. Ruhe ist ein Geschenk, das wir auch anderen geben sollen."],["Ruhe für das Land und die Tiere","Das Gesetz verlangt Ruhe auch für Rind und Esel und für das Land, das alle sieben Jahre brachliegt. Gottes Fürsorge reicht über die ganze Schöpfung, und unsere sollte es auch."],["Elia: schlafen, essen und weitergehen","Erschöpft will Elia aufgeben. Gott macht ihm keine Vorwürfe: Er lässt ihn schlafen, gibt ihm Brot und Wasser und schickt ihn erst danach wieder auf den Weg. Manchmal ist Ausruhen das Geistlichste."],["In Frieden schlafen","Der Psalmist schläft mitten in der Gefahr ruhig, weil er sich behütet weiß. Den Tag vor dem Schlafen Gott anzuvertrauen ist ein alter christlicher Brauch, der der Nacht Gelassenheit schenkt."],["Seinen Freunden gibt er es im Schlaf","Früh aufstehen und spät sich niederlegen voller Sorge fügt dem nichts hinzu, was Gott baut. Der Prediger bemerkt, dass der Schlaf des Arbeiters süß ist: maßvoll arbeiten und vertrauen schenkt Ruhe."],["Zum frischen Wasser","Der Gute Hirte führt nicht nur, er lässt auch ruhen. Die grünen Auen und das stille Wasser sind das Bild einer Seele, die sich umsorgen lässt und neue Kraft schöpft."],["Durch Stillesein und Hoffen","„Seid stille und erkennt, dass ich Gott bin.“ Jesaja fügt hinzu, dass im Stillesein und Hoffen unsere Stärke liegt. Innere Stille ist eine Form der Ruhe, die das heutige Leben dringend braucht."],["Die auf den Herrn harren","Gott wird nicht müde noch matt, und er gibt dem Müden Kraft. Wer auf ihn hofft, bekommt neue Kraft wie ein Adler. Wahre Ruhe beginnt damit zu wissen, von wem man abhängt."],["Alles hat seine Zeit","Es gibt eine Zeit zum Arbeiten und eine Zeit zum Aufhören. Besser eine Handvoll mit Ruhe als beide Hände voll Mühe: Der Prediger lädt ein, die Anstrengung zu bemessen und nicht nur zum Leisten zu leben."],["Der gesunde Schlaf des Maßvollen","Jesus Sirach verbindet Tisch und Schlaf: Wer maßvoll isst, schläft gut und steht mit klarem Kopf auf. Es ist eine praktische Weisheit, die die orthodoxe Tradition in ihrem Gleichgewicht zwischen Fasten und Essen bewahrt."],["Kommt her zu mir, ich will euch erquicken","Jesus bietet den Müden und Beladenen Ruhe an, nicht indem er jede Last wegnimmt, sondern indem er sie teilt: Sein Joch ist sanft. Es ist eine Ruhe der Seele, die aus Sanftmut und Demut kommt."],["Ruht ein wenig","Jesus sieht seine Jünger erschöpft und führt sie an einen stillen Ort. Mit Marta und Maria lehrt er dasselbe: Bei vielen Aufgaben ist nur eines notwendig, sich hinzusetzen und ihm zuzuhören."],["Jesus schläft im Sturm","Während der Wind das Boot schüttelt, schläft Jesus. Seine Ruhe kommt aus dem Vertrauen auf den Vater. Er stillt den Sturm und fragt die Seinen: „Warum habt ihr Angst?“"],["Die ewige Ruhe","Der Hebräerbrief spricht von einer Ruhe, die das Volk Gottes noch erwartet, und die Offenbarung von denen, die von ihrer Mühsal ruhen. Jeder Sonntag ist ein Vorgeschmack dieser letzten Ruhe."]],"fast":[["Mose: vierzig Tage vor Gott","Mose verbringt vierzig Tage ohne Brot und Wasser, während er das Gesetz empfängt. Es ist ein außergewöhnliches Fasten, kein Vorbild zum Nachahmen: Es zeigt, dass das Fasten aus der Begegnung mit Gott kommt und auf das Hören vorbereitet."],["Die Seele demütigen: der Versöhnungstag","Am Versöhnungstag „demütigt“ das Volk seine Seele, das heißt, es fastet. Es ist ein Tag der Versöhnung: Das Fasten begleitet den Wunsch, rein vor Gott neu zu beginnen."],["David fastet für seinen Sohn","David fastet und betet, solange sein Sohn krank ist. Als das Kind stirbt, steht er auf, wäscht sich und isst. Fasten ist Flehen und Hoffnung, aber auch Annahme des Willens Gottes."],["Fasten vor dem Weg","Esra ruft vor einer gefährlichen Reise ein Fasten aus, und Nehemia fastet und betet, als er vom Verfall Jerusalems hört. Vor großen Entscheidungen hilft das Fasten, sie in Gottes Hände zu legen."],["Ester: drei Tage für ihr Volk","Bevor sie ihr Leben vor dem König wagt, bittet Ester ihr Volk, mit ihr zu fasten. Fasten wird auch in Gemeinschaft gelebt: nicht nur für sich selbst, sondern für andere."],["Gebet, Fasten und Almosen","Judit lebt ihre Witwenschaft in Fasten und Gebet, ohne die Feste zu versäumen. Tobit fasst die Überlieferung zusammen: Gut ist das Gebet mit Fasten, Almosen und Gerechtigkeit. Das sind die drei Säulen, die die Kirche in der Fastenzeit bewahrt."],["Das Fasten, das Gott gefällt","Jesaja prangert ein Fasten an, das mit Ungerechtigkeit zusammenlebt. Das Fasten, das Gott gefällt, heißt, dem Hungrigen sein Brot zu brechen und die Unterdrückten freizulassen. Ohne Liebe verliert das Fasten seinen Sinn."],["Zerreißt eure Herzen","Joel ruft zur Umkehr mit Fasten und Weinen, das Herz zu zerreißen und nicht die Kleider. Ganz Ninive fastet, und Gott erbarmt sich. Fasten ist ein Weg der Umkehr."],["Habt ihr für mich gefastet?","Gott fragt sein Volk, ob sein Fasten wirklich ihm galt. Was er verlangt, sind Gerechtigkeit, Barmherzigkeit und den Schwachen nicht zu unterdrücken, und er verheißt, dass die Fasttage zu Tagen der Freude werden."],["Daniel: Fasten und Gebet","Daniel sucht Gott mit Gebet und Fasten und verzichtet ein anderes Mal drei Wochen lang auf köstliche Speisen, Fleisch und Wein. Es ist ein teilweises Fasten, dem der orthodoxen Tradition sehr ähnlich."],["Hanna, Tag und Nacht","Die Prophetin Hanna dient Gott im Tempel mit Fasten und Beten und gehört zu den Ersten, die das Jesuskind erkennen. Beharrliches Fasten schärft den Blick des Herzens."],["Jesus fastet in der Wüste","Bevor er sein Wirken beginnt, fastet Jesus vierzig Tage und besiegt die Versuchung mit dem Wort: „Der Mensch lebt nicht vom Brot allein.“ Die Große Fastenzeit ahmt diese vierzig Tage nach."],["Im Verborgenen fasten","Jesus setzt voraus, dass seine Jünger fasten werden, bittet aber darum, es ohne Schau zu tun, mit gewaschenem Gesicht. Fasten ist eine Sache zwischen der Seele und dem Vater, der ins Verborgene sieht."],["Wenn der Bräutigam von ihnen genommen wird","Solange Jesus bei ihnen ist, fasten seine Jünger nicht; sie werden fasten, wenn er ihnen genommen wird. Darum fastet die Kirche am Freitag, dem Tag des Kreuzes, und verbindet das Fasten immer mit dem Gebet."],["Die Kirche fastet und betet","Die erste christliche Gemeinde fastet und betet, bevor sie Paulus und Barnabas aussendet, und auch bei der Wahl ihrer Ältesten. Das Fasten begleitet die wichtigen Entscheidungen der Kirche."]],"pray":[["Tag und Nacht nachsinnen","Der Gerechte sinnt Tag und Nacht über Gottes Wort nach, wie ein Baum, gepflanzt an Wasserbächen. Meditieren heißt nicht, den Geist zu leeren, sondern ihn langsam mit dem zu füllen, was Gott gesagt hat."],["Hanna schüttet ihre Seele aus","Hanna betet still, nur ihre Lippen bewegen sich, mit gebrochenem Herzen. Der Priester versteht sie nicht, aber Gott versteht sie. Aufrichtiges Gebet braucht keine schönen Worte."],["Das Gebet Salomos","Salomo erkennt an, dass nicht einmal die Himmel Gott fassen können, und bittet ihn dennoch, vom Tempel aus zu hören. Jedes Gebet ist eine Begegnung zwischen der Größe Gottes und unserer Kleinheit."],["Das sanfte, leise Säuseln","Gott war nicht im Sturm, nicht im Erdbeben und nicht im Feuer, sondern in einem sanften Säuseln. Um ihn zu hören, braucht es Stille: Das ist das Herz des hesychastischen Gebets der orthodoxen Tradition."],["Morgen- und Abendgebet","Der Psalmist betet beim Morgengrauen und lässt sein Gebet am Abend wie Weihrauch aufsteigen; Daniel betet dreimal am Tag. Zu festen Stunden zu beten gibt dem Tag Gestalt und liegt an der Wurzel des Gebets der Kirche."],["Aus der Tiefe","Die Seele dürstet nach Gott wie der Hirsch nach Wasser und ruft aus der Tiefe, mehr auf ihn wartend als die Wächter auf den Morgen. Die Psalmen lehren, auch aus der Traurigkeit heraus zu beten."],["Meine Seele ist stille","„Meine Seele ist stille zu Gott“, wie ein Kind in den Armen seiner Mutter. Das Gebet spricht nicht immer: Manchmal besteht es nur darin, ruhig vor Gott zu sein."],["Über seine Werke und sein Wort nachsinnen","Sich zu erinnern, was Gott getan hat, und über seine Gebote nachzudenken, stärkt den Glauben in schweren Zeiten. Einen Vers langsam zu lesen und zu ihm zurückzukehren ist eine einfache Form der Meditation."],["Jona im Bauch des Fisches","Am dunkelsten Ort erinnert sich Jona an den Herrn, und sein Gebet erreicht ihn. Kein Ort ist zu weit weg, um zu beten."],["Das Gebet des Demütigen dringt durch die Wolken","Jesus Sirach lehrt, dass das Gebet des Demütigen bis zu Gott gelangt und nicht ruht, bis es erhört wird. Demut ist die Tür zu jedem wahren Gebet."],["Das Vaterunser","Jesus lehrt, im Verborgenen zu beten, ohne viele Worte, und schenkt uns das Vaterunser. Es ist das Gebet, das die Kirche in jeder Göttlichen Liturgie spricht und das in jeden Moment des Tages passt."],["Bittet, so wird euch gegeben","Jesus ermutigt, mit dem Vertrauen eines Kindes zu bitten, zu suchen und anzuklopfen. Der Vater gibt das schönste aller Geschenke: den Heiligen Geist."],["Allezeit beten und nicht nachlassen","Die beharrliche Witwe lehrt, ohne Ermüden zu beten, und der heilige Paulus bittet, ohne Unterlass zu beten. Orthodoxe Mönche leben das, indem sie den ganzen Tag über ein kurzes Gebet wiederholen."],["Sei mir Sünder gnädig","Der Zöllner wagt nicht, die Augen zu erheben, und sagt nur: „Gott, sei mir Sünder gnädig.“ Daraus entsteht das Jesusgebet: „Herr Jesus Christus, Sohn Gottes, erbarme dich meiner.“"],["Jesus zieht sich zum Gebet zurück","Vor Tagesanbruch, an einsamen Orten oder die ganze Nacht auf dem Berg: Jesus sucht Zeiten allein mit dem Vater. Wenn er sie brauchte, brauchen wir sie auch."],["Getsemani: Dein Wille geschehe","In seiner größten Angst betet Jesus ganz aufrichtig und schließt mit den Worten: „Dein Wille geschehe.“ Beten heißt nicht, Gott zu überzeugen, sondern sich mit dem zu vereinen, was er will."],["Maria bewahrte alles in ihrem Herzen","Die Gottesmutter verstand nicht alles, aber sie bewahrte es und bewegte es in ihrem Herzen. Sie ist das Vorbild christlicher Meditation: das Wort aufnehmen, bewahren und reifen lassen."],["Der Friede, der höher ist als alle Vernunft","Wenn wir nicht wissen, worum wir bitten sollen, betet der Geist in uns. Der heilige Paulus lädt ein, alles mit Dank vor Gott zu bringen und an das Wahre, Gute und Schöne zu denken: So kommt der Friede Gottes."]]},"el":{"rest":[["Ο Θεός αναπαύθηκε την έβδομη ημέρα","Η ανάπαυση δεν είναι τεμπελιά: είναι μέρος της δημιουργίας. Ο Θεός ολοκληρώνει το έργο Του και ευλογεί την έβδομη ημέρα. Η παύση μία ημέρα την εβδομάδα μάς θυμίζει ότι ο κόσμος δεν εξαρτάται μόνο από τον κόπο μας."],["Το Σάββατο έγινε για τον άνθρωπο","Ο Μωυσής συνδέει την ανάπαυση με την ελευθερία: στην Αίγυπτο οι δούλοι δεν αναπαύονταν. Ο Ιησούς το συνοψίζει λέγοντας ότι το Σάββατο έγινε για τον άνθρωπο. Η ανάπαυση είναι δώρο που πρέπει να δίνουμε και στους άλλους."],["Ανάπαυση για τη γη και τα ζώα","Ο Νόμος ζητά ανάπαυση και για το βόδι, το γαϊδούρι και τη γη, που αναπαύεται κάθε επτά χρόνια. Η φροντίδα του Θεού φτάνει σε όλη την κτίση, και η δική μας θα έπρεπε επίσης."],["Ηλίας: ύπνος, φαγητό και συνέχεια","Εξαντλημένος, ο Ηλίας θέλει να τα παρατήσει. Ο Θεός δεν τον επιπλήττει: τον αφήνει να κοιμηθεί, του δίνει ψωμί και νερό, και μόνο ύστερα τον βάζει ξανά στον δρόμο. Μερικές φορές το πιο πνευματικό είναι να ξεκουραστείς."],["Κοιμάμαι εν ειρήνη","Ο ψαλμωδός κοιμάται ήρεμος μέσα στον κίνδυνο, επειδή ξέρει ότι τον φυλάνε. Να εμπιστεύεσαι τη μέρα στον Θεό πριν κοιμηθείς είναι παλιά χριστιανική συνήθεια που φέρνει γαλήνη στη νύχτα."],["Ο Θεός δίνει ύπνο στους αγαπημένους Του","Το να ξυπνάς νωρίς και να ξενυχτάς με άγχος δεν προσθέτει τίποτα σε ό,τι χτίζει ο Θεός. Ο Εκκλησιαστής παρατηρεί ότι ο ύπνος του εργάτη είναι γλυκός: η μετρημένη εργασία και η εμπιστοσύνη φέρνουν ανάπαυση."],["Επί ύδατος αναπαύσεως","Ο Καλός Ποιμένας δεν οδηγεί μόνο: και αναπαύει. Τα χλοερά λιβάδια και τα ήσυχα νερά είναι η εικόνα μιας ψυχής που αφήνεται να τη φροντίσουν και ανακτά δυνάμεις."],["Με ησυχία και εμπιστοσύνη","«Σχολάσατε και γνώτε ότι εγώ ειμι ο Θεός». Ο Ησαΐας προσθέτει ότι στην ησυχία και στην εμπιστοσύνη βρίσκεται η δύναμή μας. Η εσωτερική σιωπή είναι μια μορφή ανάπαυσης που η σημερινή ζωή χρειάζεται πολύ."],["Όσοι ελπίζουν στον Κύριο","Ο Θεός δεν κουράζεται ούτε αποκάμνει, και δίνει δύναμη στον κουρασμένο. Όποιος ελπίζει σε Αυτόν ανανεώνει τη δύναμή του σαν τον αετό. Η αληθινή ανάπαυση αρχίζει όταν ξέρεις από ποιον εξαρτάσαι."],["Καιρός για το καθετί","Υπάρχει καιρός να δουλεύεις και καιρός να σταματάς. Καλύτερα μια χούφτα με ανάπαυση παρά δύο γεμάτες κόπο: ο Εκκλησιαστής μάς καλεί να μετράμε τον κόπο και να μη ζούμε μόνο για να παράγουμε."],["Ο υγιής ύπνος του εγκρατούς","Ο Σοφός Σειράχ συνδέει το τραπέζι με τον ύπνο: όποιος τρώει με μέτρο κοιμάται καλά και ξυπνά με καθαρό μυαλό. Είναι μια πρακτική σοφία που η ορθόδοξη παράδοση διατηρεί στην ισορροπία ανάμεσα στη νηστεία και την τροφή."],["Δεύτε προς με, καγώ αναπαύσω υμάς","Ο Ιησούς προσφέρει ανάπαυση στους κουρασμένους και φορτωμένους, όχι αφαιρώντας κάθε φορτίο, αλλά μοιράζοντάς το: ο ζυγός Του είναι χρηστός. Είναι ανάπαυση της ψυχής που γεννιέται από την πραότητα και την ταπείνωση."],["Ελάτε κατ᾿ ιδίαν και αναπαυθείτε λίγο","Ο Ιησούς βλέπει τους μαθητές Του εξαντλημένους και τους πηγαίνει σε ήσυχο τόπο. Με τη Μάρθα και τη Μαρία διδάσκει το ίδιο: ανάμεσα σε πολλές δουλειές, ένα μόνο χρειάζεται, να καθίσεις να Τον ακούσεις."],["Ο Ιησούς κοιμάται στην τρικυμία","Ενώ ο άνεμος ταρακουνά τη βάρκα, ο Ιησούς κοιμάται. Η γαλήνη Του γεννιέται από την εμπιστοσύνη στον Πατέρα. Καταπαύει την τρικυμία και ρωτά τους δικούς Του: «Γιατί φοβάστε;»."],["Η αιώνια ανάπαυση","Η Προς Εβραίους Επιστολή μιλά για μια ανάπαυση που ακόμη περιμένει τον λαό του Θεού, και η Αποκάλυψη για όσους αναπαύονται από τους κόπους τους. Κάθε Κυριακή είναι μια πρόγευση εκείνης της τελικής ανάπαυσης."]],"fast":[["Μωυσής: σαράντα μέρες ενώπιον του Θεού","Ο Μωυσής περνά σαράντα μέρες χωρίς ψωμί και νερό, ενώ παραλαμβάνει τον Νόμο. Είναι μια εξαιρετική νηστεία, όχι πρότυπο για μίμηση: δείχνει ότι η νηστεία γεννιέται από τη συνάντηση με τον Θεό και προετοιμάζει για να Τον ακούσουμε."],["Ταπεινώνω την ψυχή: η Ημέρα του Εξιλασμού","Την Ημέρα του Εξιλασμού ο λαός «ταπεινώνει την ψυχή του», δηλαδή νηστεύει. Είναι ημέρα συμφιλίωσης: η νηστεία συνοδεύει την επιθυμία να ξαναρχίσεις καθαρός ενώπιον του Θεού."],["Ο Δαβίδ νηστεύει για τον γιο του","Ο Δαβίδ νηστεύει και προσεύχεται όσο ο γιος του είναι άρρωστος. Όταν πεθαίνει, σηκώνεται, πλένεται και τρώει. Η νηστεία είναι ικεσία και ελπίδα, αλλά και αποδοχή του θελήματος του Θεού."],["Νηστεία πριν από τον δρόμο","Ο Έσδρας κηρύσσει νηστεία πριν από ένα επικίνδυνο ταξίδι, και ο Νεεμίας νηστεύει και προσεύχεται όταν μαθαίνει για την ερήμωση της Ιερουσαλήμ. Μπροστά στις μεγάλες αποφάσεις, η νηστεία βοηθά να τις αφήσουμε στα χέρια του Θεού."],["Εσθήρ: τρεις μέρες για τον λαό της","Πριν διακινδυνεύσει τη ζωή της μπροστά στον βασιλιά, η Εσθήρ ζητά από τον λαό της να νηστέψει μαζί της. Η νηστεία βιώνεται και κοινοτικά: όχι μόνο για τον εαυτό μας, αλλά για τους άλλους."],["Προσευχή, νηστεία και ελεημοσύνη","Η Ιουδίθ ζει τη χηρεία της με νηστεία και προσευχή, χωρίς να παύει να γιορτάζει τις εορτές. Ο Τωβίτ συνοψίζει την παράδοση: καλή η προσευχή με νηστεία, ελεημοσύνη και δικαιοσύνη. Είναι οι τρεις πυλώνες που κρατά η Εκκλησία τη Μεγάλη Τεσσαρακοστή."],["Η νηστεία που θέλει ο Θεός","Ο Ησαΐας καταγγέλλει μια νηστεία που συνυπάρχει με την αδικία. Η νηστεία που ευαρεστεί τον Θεό είναι να μοιράζεσαι το ψωμί με τον πεινασμένο και να ελευθερώνεις τον καταπιεσμένο. Χωρίς αγάπη, η νηστεία χάνει το νόημά της."],["Διαρρήξατε τας καρδίας υμών","Ο Ιωήλ καλεί σε μετάνοια με νηστεία και κλάμα, σκίζοντας την καρδιά και όχι τα ρούχα. Όλη η Νινευή νηστεύει και ο Θεός σπλαχνίζεται. Η νηστεία είναι δρόμος μετάνοιας."],["Μήπως νηστέψατε για μένα;","Ο Θεός ρωτά τον λαό Του αν οι νηστείες του ήταν αληθινά γι᾿ Αυτόν. Αυτό που ζητά είναι δικαιοσύνη, έλεος και να μην καταπιέζεται ο αδύναμος, και υπόσχεται ότι οι μέρες της νηστείας θα γίνουν μέρες χαράς."],["Δανιήλ: νηστεία και προσευχή","Ο Δανιήλ ζητά τον Θεό με προσευχή και νηστεία, και σε άλλη περίσταση απέχει για τρεις εβδομάδες από εκλεκτά φαγητά, κρέας και κρασί. Είναι μερική νηστεία, πολύ κοντά σε αυτήν που τηρεί η ορθόδοξη παράδοση."],["Η Άννα, νύχτα και μέρα","Η προφήτισσα Άννα λατρεύει τον Θεό στον ναό με νηστείες και προσευχές και είναι από τους πρώτους που αναγνωρίζουν το Θείο Βρέφος. Η επίμονη νηστεία καθαρίζει το βλέμμα της καρδιάς."],["Ο Ιησούς νηστεύει στην έρημο","Πριν αρχίσει την αποστολή Του, ο Ιησούς νηστεύει σαράντα μέρες και νικά τον πειρασμό με τον λόγο: «Ουκ επ᾿ άρτω μόνω ζήσεται άνθρωπος». Η Μεγάλη Τεσσαρακοστή μιμείται αυτές τις σαράντα μέρες."],["Νηστεία εν τω κρυπτώ","Ο Ιησούς θεωρεί δεδομένο ότι οι μαθητές Του θα νηστεύουν, αλλά ζητά να το κάνουν χωρίς επίδειξη, με πλυμένο πρόσωπο. Η νηστεία είναι υπόθεση ανάμεσα στην ψυχή και στον Πατέρα, που βλέπει τα κρυφά."],["Όταν τους αφαιρεθεί ο νυμφίος","Όσο ο Ιησούς είναι μαζί τους, οι μαθητές δεν νηστεύουν· θα νηστέψουν όταν τους αφαιρεθεί. Γι᾿ αυτό η Εκκλησία νηστεύει την Παρασκευή, ημέρα του Σταυρού, και ενώνει πάντα τη νηστεία με την προσευχή."],["Η Εκκλησία νηστεύει και προσεύχεται","Η πρώτη χριστιανική κοινότητα νηστεύει και προσεύχεται πριν αποστείλει τον Παύλο και τον Βαρνάβα, και όταν εκλέγει τους πρεσβυτέρους της. Η νηστεία συνοδεύει τις σημαντικές αποφάσεις της Εκκλησίας."]],"pray":[["Μελετώ ημέρας και νυκτός","Ο δίκαιος μελετά τον λόγο του Θεού μέρα και νύχτα, σαν δέντρο φυτεμένο δίπλα στα νερά. Ο διαλογισμός δεν είναι άδειασμα του νου, αλλά σιγανό γέμισμά του με όσα είπε ο Θεός."],["Η Άννα εκχέει την ψυχή της","Η Άννα προσεύχεται σιωπηλά, κινώντας μόνο τα χείλη, με ραγισμένη καρδιά. Ο ιερέας δεν την καταλαβαίνει, ο Θεός όμως ναι. Η ειλικρινής προσευχή δεν χρειάζεται ωραία λόγια."],["Η προσευχή του Σολομώντα","Ο Σολομών αναγνωρίζει ότι ούτε οι ουρανοί χωρούν τον Θεό, κι όμως Του ζητά να ακούει από τον ναό. Κάθε προσευχή είναι συνάντηση ανάμεσα στο μεγαλείο του Θεού και τη μικρότητά μας."],["Φωνή αύρας λεπτής","Ο Θεός δεν ήταν στον άνεμο, ούτε στον σεισμό, ούτε στη φωτιά, αλλά σε μια λεπτή αύρα. Για να Τον ακούσουμε χρειάζεται σιωπή: είναι η καρδιά της ησυχαστικής προσευχής της ορθόδοξης παράδοσης."],["Πρωινή και εσπερινή προσευχή","Ο ψαλμωδός προσεύχεται την αυγή και υψώνει την προσευχή του σαν θυμίαμα το βράδυ· ο Δανιήλ προσεύχεται τρεις φορές τη μέρα. Η προσευχή σε σταθερές ώρες δίνει μορφή στη μέρα και βρίσκεται στη ρίζα της προσευχής της Εκκλησίας."],["Εκ βαθέων","Η ψυχή διψά για τον Θεό όπως το ελάφι για το νερό, και κράζει εκ βαθέων, περιμένοντάς Τον περισσότερο από τους φρουρούς την αυγή. Οι Ψαλμοί μάς διδάσκουν να προσευχόμαστε και μέσα από τη λύπη."],["Η ψυχή μου αναπαύεται στη σιωπή","«Στον Θεό μόνο αναπαύεται η ψυχή μου», σαν παιδί στην αγκαλιά της μητέρας του. Η προσευχή δεν μιλά πάντα: μερικές φορές είναι απλώς να στέκεσαι ήρεμος ενώπιον του Θεού."],["Μελετώ τα έργα και τον λόγο Του","Η ανάμνηση όσων έκανε ο Θεός και η μελέτη των εντολών Του στηρίζουν την πίστη στις δύσκολες ώρες. Να διαβάζεις αργά έναν στίχο και να επιστρέφεις σε αυτόν είναι μια απλή μορφή διαλογισμού."],["Ο Ιωνάς στην κοιλιά του ψαριού","Στον πιο σκοτεινό τόπο, ο Ιωνάς θυμάται τον Κύριο και η προσευχή του φτάνει ως Αυτόν. Κανένας τόπος δεν είναι πολύ μακριά για να προσευχηθείς."],["Η προσευχή του ταπεινού διαπερνά τα σύννεφα","Ο Σειράχ διδάσκει ότι η προσευχή του ταπεινού φτάνει ως τον Θεό και δεν ησυχάζει μέχρι να εισακουστεί. Η ταπείνωση είναι η πόρτα κάθε αληθινής προσευχής."],["Το Πάτερ ημών","Ο Ιησούς διδάσκει να προσευχόμαστε κρυφά, χωρίς πολυλογία, και μας αφήνει το Πάτερ ημών. Είναι η προσευχή που λέει η Εκκλησία σε κάθε Θεία Λειτουργία και που χωρά σε κάθε στιγμή της μέρας."],["Αιτείτε και δοθήσεται υμίν","Ο Ιησούς μάς ενθαρρύνει να ζητάμε, να αναζητάμε και να χτυπάμε με την εμπιστοσύνη του παιδιού. Ο Πατέρας δίνει το καλύτερο δώρο: το Άγιο Πνεύμα."],["Πάντοτε προσεύχεσθε, χωρίς να αποκάμνετε","Η επίμονη χήρα διδάσκει να προσευχόμαστε χωρίς να κουραζόμαστε, και ο Απόστολος Παύλος ζητά «αδιαλείπτως προσεύχεσθε». Οι ορθόδοξοι μοναχοί το ζουν επαναλαμβάνοντας μια σύντομη προσευχή όλη τη μέρα."],["Ο Θεός ιλάσθητί μοι τω αμαρτωλώ","Ο τελώνης δεν τολμά να σηκώσει τα μάτια και λέει μόνο: «Ο Θεός, ιλάσθητί μοι τω αμαρτωλώ». Από εδώ γεννιέται η Ευχή του Ιησού: «Κύριε Ιησού Χριστέ, Υιέ του Θεού, ελέησόν με»."],["Ο Ιησούς αποσύρεται για προσευχή","Πριν από την αυγή, σε έρημους τόπους ή όλη τη νύχτα στο όρος: ο Ιησούς αναζητά στιγμές μόνος με τον Πατέρα. Αν Εκείνος το χρειαζόταν, το χρειαζόμαστε κι εμείς."],["Γεθσημανή: γενηθήτω το θέλημά σου","Στη μεγαλύτερη αγωνία, ο Ιησούς προσεύχεται με απόλυτη ειλικρίνεια και καταλήγει: «Γενηθήτω το θέλημά σου». Προσευχή δεν είναι να πείσουμε τον Θεό, αλλά να ενωθούμε με ό,τι θέλει Εκείνος."],["Η Μαρία τα φύλαγε στην καρδιά της","Η Θεοτόκος δεν τα καταλάβαινε όλα, αλλά τα φύλαγε και τα συλλογιζόταν στην καρδιά της. Είναι το πρότυπο του χριστιανικού διαλογισμού: να δέχεσαι τον λόγο, να τον φυλάς και να τον αφήνεις να ωριμάσει."],["Η ειρήνη που υπερέχει πάντα νουν","Όταν δεν ξέρουμε τι να ζητήσουμε, το Πνεύμα προσεύχεται μέσα μας. Ο Απόστολος Παύλος μάς καλεί να τα φέρνουμε όλα στον Θεό με ευχαριστία και να σκεφτόμαστε ό,τι είναι αληθινό, καλό και ωραίο: έτσι έρχεται η ειρήνη του Θεού."]]},"ru":{"rest":[["Бог почил в день седьмой","Покой — не лень: он часть творения. Бог завершает Своё дело и благословляет седьмой день. Остановиться один день в неделю — значит вспомнить, что мир держится не только на наших усилиях."],["Суббота для человека","Моисей связывает покой со свободой: в Египте рабы не знали отдыха. Иисус подытоживает: суббота для человека. Отдых — это дар, который мы должны давать и другим."],["Покой для земли и животных","Закон требует покоя и для вола, и для осла, и для земли, которая отдыхает каждый седьмой год. Забота Бога простирается на всё творение, и наша должна тоже."],["Илия: поспать, поесть и идти дальше","Изнурённый Илия хочет сдаться. Бог ни в чём его не упрекает: даёт ему поспать, даёт хлеб и воду и лишь потом снова отправляет в путь. Иногда самое духовное — это отдохнуть."],["Спать в мире","Псалмопевец спокойно спит среди опасности, потому что знает: его хранят. Поручать день Богу перед сном — древний христианский обычай, который приносит ночи покой."],["Возлюбленному Своему Он даёт сон","Рано вставать и поздно ложиться в тревоге — ничего не прибавляет к тому, что строит Бог. Екклесиаст замечает, что сладок сон трудящегося: мерный труд и доверие дают покой."],["К водам тихим","Добрый Пастырь не только ведёт, но и даёт покой. Злачные пажити и тихие воды — образ души, которая позволяет о себе заботиться и набирается сил."],["В тишине и уповании","«Остановитесь и познайте, что Я — Бог». Исаия добавляет, что в тишине и уповании наша крепость. Внутренняя тишина — это форма отдыха, в которой сегодняшняя жизнь очень нуждается."],["Надеющиеся на Господа","Бог не утомляется и не изнемогает и даёт утомлённому силу. Надеющийся на Него обновляется в силе, как орёл. Подлинный покой начинается со знания, от Кого ты зависишь."],["Всему своё время","Есть время трудиться и время остановиться. Лучше горсть с покоем, чем пригоршни с трудом: Екклесиаст призывает соразмерять усилия и не жить только ради результата."],["Здоровый сон умеренного","Сирах соединяет стол и сон: кто ест умеренно, хорошо спит и встаёт со свежей головой. Это практическая мудрость, которую православное предание хранит в равновесии между постом и пищей."],["Придите ко Мне, и Я успокою вас","Иисус предлагает покой утруждённым и обременённым — не снимая всякое бремя, а разделяя его: иго Его благо. Это покой души, рождающийся из кротости и смирения."],["Пойдите одни и отдохните немного","Иисус видит, что ученики изнемогли, и уводит их в тихое место. Тому же Он учит Марфу и Марию: среди многих забот нужно одно — сесть и слушать Его."],["Иисус спит во время бури","Пока ветер раскачивает лодку, Иисус спит. Его спокойствие рождается из доверия Отцу. Он укрощает бурю и спрашивает Своих: «Что вы так боязливы?»"],["Вечный покой","Послание к Евреям говорит о покое, который ещё ожидает народ Божий, а Откровение — о тех, кто успокаивается от трудов своих. Каждое воскресенье — предвкушение этого последнего покоя."]],"fast":[["Моисей: сорок дней пред Богом","Моисей проводит сорок дней без хлеба и воды, принимая Закон. Это исключительный пост, а не пример для подражания: он показывает, что пост рождается из встречи с Богом и готовит к слушанию Его."],["Смирять души: День очищения","В День очищения народ «смиряет души свои», то есть постится. Это день примирения: пост сопровождает желание начать заново, очищенным пред Богом."],["Давид постится о сыне","Давид постится и молится, пока сын болен. Когда ребёнок умирает, он встаёт, умывается и ест. Пост — это мольба и надежда, но и принятие воли Божией."],["Пост перед дорогой","Ездра объявляет пост перед опасным путешествием, а Неемия постится и молится, услышав о разорении Иерусалима. Перед большими решениями пост помогает предать их в руки Божии."],["Есфирь: три дня за свой народ","Прежде чем рискнуть жизнью перед царём, Есфирь просит свой народ поститься вместе с ней. Пост проживается и вместе: не только ради себя, но и ради других."],["Молитва, пост и милостыня","Иудифь проводит своё вдовство в посте и молитве, не переставая праздновать праздники. Товит подытоживает предание: добро молитва с постом, милостынею и справедливостью. Это три столпа, которые Церковь хранит Великим постом."],["Пост, угодный Богу","Исаия обличает пост, уживающийся с несправедливостью. Пост, угодный Богу, — разделить хлеб с голодным и освободить угнетённых. Без любви пост теряет смысл."],["Раздирайте сердца ваши","Иоиль зовёт к покаянию в посте и плаче, раздирая сердца, а не одежды. Вся Ниневия постится, и Бог милует. Пост — это путь покаяния."],["Для Меня ли вы постились?","Бог спрашивает Свой народ, ради Него ли были их посты. Он просит правосудия, милосердия и не притеснять слабого — и обещает, что дни поста станут днями радости."],["Даниил: пост и молитва","Даниил ищет Бога в молитве и посте, а в другой раз три недели воздерживается от изысканной пищи, мяса и вина. Это частичный пост, очень похожий на тот, что соблюдает православное предание."],["Анна, днём и ночью","Пророчица Анна служит Богу в храме постом и молитвою и одной из первых узнаёт Младенца Иисуса. Постоянный пост очищает взгляд сердца."],["Иисус постится в пустыне","Прежде чем начать Своё служение, Иисус постится сорок дней и побеждает искушение словом: «Не хлебом одним будет жить человек». Великий пост подражает этим сорока дням."],["Поститься втайне","Иисус считает само собой разумеющимся, что ученики будут поститься, но просит делать это без показа, умыв лицо. Пост — дело между душой и Отцом, видящим втайне."],["Когда отнимется у них жених","Пока Иисус с ними, ученики не постятся; будут поститься, когда Он будет отнят у них. Поэтому Церковь постится в пятницу, день Креста, и всегда соединяет пост с молитвой."],["Церковь постится и молится","Первая христианская община постится и молится, прежде чем послать Павла и Варнаву, а также при избрании пресвитеров. Пост сопровождает важные решения Церкви."]],"pray":[["Поучаться день и ночь","Праведник поучается в слове Божием день и ночь, как дерево, посаженное при потоках вод. Размышлять — не значит опустошать ум, а постепенно наполнять его тем, что сказал Бог."],["Анна изливает душу","Анна молится молча, шевеля лишь губами, с сокрушённым сердцем. Священник её не понимает, но Бог понимает. Искренней молитве не нужны красивые слова."],["Молитва Соломона","Соломон признаёт, что и небеса не вмещают Бога, и всё же просит Его слышать из храма. Всякая молитва — встреча величия Божия с нашей малостью."],["Веяние тихого ветра","Бог был не в ветре, не в землетрясении и не в огне, а в тихом веянии. Чтобы услышать Его, нужна тишина: в этом сердце исихастской молитвы православного предания."],["Утренняя и вечерняя молитва","Псалмопевец молится на рассвете и возносит молитву, как кадило, вечером; Даниил молится трижды в день. Молитва в определённые часы даёт дню форму и лежит в основании молитвы Церкви."],["Из глубины","Душа жаждет Бога, как лань — воды, и взывает из глубины, ожидая Его больше, чем стражи — утра. Псалмы учат молиться и в печали."],["Душа моя успокаивается в тишине","«Только в Боге успокаивается душа моя», как дитя на руках у матери. Молитва не всегда говорит: иногда она — просто спокойное пребывание пред Богом."],["Размышлять о делах и слове Его","Вспоминать, что сделал Бог, и размышлять о Его заповедях — это поддерживает веру в трудные времена. Медленно прочитать стих и вернуться к нему — простой способ размышления."],["Иона во чреве кита","В самом тёмном месте Иона вспоминает Господа, и его молитва доходит до Него. Нет места слишком далёкого для молитвы."],["Молитва смиренного проникает сквозь облака","Сирах учит, что молитва смиренного доходит до Бога и не успокаивается, пока не будет услышана. Смирение — дверь всякой истинной молитвы."],["Отче наш","Иисус учит молиться втайне, без многословия, и оставляет нам молитву «Отче наш». Её Церковь произносит на каждой Божественной литургии, и она подходит для любого часа дня."],["Просите, и дано будет вам","Иисус призывает просить, искать и стучать с доверием ребёнка. Отец даёт лучший из даров — Духа Святого."],["Молиться всегда и не унывать","Настойчивая вдова учит молиться не уставая, а апостол Павел призывает: «непрестанно молитесь». Православные монахи живут этим, повторяя краткую молитву в течение всего дня."],["Боже, будь милостив ко мне, грешнику","Мытарь не смеет поднять глаз и говорит только: «Боже, будь милостив ко мне, грешнику!» Отсюда рождается Иисусова молитва: «Господи Иисусе Христе, Сыне Божий, помилуй мя»."],["Иисус уединяется для молитвы","До рассвета, в пустынных местах или всю ночь на горе — Иисус ищет времени наедине с Отцом. Если это было нужно Ему, то и нам."],["Гефсимания: да будет воля Твоя","В величайшей скорби Иисус молится с полной искренностью и заканчивает словами: «Да будет воля Твоя». Молиться — не значит убеждать Бога, а соединяться с тем, чего Он хочет."],["Мария сохраняла всё в сердце своём","Богородица не всё понимала, но сохраняла и слагала всё в сердце Своём. Это образец христианского размышления: принять слово, сохранить его и дать ему созреть."],["Мир, который превыше всякого ума","Когда мы не знаем, о чём просить, Дух молится в нас. Апостол Павел призывает приносить всё Богу с благодарением и помышлять о том, что истинно, добро и прекрасно: так приходит мир Божий."]]},"ro":{"rest":[["Dumnezeu S-a odihnit în ziua a șaptea","Odihna nu e lene: face parte din creație. Dumnezeu Își încheie lucrarea și binecuvântează ziua a șaptea. A te opri o zi pe săptămână îți amintește că lumea nu depinde doar de efortul nostru."],["Sabatul, făcut pentru om","Moise leagă odihna de libertate: în Egipt robii nu se odihneau. Iisus rezumă spunând că sabatul a fost făcut pentru om. Odihna este un dar pe care trebuie să-l dăm și altora."],["Odihnă pentru pământ și animale","Legea cere odihnă și pentru bou, pentru asin și pentru pământ, care se odihnește la fiecare șapte ani. Grija lui Dumnezeu ajunge la toată creația, iar a noastră ar trebui să ajungă și ea."],["Ilie: somn, mâncare și din nou la drum","Epuizat, Ilie vrea să renunțe. Dumnezeu nu-i reproșează nimic: îl lasă să doarmă, îi dă pâine și apă și abia apoi îl pune din nou pe drum. Uneori, lucrul cel mai duhovnicesc este să te odihnești."],["A dormi în pace","Psalmistul doarme liniștit în mijlocul primejdiei, pentru că știe că este păzit. A-I încredința lui Dumnezeu ziua înainte de somn este un vechi obicei creștin care aduce seninătate nopții."],["Celor iubiți ai Săi le dă somn","A te scula devreme și a te culca târziu plin de neliniște nu adaugă nimic la ce zidește Dumnezeu. Ecclesiastul observă că somnul lucrătorului este dulce: munca măsurată și încrederea aduc odihnă."],["La ape liniștite","Păstorul cel Bun nu doar călăuzește: El dă și odihnă. Pășunile verzi și apele liniștite sunt chipul unui suflet care se lasă îngrijit și își recapătă puterile."],["În liniște și încredere","„Opriți-vă și cunoașteți că Eu sunt Dumnezeu.” Isaia adaugă că în liniște și încredere stă tăria noastră. Tăcerea lăuntrică este o formă de odihnă de care viața de azi are mare nevoie."],["Cei ce nădăjduiesc în Domnul","Dumnezeu nu obosește și nu Se istovește și dă putere celui obosit. Cine nădăjduiește în El își înnoiește puterea ca vulturul. Odihna adevărată începe cu a ști de Cine depinzi."],["Toate își au vremea lor","Este o vreme să muncești și o vreme să te oprești. Mai bine o mână plină de odihnă decât două pline de trudă: Ecclesiastul ne cheamă să ne măsurăm efortul și să nu trăim doar ca să producem."],["Somnul sănătos al celui cumpătat","Sirah unește masa și somnul: cine mănâncă cu măsură doarme bine și se trezește limpede la minte. Este o înțelepciune practică pe care Tradiția ortodoxă o păstrează în echilibrul dintre post și hrană."],["Veniți la Mine și Eu vă voi odihni","Iisus oferă odihnă celor osteniți și împovărați, nu luând orice povară, ci împărțind-o: jugul Său este bun. Este o odihnă a sufletului care se naște din blândețe și smerenie."],["Veniți deoparte și odihniți-vă puțin","Iisus își vede ucenicii istoviți și îi duce într-un loc liniștit. Cu Marta și Maria învață același lucru: între multe treburi, un singur lucru trebuie, să stai și să-L asculți."],["Iisus doarme în furtună","În timp ce vântul zguduie corabia, Iisus doarme. Liniștea Lui se naște din încrederea în Tatăl. Potolește furtuna și îi întreabă pe ai Săi: „De ce vă este frică?”"],["Odihna veșnică","Epistola către Evrei vorbește despre o odihnă care încă așteaptă poporul lui Dumnezeu, iar Apocalipsa despre cei ce se odihnesc de ostenelile lor. Fiecare duminică este o pregustare a acelei odihne de pe urmă."]],"fast":[["Moise: patruzeci de zile înaintea lui Dumnezeu","Moise petrece patruzeci de zile fără pâine și apă, primind Legea. Este un post neobișnuit, nu un model de urmat: arată că postul se naște din întâlnirea cu Dumnezeu și pregătește pentru ascultarea Lui."],["A-și smeri sufletul: Ziua Ispășirii","În Ziua Ispășirii poporul „își smerește sufletul”, adică postește. Este o zi de împăcare: postul însoțește dorința de a o lua de la capăt, curat înaintea lui Dumnezeu."],["David postește pentru fiul său","David postește și se roagă cât timp fiul lui este bolnav. Când copilul moare, se ridică, se spală și mănâncă. Postul este rugă și nădejde, dar și primire a voii lui Dumnezeu."],["Post înainte de drum","Ezdra vestește un post înaintea unei călătorii primejdioase, iar Neemia postește și se roagă când află de ruina Ierusalimului. În fața marilor hotărâri, postul ajută să le punem în mâinile lui Dumnezeu."],["Estera: trei zile pentru poporul ei","Înainte de a-și pune viața în joc în fața regelui, Estera îi cere poporului ei să postească împreună cu ea. Postul se trăiește și în comunitate: nu doar pentru sine, ci și pentru ceilalți."],["Rugăciune, post și milostenie","Iudita își trăiește văduvia în post și rugăciune, fără să înceteze a prăznui sărbătorile. Tobit rezumă Tradiția: bună este rugăciunea cu post, milostenie și dreptate. Sunt cei trei stâlpi pe care Biserica îi păstrează în Postul Mare."],["Postul pe care îl vrea Dumnezeu","Isaia condamnă un post care conviețuiește cu nedreptatea. Postul plăcut lui Dumnezeu este să împarți pâinea cu cel flămând și să-l eliberezi pe cel asuprit. Fără dragoste, postul își pierde sensul."],["Sfâșiați-vă inimile","Ioil cheamă la pocăință cu post și plâns, sfâșiind inima, nu hainele. Toată Ninive postește și Dumnezeu Se milostivește. Postul este o cale de pocăință."],["Pentru Mine ați postit?","Dumnezeu își întreabă poporul dacă posturile lui au fost cu adevărat pentru El. Ceea ce cere este dreptate, milă și să nu-l asuprești pe cel slab, și făgăduiește că zilele de post se vor preface în zile de bucurie."],["Daniel: post și rugăciune","Daniel Îl caută pe Dumnezeu cu rugăciune și post, iar altă dată se înfrânează trei săptămâni de la bucate alese, carne și vin. Este un post parțial, foarte asemănător cu cel pe care îl ține Tradiția ortodoxă."],["Ana, zi și noapte","Proorocița Ana Îi slujește lui Dumnezeu în templu cu posturi și rugăciuni și este printre primii care Îl recunosc pe Pruncul Iisus. Postul stăruitor curăță privirea inimii."],["Iisus postește în pustiu","Înainte de a-Și începe misiunea, Iisus postește patruzeci de zile și biruie ispita prin Cuvânt: „Nu numai cu pâine va trăi omul.” Postul Mare urmează aceste patruzeci de zile."],["Postul în ascuns","Iisus socotește de la sine înțeles că ucenicii Săi vor posti, dar le cere să o facă fără paradă, cu fața spălată. Postul este o taină între suflet și Tatăl, care vede în ascuns."],["Când va fi luat Mirele de la ei","Cât timp Iisus este cu ei, ucenicii nu postesc; vor posti când El va fi luat de la ei. De aceea Biserica postește vinerea, ziua Crucii, și unește mereu postul cu rugăciunea."],["Biserica postește și se roagă","Prima comunitate creștină postește și se roagă înainte de a-i trimite pe Pavel și Barnaba, și tot așa când își alege preoții. Postul însoțește hotărârile importante ale Bisericii."]],"pray":[["A cugeta zi și noapte","Dreptul cugetă la Cuvântul lui Dumnezeu zi și noapte, ca un pom sădit lângă ape. A medita nu înseamnă a goli mintea, ci a o umple încet cu ceea ce a spus Dumnezeu."],["Ana își varsă sufletul","Ana se roagă în tăcere, mișcând doar buzele, cu inima zdrobită. Preotul n-o înțelege, dar Dumnezeu da. Rugăciunea sinceră nu are nevoie de cuvinte frumoase."],["Rugăciunea lui Solomon","Solomon recunoaște că nici cerurile nu-L pot cuprinde pe Dumnezeu și totuși Îi cere să asculte din templu. Orice rugăciune este o întâlnire între măreția lui Dumnezeu și micimea noastră."],["Adierea de vânt lin","Dumnezeu nu era în vânt, nici în cutremur, nici în foc, ci într-o adiere lină. Ca să-L auzi, ai nevoie de tăcere: aceasta este inima rugăciunii isihaste din Tradiția ortodoxă."],["Rugăciunea de dimineață și de seară","Psalmistul se roagă în zori și își înalță rugăciunea ca tămâia seara; Daniel se roagă de trei ori pe zi. Rugăciunea la ore fixe dă formă zilei și stă la rădăcina rugăciunii Bisericii."],["Din adâncuri","Sufletul însetează după Dumnezeu cum dorește cerbul izvoarele apelor și strigă din adâncuri, așteptându-L mai mult decât străjerii dimineața. Psalmii ne învață să ne rugăm și din mijlocul tristeții."],["Sufletul meu se odihnește în tăcere","„Numai în Dumnezeu se odihnește sufletul meu”, ca un copil în brațele mamei. Rugăciunea nu vorbește întotdeauna: uneori înseamnă doar să stai liniștit înaintea lui Dumnezeu."],["A cugeta la lucrările și la Cuvântul Său","A-ți aminti ce a făcut Dumnezeu și a cugeta la poruncile Lui susține credința în vremuri grele. A citi încet un verset și a te întoarce la el este o formă simplă de meditație."],["Iona în pântecele peștelui","În locul cel mai întunecat, Iona Își aduce aminte de Domnul și rugăciunea lui ajunge până la El. Niciun loc nu e prea departe pentru rugăciune."],["Rugăciunea celui smerit străpunge norii","Sirah învață că rugăciunea celui smerit ajunge până la Dumnezeu și nu se liniștește până nu este ascultată. Smerenia este ușa oricărei rugăciuni adevărate."],["Tatăl nostru","Iisus ne învață să ne rugăm în ascuns, fără vorbe multe, și ne lasă rugăciunea Tatăl nostru. Este rugăciunea pe care Biserica o rostește la fiecare Sfântă Liturghie și care încape în orice clipă a zilei."],["Cereți și vi se va da","Iisus ne îndeamnă să cerem, să căutăm și să batem cu încrederea unui copil. Tatăl dă cel mai frumos dintre daruri: Duhul Sfânt."],["Rugați-vă mereu, fără să vă descurajați","Văduva stăruitoare ne învață să ne rugăm fără să obosim, iar Sfântul Pavel ne cere să ne rugăm neîncetat. Monahii ortodocși trăiesc aceasta repetând o rugăciune scurtă de-a lungul întregii zile."],["Dumnezeule, fii milostiv mie, păcătosului","Vameșul nu îndrăznește să-și ridice ochii și spune doar: „Dumnezeule, fii milostiv mie, păcătosului!” De aici se naște Rugăciunea lui Iisus: „Doamne Iisuse Hristoase, Fiul lui Dumnezeu, miluiește-mă.”"],["Iisus Se retrage să Se roage","Înainte de răsărit, în locuri pustii sau toată noaptea pe munte: Iisus caută clipe singur cu Tatăl. Dacă El avea nevoie, avem și noi."],["Ghetsimani: facă-se voia Ta","În cea mai mare durere, Iisus Se roagă cu toată sinceritatea și încheie spunând: „Facă-se voia Ta.” A te ruga nu înseamnă a-L convinge pe Dumnezeu, ci a te uni cu ceea ce vrea El."],["Maria păstra toate în inima ei","Maica Domnului nu înțelegea totul, dar păstra și cugeta toate în inima ei. Ea este modelul meditației creștine: să primești Cuvântul, să-l păstrezi și să-l lași să se coacă."],["Pacea care covârșește orice minte","Când nu știm ce să cerem, Duhul Se roagă în noi. Sfântul Pavel ne îndeamnă să aducem totul înaintea lui Dumnezeu cu mulțumire și să ne gândim la ce este adevărat, bun și frumos: așa vine pacea lui Dumnezeu."]]}};
const T12K=["tpRest","tpFast","tpPray","tpRead","tpDone","tpUndo","tpProg","tpCh","tpFastNote","tpSub","tpTap","tpRefl"];

lesen|Kapitel {n}|Wenn du krank, schwanger oder älter bist oder Medikamente nimmst, wird das Fasten angepasst: Die Kirche hat stets befreit, wer es braucht. Sprich mit deinem Arzt und deinem geistlichen Vater.|{n} Kapitel|Wähle ein Kapitel, um seine Stellen und die Betrachtung zu lesen.|Betrachtung", "el": "Ανάπαυση και ύπνος|Νηστεία|Προσευχή και διαλογισμός|Σήμανση ως διαβασμένο|Διαβάστηκε|Αναίρεση|{r} από {n} διαβασμένα|Κεφάλαιο {n}|Αν έχετε κάποια ασθένεια, είστε έγκυος, ηλικιωμένος ή παίρνετε φάρμακα, η νηστεία προσαρμόζεται: η Εκκλησία πάντα έδινε οικονομία σε όποιον τη χρειάζεται. Μιλήστε με τον γιατρό και τον πνευματικό σας.|{n} κεφάλαια|Επιλέξτε ένα κεφάλαιο για να διαβάσετε τα χωρία και τον στοχασμό.|Στοχασμός", "ru": "Отдых и сон|Пост|Молитва и размышление|Отметить как прочитанное|Прочитано|Снять отметку|Прочитано {r} из {n}|Глава {n}|Если вы больны, беременны, пожилого возраста или принимаете лекарства, пост смягчается: Церковь всегда давала послабление тем, кто в этом нуждается. Посоветуйтесь с врачом и духовником.|Глав: {n}|Выберите главу, чтобы прочитать места Писания и размышление.|Размышление", "ro": "Odihnă și somn|Post|Rugăciune și meditație|Marchează ca citit|Citit|Anulează|{r} din {n} citite|Capitolul {n}|Dacă ești bolnav, însărcinată, în vârstă sau iei medicamente, postul se adaptează: Biserica a dat mereu dezlegare celor care au nevoie. Vorbește cu medicul tău și cu duhovnicul tău.|{n} capitole|Alege un capitol ca să citești pasajele și reflecția.|Reflecție"};

for(const l in T12){const a=T12[l].split('|');if(T[l])T12K.forEach((k,i)=>T[l][k]=a[i])}
const TPK=['rest','fast','pray'];
const TPICO={rest:'🌙',fast:'🕯️',pray:'🙏',exer:'🏃',work:'🔨',give:'🤝',speech:'💬',joy:'☀️'};
const HBK=['exer','work','give','speech','joy'];
const hbx=()=>(typeof HBX!=='undefined'&&(HBX[LANG]||HBX.en))||null;
const tpName=k=>TPNAME[k]?t(TPNAME[k]):hbx().names[k];
const TPART={fast:0,rest:1,pray:2}; // artículo original de Salud que sirve de introducción
const TPNAME={rest:'tpRest',fast:'tpFast',pray:'tpPray'};
const tpTx=()=>TPTX[LANG]||TPTX.en;
const tpRead=()=>store.get('tpread',{});
const tpIsRead=(k,i)=>(tpRead()[k]||[]).includes(i);
function tpToggle(k,i){const r=tpRead();const s=new Set(r[k]||[]);s.has(i)?s.delete(i):s.add(i);r[k]=[...s].sort((a,b)=>a-b);store.set('tpread',r);return s.has(i)}
const tpCount=k=>(tpRead()[k]||[]).filter(i=>i<TPREF[k].length).length;
const tpProg=k=>t('tpProg').replace('{r}',tpCount(k)).replace('{n}',TPREF[k].length);
// agrupa las citas por libro, respetando el orden
function tpGroups(refs){const g=[];refs.forEach(([b,c,a,z])=>{const last=g[g.length-1];if(last&&last[0]===b)last[1].push([c,a,z]);else g.push([b,[[c,a,z]]])});return g}
const tpBooks=refs=>[...new Set(refs.map(r=>r[0]))].map(bname).join(' · ');
// El Eclesiástico no se numera igual en todas las ediciones
const TP_SIR={'en-ortho':{31:[34,0],35:[32,0]},'en-dra':{31:[31,4],35:[35,4]}};
async function tpVerses(p){
 const o=TP_SIR;
 for(const id of fEds()){
  if(!fHas(id,p[0]))continue;
  const segs=[];
  for(const [c,a,z] of p[1]){
   let [c1,a1]=mapRef('reina-valera-1909',id,p[0],c,a),[,z1]=mapRef('reina-valera-1909',id,p[0],c,z);
   if(p[0]==='SIR'&&o[id]&&o[id][c]){const [nc,off]=o[id][c];c1=String(nc);a1+=off;z1+=off}
   const bk=await fBook(id,p[0]);
   const vs=bk&&bk.ch[c1]?bk.ch[c1].filter(v=>v[0]>=a1&&v[0]<=z1):[];
   if(vs.length)segs.push({c,a,z,txt:vs.map(v=>v[1]).join(' ')});
  }
  if(segs.length)return {id,segs};
 }
 return null;
}
function tpIntro(k){
 if(HBK.includes(k))return `<p>${esc(hbx().intro[k])}</p>`;
 const i=TPART[k],AL=CX[CL()]?CX[CL()].art.health:null,L=CL()==='es'?0:1,a=ART.health[i];
 return a.b.map((p,j)=>`<p>${esc(AL?AL[i][j+1]:p[L])}</p>`).join('');
}
function tpCardHTML(k){const n=TPREF[k].length,r=tpCount(k);
 return `<button class="card tpcard${r===n?' all':''}" data-tp="${k}"><span class="tpci" aria-hidden="true">${TPICO[k]}</span><span class="tpct"><b>${esc(tpName(k))}</b><small>${esc(t('tpSub').replace('{n}',n))} · ${esc(tpProg(k))}</small><span class="tpbar"><i style="width:${r/n*100}%"></i></span></span><span class="fdgo" aria-hidden="true">›</span></button>`}
function tpItemHTML(k,i){
 const refs=TPREF[k][i],[ti,re]=tpTx()[k][i],done=tpIsRead(k,i),deut=refs.some(r=>F_DEUT.has(r[0]));
 return `<details class="tch${done?' done':''}" data-i="${i}"><summary><span class="tpn">${done?'✓':i+1}</span><span class="tps"><b>${esc(ti)}</b><small>${esc(tpBooks(refs))}${deut?' · '+esc(t('fOC')):''}</small></span><span class="tpchev" aria-hidden="true">›</span></summary>
 <div class="tpbody"><div class="tpv">${tpGroups(refs).map(g=>`<blockquote class="vq"><cite>${esc(fCite([g[0],g[1].map(([c,a,z])=>[c,a,z])]))}</cite></blockquote>`).join('')}</div>
 <div class="tprefl"><b>✦ ${esc(t('tpRefl'))}</b><p>${esc(re)}</p></div>
 <div class="tpact"><button class="btn tpmark${done?' ghost':''}">${done?'✓ '+esc(t('tpDone'))+' · '+esc(t('tpUndo')):esc(t('tpRead'))}</button><button class="btn ghost tpbib">📖 ${esc(t('fRead'))}</button></div></div></details>`;
}
function renderTopic(k){
 if(!TPK.includes(k)&&!HBK.includes(k))return go(S.sec);
 const n=TPREF[k].length;
 view.innerHTML=`<h1><span aria-hidden="true">${TPICO[k]}</span> ${esc(tpName(k))}</h1><div class="lead tpintro">${tpIntro(k)}</div>
 ${k==='fast'?`<aside class="hnote tpnote"><p class="hnb">🤍 ${esc(t('tpFastNote'))}</p></aside>`:''}
 <div class="tphead"><span class="tpbar big"><i style="width:${tpCount(k)/n*100}%"></i></span><span class="tpprog">${esc(tpProg(k))}</span></div>
 <p class="note">${esc(t('tpTap'))}</p>
 <div class="tplist">${TPREF[k].map((_,i)=>tpItemHTML(k,i)).join('')}</div>`;
 const upd=()=>{const r=tpCount(k);view.querySelectorAll('.tphead .tpbar i').forEach(x=>x.style.width=(r/n*100)+'%');view.querySelectorAll('.tpprog').forEach(x=>x.textContent=tpProg(k))};
 view.querySelectorAll('details.tch').forEach(d=>{
  const i=+d.dataset.i,refs=TPREF[k][i];let loaded=false;
  d.addEventListener('toggle',()=>{if(!d.open||loaded)return;loaded=true;
   const box=d.querySelector('.tpv');
   Promise.all(tpGroups(refs).map(g=>tpVerses(g).then(r=>[g,r]))).then(res=>{if(!box.isConnected)return;
    box.innerHTML=res.map(([g,r])=>{if(!r)return `<blockquote class="vq"><cite>${esc(fCite(g))}</cite></blockquote>`;
     const lg=TRLANG[r.id]||(r.id==='ortodoxa-griega'?'el':'en');
     return r.segs.map(s=>`<blockquote class="vq" lang="${lg}"><span>${esc(s.txt)}</span><cite>${esc(bname(g[0]))} ${s.c}, ${s.a===s.z?s.a:s.a+'–'+s.z} · ${esc(TRNAME[r.id]||edName(r.id))}</cite></blockquote>`).join('')}).join('')});
  });
  d.querySelector('.tpmark').onclick=()=>{const on=tpToggle(k,i);
   d.classList.toggle('done',on);d.querySelector('.tpn').textContent=on?'✓':i+1;
   const b=d.querySelector('.tpmark');b.classList.toggle('ghost',on);b.textContent=on?'✓ '+t('tpDone')+' · '+t('tpUndo'):t('tpRead');
   upd();if(on){d.open=false;d.scrollIntoView({block:'nearest',behavior:'smooth'})}};
  d.querySelector('.tpbib').onclick=()=>{const g=tpGroups(refs)[0];fOpenBible([g[0],g[1]])};
 });
 if(S.sec==='health')phosHNote();
 if(k==='exer'){const X=CX[CL()]?CX[CL()].artx:ARTX[CL()];view.insertAdjacentHTML('beforeend',`<p class="note">${esc(X.disc)}</p>`)}
}
const _renderArticlesT=renderArticles;
renderArticles=async function(sec){
 if((sec==='health'||sec==='sport')&&S.view==='topic')return renderTopic(S.topic);
 const r=await _renderArticlesT(sec);
 if(sec==='health'&&S.view==='health'&&!view.querySelector('.tpcard')){
  view.querySelectorAll('article.art').forEach(a=>a.remove());
  const w=document.createElement('div');w.className='tpcards';w.innerHTML=TPK.map(tpCardHTML).join('');
  const anchor=document.getElementById('fdentry')||view.querySelector('.lead');
  if(anchor)anchor.after(w);else view.appendChild(w);
  w.querySelectorAll('[data-tp]').forEach(b=>b.onclick=()=>go('topic',{topic:b.dataset.tp}));
 }
 return r};

$('#back').onclick=()=>{if(S.view==='topic')return go(S.sec);return _backT()};

 if(on){const h=document.querySelector('header.top');if(h&&h.getBoundingClientRect)m.style.top=(h.getBoundingClientRect().bottom+6)+'px'}
 m.hidden=!on;sh.hidden=!on;b.setAttribute('aria-expanded',on?'true':'false');b.classList.toggle('on',on);
 if(on){const f=m.querySelector('[aria-current]')||m.querySelector('button');if(f)f.focus()}}

 list.querySelectorAll('[data-sec]').forEach(b=>b.onclick=()=>{menuOpen(false);const tb=document.querySelector(`#tabs [data-sec="${b.dataset.sec}"]`);if(tb)tb.click()});
 const mb=$('#menuBtn');if(mb)mb.setAttribute('aria-label',MENU_T[LANG]||MENU_T.en);
}

drawTabs=function(){_drawTabsM();drawMenu()};

én.","Señor Jesucristo, Hijo de Dios, ten piedad de mí, pecador.","Luz radiante de la santa gloria del Padre inmortal, celestial, santo y bienaventurado, ¡oh Jesucristo! Llegados a la puesta del sol, viendo la luz de la tarde, alabamos al Padre, al Hijo y al Espíritu Santo, Dios. Digno eres de ser alabado en todo tiempo con voces santas, oh Hijo de Dios, que das la vida: por eso el mundo te glorifica.","Señor y Dueño de mi vida, no me des espíritu de pereza, de desaliento, de ambición ni de palabras vanas. Concédeme a mí, tu siervo, espíritu de pureza, de humildad, de paciencia y de amor. Sí, Señor y Rey, concédeme ver mis pecados y no juzgar a mi hermano, porque eres bendito por los siglos de los siglos. Amén.","Dios te salve, María, llena eres de gracia, el Señor es contigo. Bendita tú eres entre todas las mujeres, y bendito es el fruto de tu vientre, Jesús. Santa María, Madre de Dios, ruega por nosotros, pecadores, ahora y en la hora de nuestra muerte. Amén.","El ángel del Señor anunció a María, y concibió por obra del Espíritu Santo. — Dios te salve, María… — He aquí la esclava del Señor: hágase en mí según tu palabra. — Dios te salve, María… — Y el Verbo se hizo carne, y habitó entre nosotros. — Dios te salve, María…","Bajo tu amparo nos acogemos, santa Madre de Dios; no desprecies las súplicas que te dirigimos en nuestras necesidades, antes bien, líbranos de todo peligro, oh Virgen gloriosa y bendita."],"ui":["Hoy","Tiempo litúrgico","Hoy se celebra","Hoy no hay ninguna gran fiesta.","Ayuno de hoy","Oración para este momento","Próximas fiestas","dentro de {n} días","mañana","Para tener en cuenta","Es orientativo: cada parroquia puede tener su norma, y los enfermos, las embarazadas, los niños y los mayores están dispensados. Consulta a tu sacerdote o a tu padre espiritual.","Color litúrgico","Mañana","Mediodía","Tarde","Atardecer","Noche","En Cuaresma se reza también:","Calendario nuevo","Calendario juliano","Las Iglesias rusa, serbia, georgiana y de Jerusalén pois de Pentecostes: a Igreja vive o dia a dia guiada pelo Espírito Santo."],"ft":["Hoje não há jejum: pode comer-se de tudo.","Jejum estrito: sem carne, lacticínios, ovos, peixe, azeite nem vinho.","Jejum com azeite e vinho: sem carne, lacticínios, ovos nem peixe.","Jejum com peixe: permitem-se peixe, azeite e vinho; sem carne, lacticínios nem ovos.","Semana dos lacticínios: sem carne; permitem-se lacticínios, ovos e peixe.","Sexta-feira Santa: o dia de jejum mais estrito do ano; muitos fiéis não comem até à tarde.","Jejum e abstinência: uma refeição principal e duas mais leves (dos 18 aos 59 anos) e sem carne (a partir dos 14).","Abstinência de carne (a partir dos 14 anos), como em todas as sextas-feiras da Quaresma.","Dia penitencial: abstinência de carne ou outra penitência fixada pela conferência episcopal, como uma obra de caridade.","Hoje é solenidade: não há abstinência, embora seja sexta-feira.","Hoje não há jejum nem abstinência obrigatórios.","Nas igrejas protestantes não há jejuns obrigatórios: o jejum é voluntário e em segredo (Mt 6,16-18).","Na Quaresma muitas igrejas convidam a jejuar ou a renunciar a algo de forma voluntária.","Sexta-feira Santa: muitos cristãos vivem-na com jejum e oração."],"prn":["Rei celestial","Trisságio","Oração de Jesus","Luz radiante (Fos hilarón)","Oração de Santo Efrém","Ave Maria","Angelus","À vossa proteção","Cântico de Simeão","Magnificat","Pai-Nosso","Salmo"],"prt":["Rei celestial, Consolador, Espírito da Verdade, que estás em toda a parte e tudo enches, Tesouro de bens e Dador da vida: vem e habita em nós, purifica-nos de toda a mancha e salva, ó Bom, as nossas almas.","Santo Deus, Santo Forte, Santo Imortal, tem piedade de nós. (três vezes) Glória ao Pai e ao Filho e ao Espírito Santo, agora e sempre e pelos séculos dos séculos. Amém.","Senhor Jesus Cristo, Filho de Deus, tem piedade de mim, pecador.","Luz radiante da santa glória do Pai imortal, celestial, santo e bem-aventurado, ó Jesus Cristo! Chegados ao pôr do sol, vendo a luz da tarde, louvamos o Pai, o Filho e o Espírito Santo, Deus. Digno és de ser louvado em todo o tempo por vozes santas, ó Filho de Deus, que dás a vida: por isso o mundo te glorifica.","Senhor e Soberano da minha vida, não me dês o espírito de preguiça, de desânimo, de ambição e de palavras vãs. Concede-me a mim, teu servo, o espírito de castidade, de humildade, de paciência e de amor. Sim, Senhor e Rei, concede-me ver os meus pecados e não julgar o meu irmão, pois és bendito pelos séculos dos séculos. Amém.","Ave Maria, cheia de graça, o Senhor é convosco. Bendita sois vós entre as mulheres, e bendito é o fruto do vosso ventre, Jesus. Santa Maria, Mãe de Deus, rogai por nós, pecadores, agora e na hora da nossa morte. Amém.","O Anjo do Senhor anunciou a Maria, e ela concebeu do Espírito Santo. — Ave Maria… — Eis a escrava do Senhor: faça-se em mim segundo a vossa palavra. — Ave Maria… — E o Verbo fez-se carne e habitou entre nós. — Ave Maria…","À vossa proteção recorremos, santa Mãe de Deus; não desprezeis as nossas súplicas em nossas necessidades, mas livrai-nos sempre de todos os perigos, ó Virgem gloriosa e bendita."],"ui":["Hoje","Tempo litúrgico","Hoje celebra-se","Hoje não há nenhuma grande festa.","Jejum de hoje","Oração para este momento","Próximas festas","daqui a {n} dias","amanhã","Para ter em conta","É orientativo: cada paróquia pode ter a sua norma, e os doentes, as grávidas, as crianças e os idosos estão dispensados. Fale com o seu sacerdote ou pai espiritual.","Cor litúrgica","Manhã","Meio-dia","Tarde","Entardecer","Noite","Na Quaresma reza-se também:","Calendário novo","Calendário juliano","As Igrejas russa, sérvia, georgiana e de Jerusalém seguem o calendário juliano: as suas festas fixas caem 13 dias mais tarde.","Antes de comungar guarda-se uma hora de jejum eucarístico.","roxo","branco","verde","vermelho","Hoje"]},"fr":{"cn":["Dimanche du Publicain et du Pharisien","Dimanche du Fils prodigue","Dimanche du Jugement dernier","Dimanche
