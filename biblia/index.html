const LNAME={he:'lHe',el:'lEl',la:'lLa'};
const gloss=(lc,i)=>(lc==='he'?GLB:GLA)[LANG]?.split('|')[i]||(lc==='he'?GLB:GLA).en.split('|')[i];
const phMean=(lc,i)=>{const a=(GPH[LANG]||GPH.en).split('|');if(LANGC[lc].phIdx)return a[LANGC[lc].phIdx[i]];const off={la:0,he:8,el:16}[lc];return a[off+i]};
function langUnits(lc){
 const L=LANGC[lc];const u=[];
 if(L.letters)for(let k=0;k*6<L.letters.length;k++)u.push({id:'alpha:'+k,title:t('alpha')+' '+(k+1)});
 for(let k=0;k*6<L.words.length;k++)u.push({id:'vocab:'+k,title:t('vocab')+' '+(k+1)});
 for(let k=0;k*4<L.phrases.length;k++)u.push({id:'phr:'+k,title:t('phrases')+' '+(k+1)});
 if(L.ed)u.push({id:'read:0',title:t('reading')+' 1'},{id:'read:1',title:t('reading')+' 2'});
 return u;
}
const langPct=lc=>{const u=langUnits(lc),p=prog('lang-'+lc);return u.filter(x=>p.done[x.id]).length/u.length};
const anyPct=br=>br==='chars'?Object.keys(prog('chars').done).length/4:br==='feasts'?Object.keys(prog('feasts').done).length/FEASTS.length:br.startsWith('lang-')?langPct(br.slice(5)):pct(br);
const tlang=lc=>lc==='he'?'he':lc==='el'?'el':lc==='cu'?'cu':'la';
function lq(lc,kind,i){
 const L=LANGC[lc],tl=tlang(lc),wk='L:'+lc+':'+kind+':'+i,wbr='lang-'+lc;let q;
 if(kind==='L'){const x=L.letters[i];const others=L.letters.filter((_,k)=>k!==i);
  q=rnd(2)?mcq(t('qLetter'),x[1],pickN(others.map(o=>o[1]),3,[x[1]]),x[0]):mcq(t('qSound'),x[2],pickN(others.map(o=>o[2]),3,[x[2]]),x[0]);q.xlang=tl}
 else if(kind==='W'){const w=L.words[i];const g=gloss(lc,i);const og=L.words.map((_,k)=>gloss(lc,k)).filter((_,k)=>k!==i);
  if(rnd(2)){q=mcq(t('qWord'),g,pickN(og,3,[g]),w[0]+'  ·  '+w[1]);q.xlang=tl}
  else q=mcq(t('qWordRev').replace('{w}',g),w[0],pickN(L.words.filter((_,k)=>k!==i).map(o=>o[0]),3,[w[0]]));
  q.say=[w[0],L.tts]}
 else if(kind==='P'){const p=L.phrases[i];const m=phMean(lc,i);const om=L.phrases.map((_,k)=>phMean(lc,k)).filter((_,k)=>k!==i);
  q=mcq(t('qPhrase'),m,pickN(om,3,[m]),p[0]+'  ·  '+p[1]);q.xlang=tl;q.say=[p[0],L.tts]}
 q.wk=wk;q.wbr=wbr;return q;
}
async function readingQs(lc,n){
 const L=LANGC[lc],ed=L.ed,out=[];
 const verses=[];for(const b of L.books){try{const bk=await getBook(ed,b);if(bk)for(const c of Object.keys(bk.ch))for(const [v,x] of bk.ch[c])verses.push([b,c,v,x])}catch(e){}}
 const cand=shuffle(L.words.map((w,i)=>[w,i]).filter(([w])=>w[2]));
 for(const [w,i] of cand){if(out.length>=n)break;const st=norm(w[2]);const he=lc==='he';const hp=x=>x.normalize('NFC').replace(/[\u0591-\u05AF\u05BD]/g,'');const hl=hp(w[0]);const okTok=tok=>he?false:(tok.startsWith(st)&&tok.length<=st.length+(st.length<=4?3:2));const hits=verses.filter(v=>v[3].length<260&&(he?hp(v[3]).split(/[\s\u05BE\u05C3׀]+/).some(tok=>tok.includes(hl)&&tok.length<=hl.length+4):norm(v[3]).split(/[^\p{L}]+/u).some(okTok)));if(!hits.length)continue;
  const h=hits[rnd(hits.length)];const g=gloss(lc,i);const og=L.words.map((_,k)=>gloss(lc,k)).filter((_,k)=>k!==i);
  const q=mcq(t('qInVerse').replace('{w}',w[0]),g,pickN(og,3,[g]),h[3]+'  —  '+bname(h[0])+' '+h[1]+', '+h[2]);q.xlang=tlang(lc);q.wk='L:'+lc+':W:'+i;q.wbr='lang-'+lc;out.push(q)}
 return out;
}
function lcardHTML(lc,big,sub,mean){const L=LANGC[lc];return `<div class="lcard"><span class="pill soft">${esc(t(LNAME[lc]))}</span><div class="bigglyph" lang="${tlang(lc)}" dir="${lc==='he'?'rtl':'ltr'}">${esc(big)}</div><p class="lead" style="font-size:19px;margin:6px 0">${esc(sub)}</p>${mean?`<p class="note" style="font-size:17px">${esc(mean)}</p>`:''}${sayBtn(big.split(' ')[0]==big?big:big,L.tts)}</div>`}
async function buildLangLesson(lc,id){
 const L=LANGC[lc];const [kind,k]=id.split(':');const n=+k;const items=[];
 if(kind==='alpha'){const idx=[...Array(6).keys()].map(x=>n*6+x).filter(i=>i<L.letters.length);
  idx.forEach(i=>{const x=L.letters[i];items.push({type:'lcard',html:lcardHTML(lc,x[0],x[1]+' · '+x[2],'')})});
  shuffle(idx.concat(idx)).forEach(i=>items.push(lq(lc,'L',i)))}
 else if(kind==='vocab'){const idx=[...Array(6).keys()].map(x=>n*6+x).filter(i=>i<L.words.length);
  idx.forEach(i=>{const w=L.words[i];items.push({type:'lcard',html:lcardHTML(lc,w[0],w[1],gloss(lc,i))})});
  shuffle(idx.concat(idx)).forEach(i=>items.push(lq(lc,'W',i)))}
 else if(kind==='phr'){const idx=[...Array(4).keys()].map(x=>n*4+x).filter(i=>i<L.phrases.length);
  idx.forEach(i=>{const p=L.phrases[i];items.push({type:'lcard',html:lcardHTML(lc,p[0],p[1]+(p[2]?' · '+bname(p[2].split(' ')[0])+' '+p[2].split(' ')[1]:''),phMean(lc,i))})});
  shuffle(idx.concat(idx)).forEach(i=>items.push(lq(lc,'P',i)))}
 else if(kind==='read'){(await readingQs(lc,6)).forEach(q=>items.push(q))}
 return items;
}
async function startLangLesson(lc,id){
 view.innerHTML=`<div class="loading">${esc(t('loading'))}</div>`;
 const items=await buildLangLesson(lc,id);
 if(!items.length){S.view='learn';return renderLearn()}
 LS={br:'lang-'+lc,id,items,i:0,hearts:3,right:0,total:items.filter(x=>x.type!=='lcard'&&x.type!=='card').length,sel:null,checked:false};
 S.view='lesson';setHeader();drawLesson();
}
function restartLesson(br,id){if(br.startsWith('lang-'))startLangLesson(br.slice(5),id);else if(id.startsWith('prac'))startPractice(id.slice(5));else startLesson(br,id)}

function renderLangCourse(){
 const lc=S.lc||'el';S.lc=lc;const L=LANGC[lc];const p=prog('lang-'+lc);const u=langUnits(lc);const nxt=u.findIndex(x=>!p.done[x.id]);const per=Math.round(langPct(lc)*100);
 let h=`<p class="lead">${esc(t('langLead'))}</p><div class="seg" role="group" aria-label="${esc(t('tabLangs'))}">${LCS.map(c=>`<button aria-pressed="${c===lc}" data-lc="${c}">${esc(t(LNAME[c]))}</button>`).join('')}</div>
 <div class="pbar" role="progressbar" aria-valuenow="${per}" aria-valuemin="0" aria-valuemax="100" aria-label="${per}%"><i style="width:${per}%"></i></div><p class="note">${per}% ${esc(ct('progress'))}</p><div class="path">`;
 u.forEach((x,i)=>{const done=!!p.done[x.id],cur=i===nxt,locked=!done&&!cur;const off=[0,40,70,40,0,-40,-70,-40][i%8];
  const icon=x.id.startsWith('alpha')?(lc==='he'?'א':lc==='cu'?'Ѣ':'α'):x.id.startsWith('vocab')?'Aa':x.id.startsWith('phr')?'❝':'📖';
  h+=`<div class="node-wrap" style="transform:translateX(${off}px)"><button class="node ${done?'done':cur?'cur':'locked'}" data-lid="${x.id}" ${locked?'disabled':''} aria-label="${esc(x.title)}">${done?'✓':icon}</button><span class="nlabel">${esc(x.title)}</span></div>`});
 h+=`</div>`;
 return h;
}

async function startPractice(kind){
 const br=S.course||'ortodoxa';const books=COURSE_META[br].books.map(b=>b[0]).filter(x=>SUM[x]);let items=[];
 const msg=m=>{const el=$('#prMsg');if(el)el.innerHTML=`<p class="note" style="margin-top:12px">${esc(m)}</p>`;else alertless(m)};
 const fromBooks=async bs=>{await needVerses(br,bs.slice(0,40));const out=[];for(let k=0;k<80&&out.length<10;k++){const c=bs[rnd(bs.length)];const g=qGen(br,c);const q=g[rnd(g.length)]();if(q)out.push(q)}return out};
 const langAll=lc=>{const L=LANGC[lc];const pool=[];if(L.letters)L.letters.forEach((_,i)=>pool.push(['L',i]));L.words.forEach((_,i)=>pool.push(['W',i]));L.phrases.forEach((_,i)=>pool.push(['P',i]));return pool};
 if(kind.startsWith('g:')){items=await fromBooks(books.filter(c=>GOF[c]===kind.slice(2)))}
 else if(kind.startsWith('l:')){const lc=kind.slice(2);items=shuffle(langAll(lc)).slice(0,10).map(([k,i])=>lq(lc,k,i))}
 else if(kind==='random'){const p=prog(br);const done=books.filter(c=>p.done[c]);const lp=[];
  LCS.forEach(lc=>{const pp=prog('lang-'+lc);langUnits(lc).forEach(u=>{if(!pp.done[u.id])return;const [k,n]=u.id.split(':');const m={alpha:['L',6],vocab:['W',6],phr:['P',4]}[k];if(!m)return;for(let i=+n*m[1];i<(+n+1)*m[1];i++)lp.push([lc,m[0],i])})});
  if(!done.length&&!lp.length)return msg(t('pEmpty'));

 const src=TRMAP.protestante[LANG]||'en-kjv';
 const bk=await getBook(src,b);const [mc,mv]=mapRef('reina-valera-1909',src,b,c,+v);const row=bk&&bk.ch[mc]&&bk.ch[mc].find(r=>r[0]===mv);if(!row)return[];
 const text=row[1],refTxt=`${bname(b)} ${c}, ${v}`,words=text.split(/\s+/);
 const items=[{type:'lcard',html:`<div class="lcard"><span class="pill soft">${esc(t('memo'))}</span><h1 style="font-size:24px">${esc(refTxt)}</h1><p class="qx" lang="${TRLANG[src]}" style="font-size:20px">${esc(text)}</p>${sayBtn(text,TRLANG[src])}</div>`}];
 const cand=words.map((w,k)=>[w.replace(/[^\p{L}]/gu,''),k]).filter(([w])=>w.length>=4);
 const pool=[...new Set(cand.map(x=>x[0]))];
 const extra=['Dios','Señor','amor','vida','luz','God','Lord','love','life','light'];
 shuffle(cand).slice(0,4).forEach(([w,k])=>{const others=pickN(pool.length>3?pool:pool.concat(extra),3,[w]);if(others.length<3)return;

 return items;
}

const SRS_DAYS=[1,3,7,16,30];
const addDays=n=>new Date(Date.now()+n*864e5).toISOString().slice(0,10);
const _recWeakS=recWeak;
recWeak=function(it,ok){
 _recWeakS(it,ok);
 if(!it||!it.wk)return;const k=(it.wbr||LS.br)+'|'+it.wk;const s=store.get('srs',{});const e=s[k];
 if(ok){const b=e?Math.min(e.b+1,SRS_DAYS.length-1):0;s[k]={b,d:addDays(SRS_DAYS[b])}}
 else s[k]={b:0,d:addDays(1)};
 store.set('srs',s);
};
const dueKeys=()=>{const s=store.get('srs',{}),td=today();return Object.keys(s).filter(k=>s[k].d<=td)};
async function itemsFromKeys(keys){
 const items=[];
 for(const k of keys){const i=k.indexOf('|');const wbr=k.slice(0,i),wk=k.slice(i+1);
  try{if(wk.startsWith('L:')){const [,lc,kd,n]=wk.split(':');if(LANGC[lc]&&(kd!=='L'||LANGC[lc].letters))items.push(lq(lc,kd,+n))}
   else if(COURSE_META[wbr]){await needVerses(wbr,[wk]);const g=qGen(wbr,wk);const q=g[rnd(g.length)]();if(q)items.push(q)}}catch(e){}}
 return items.filter(Boolean);
}
const _startPractice=startPractice;
startPractice=async function(kind){
 if(kind!=='due')return _startPractice(kind);
 const keys=shuffle(dueKeys()).slice(0,15);
 if(!keys.length){const el=$('#prMsg');if(el)el.innerHTML=`<p class="note" style="margin-top:12px">${esc(t('dueNone'))}</p>`;return}
 view.innerHTML=`<div class="loading">${esc(t('loading'))}</div>`;
 const items=await itemsFromKeys(keys);
 if(!items.length){renderLearn();return}
 LS={br:'prac',id:'prac:due',items,i:0,hearts:Infinity,right:0,total:items.length,sel:null,checked:false};
 S.view='lesson';setHeader();drawLesson();
};

const _addXP=addXP;
addXP=function(n){
 _addXP(n);
 const d=store.get('xpday',{d:today(),xp:0});if(d.d!==today()){d.d=today();d.xp=0}
 const before=d.xp;d.xp+=n;store.set('xpday',d);
 const goal=store.get('goal',30);if(before<goal&&d.xp>=goal)store.set('goalDays',store.get('goalDays',0)+1);
 const s=stats();if(s.streak>store.get('bestStreak',0))store.set('bestStreak',s.streak);
};
const _endLesson=endLesson;
endLesson=function(ok){if(LS&&LS.id==='prac:memo')store.set('memoCount',store.get('memoCount',0)+1);_endLesson(ok)};
function goalHTML(){
 const goal=store.get('goal',30);const d=store.get('xpday',{d:today(),xp:0});const xp=d.d===today()?d.xp:0;const per=Math.min(100,Math.round(xp/goal*100));
 return `<div class="card goalc"><div class="t" style="font-size:20px">${esc(t('goalT'))}<span class="pill ${xp>=goal?'':'soft'}">${xp>=goal?esc(t('goalDone')):xp+' / '+goal+' XP'}</span></div>
 <div class="pbar small" style="height:10px;margin:10px 0"><i style="width:${per}%"></i></div>
 <div class="seg" role="group" aria-label="${esc(t('goalPick'))}" style="margin:0">${[10,30,50,100].map(g=>`<button aria-pressed="${g===goal}" data-goal="${g}">${g} XP</button>`).join('')}</div></div>`;
}

function badgeState(){
 const st=stats(),best=Math.max(store.get('bestStreak',0),st.streak);
 const courses=['ortodoxa','catolica','protestante'];
 const anyDone=courses.some(b=>Object.keys(prog(b).done).length)||['el','he','la'].some(l=>Object.keys(prog('lang-'+l).done).length);
 const alphaDone=lc=>langUnits(lc).filter(u=>u.id.startsWith('alpha')).every(u=>prog('lang-'+lc).done[u.id]);
 return {first:anyDone,streak3:best>=3,streak7:best>=7,streak30:best>=30,xp100:st.xp>=100,xp1000:st.xp>=1000,goal7:store.get('goalDays',0)>=7,
  mastery:courses.some(b=>pct(b)>=.85),exam:courses.some(b=>(prog(b).exam||0)>=85),alpha:alphaDone('el')&&alphaDone('he'),
  polyglot:['el','he','la'].every(l=>Object.keys(prog('lang-'+l).done).length>0),memo7:store.get('memoCount',0)>=7};
}

ro:"Fecioara Maria se naște din Ioachim și Ana; este primul mare praznic al anului bisericesc.|Amintește aflarea Crucii la Ierusalim și cinstește Crucea lui Hristos.|Copilă fiind, Maria este adusă la Templul din Ierusalim și închinată lui Dumnezeu.|Nașterea lui Iisus Hristos în Betleem, precedată de un post de patruzeci de zile.|Botezul lui Hristos în Iordan, unde se descoperă Sfânta Treime; se sfințesc apele.|La patruzeci de zile de la naștere, Iisus este adus la Templu și Simeon Îl primește în brațe.|Arhanghelul Gavriil îi vestește Mariei că va fi Maica Fiului lui Dumnezeu.|Iisus intră în Ierusalim pe un asin, iar poporul Îl întâmpină cu ramuri.|Învierea lui Hristos, sărbătoarea sărbătorilor: „Hristos a înviat!”|La patruzeci de zile după Paști, Hristos Se înalță la cer înaintea apostolilor.|La cincizeci de zile după Paști, Duhul Sfânt Se pogoară peste apostoli.|Pe muntele Tabor, Hristos le arată slava Sa dumnezeiască lui Petru, Iacob și Ioan.|Maica Domnului adoarme în Domnul; praznicul este precedat de două săptămâni de post."};

const fName=i=>(FN[LANG]||FN.en).split('|')[i], fDesc=i=>(FD[LANG]||FD.en).split('|')[i];

function paschaDate(y){const a=y%4,b=y%7,c=y%19,d=(19*c+15)%30,e=(2*a+4*b-d+34)%7,m=Math.floor((d+e+114)/31),day=((d+e+114)%31)+1;return new Date(Date.UTC(y,m-1,day+13))}
function feastDate(i,y){const f=FEASTS[i];if(f[1])return new Date(Date.UTC(y,f[1][0]-1,f[1][1]));const p=paschaDate(y);return new Date(p.getTime()+f[2]*864e5)}
const fmtD=d=>{try{return new Intl.DateTimeFormat(LANG,{day:'numeric',month:'long',timeZone:'UTC'}).format(d)}catch(e){return d.toISOString().slice(5,10)}};
function nextFeast(){const now=new Date();const td=Date.UTC(now.getFullYear(),now.getMonth(),now.getDate());let best=null;
 for(const y of [now.getFullYear(),now.getFullYear()+1])FEASTS.forEach((_,i)=>{const d=feastDate(i,y);if(d.getTime()>=td&&(!best||d<best.d))best={i,d}});return best}
const gRef=g=>`${bname(g[0])} ${g[1]}, ${g[2]}–${g[3]}`;

async function feastGospel(i){
 const g=FEASTS[i][3];const ed='ortodoxa-griega';const tr=TRMAP.ortodoxa[LANG]===null?null:(TRMAP.ortodoxa[LANG]||'en-ortho');
 const ob=await getBook(ed,g[0]);const tb=tr?await getBookAlias(tr,g[0]).catch(()=>null):null;
 const rows=(ob.ch[String(g[1])]||[]).filter(r=>r[0]>=g[2]&&r[0]<=g[3]);
 return rows.map(([v,x])=>{const row=tb&&tb.ch[String(g[1])]&&tb.ch[String(g[1])].find(r=>r[0]===v);return {v,o:x,t:row?row[1]:null,tl:tr?TRLANG[tr]:null}});
}
async function buildFeastLesson(i){
 const y=new Date().getFullYear();const d=feastDate(i,y);const f=FEASTS[i];const items=[];
 const dateTxt=f[1]?`${fmtD(d)} · ${t('fOld').replace('{d}',fmtD(new Date(d.getTime()+13*864e5)))}`:`${fmtD(d)} ${y} · ${t('fMovable')}`;
 items.push({type:'lcard',html:`<div class="lcard"><span class="pill soft">${esc(t('tabFeasts'))}</span><h1 style="font-size:28px">${esc(fName(i))}</h1><p class="note">${esc(dateTxt)}</p><p class="lead" style="font-size:18px">${esc(fDesc(i))}</p></div>`});
 const gs=await feastGospel(i).catch(()=>[]);
 if(gs.length)items.push({type:'lcard',html:`<div class="lcard"><span class="pill soft">${esc(t('fGospel'))} · ${esc(gRef(f[3]))}</span><div class="bil" style="margin-top:12px;max-height:46vh;overflow:auto">${gs.slice(0,8).map(r=>`<div class="pair"><p class="txt" lang="el"><sup>${r.v}</sup>${esc(r.o)}</p>${r.t?`<p class="tr" lang="${r.tl}">${esc(r.t)}</p>`:''}</div>`).join('')}</div><button class="btn ghost" data-readfeast="${i}" style="margin-top:10px;width:100%">${esc(ct('read'))}</button></div>`});
 const others=FEASTS.map((_,k)=>k).filter(k=>k!==i);
 const wk='F:'+i;
 const q1=f[1]?mcq(t('qFeastDate').replace('{f}',fName(i)),fmtD(d),shuffle(others.filter(k=>FEASTS[k][1])).slice(0,3).map(k=>fmtD(feastDate(k,y)))):null;
 const q2=mcq(t('qFeastGospel').replace('{f}',fName(i)),gRef(f[3]),[...new Set(others.map(k=>gRef(FEASTS[k][3])))].filter(r=>r!==gRef(f[3])).slice(0,8).sort(()=>Math.random()-.5).slice(0,3));
 const q3=mcq(t('qFeastWhich'),fName(i),shuffle(others).slice(0,3).map(fName),fDesc(i));
 [q1,q2,q3].filter(Boolean).forEach(q=>{q.wk=wk;q.wbr='feasts';items.push(q)});
 const pr=gs.filter(r=>r.t||LANG==='el');
 if(pr.length>=4){const k=rnd(pr.length-1);const nx=(pr[k+1].t||pr[k+1].o);const opts=pickN(pr.filter((_,j)=>j!==k&&j!==k+1).map(r=>r.t||r.o),3,[nx]);
  if(opts.length===3){const q=mcq(ct('qNextV')+' ('+gRef(f[3])+')',nx,opts,pr[k].t||pr[k].o);q.wk=wk;q.wbr='feasts';items.push(q)}}
 return items;
}
async function startFeast(i){
 view.innerHTML=`<div class="loading">${esc(t('loading'))}</div>`;
 const items=await buildFeastLesson(i);
 LS={br:'feasts',id:'feast:'+i,items,i:0,hearts:HEARTS[lv()]||3,right:0,total:items.filter(x=>x.type==='mcq').length,sel:null,checked:false};
 S.view='lesson';setHeader();drawLesson();
}
document.addEventListener('click',e=>{const b=e.target.closest&&e.target.closest('[data-readfeast]');if(!b)return;const g=FEASTS[+b.dataset.readfeast][3];LS=null;go('read',{sec:'bible',ed:'ortodoxa-griega',book:g[0],ch:String(g[1]),hl:g[2]})});
function renderFeasts(){
 const p=prog('feasts');const n=nextFeast();const y=new Date().getFullYear();const done=FEASTS.filter((_,i)=>p.done['feast:'+i]).length;
 let h=`<p class="lead">${esc(t('feastsLead'))}</p>`;
 if(n)h+=`<button class="card main" data-feast="${n.i}"><div class="t">${esc(t('fNext'))}<span class="pill">${esc(fmtD(n.d))}</span></div><div class="s" style="font-size:18px;color:#F6F1E7;font-weight:700">${esc(fName(n.i))}</div><div class="s">${esc(fDesc(n.i))}</div></button>`;
 h+=`<div class="pbar small" style="height:10px"><i style="width:${Math.round(done/FEASTS.length*100)}%"></i></div><p class="note">${done}/${FEASTS.length}</p><div class="booklist">`;
 FEASTS.forEach((f,i)=>{const d=feastDate(i,y);h+=`<button class="book" data-feast="${i}"><span>${p.done['feast:'+i]?'✓ ':''}${esc(fName(i))}</span><small>${esc(fmtD(d))}</small></button>`});
 return h+`</div>`;
}
function bindFeasts(){view.querySelectorAll('[data-feast]').forEach(x=>x.onclick=()=>startFeast(+x.dataset.feast))}
const _restart5=restartLesson;
restartLesson=function(br,id){if(id.startsWith('feast:'))return startFeast(+id.slice(6));_restart5(br,id)};
// el repaso espaciado también conoce las fiestas
const _itemsFromKeys=itemsFromKeys;
itemsFromKeys=async function(keys){
 const fk=keys.filter(k=>k.startsWith('feasts|'));const rest=keys.filter(k=>!k.startsWith('feasts|'));
 const items=await _itemsFromKeys(rest);
 for(const k of fk){const i=+k.split(':')[1];try{const l=(await buildFeastLesson(i)).filter(x=>x.type==='mcq');if(l.length)items.push(l[rnd(l.length)])}catch(e){}}
 return items;
};

pt:"O primeiro homem, criado por Deus e colocado no jardim do Éden.|Um homem justo que construiu a arca e foi salvo do dilúvio.|Pai dos crentes; deixou a sua terra confiando na promessa de Deus.|Filho de Jacó, vendido pelos irmãos, que chegou a governar o Egito.|Tirou Israel do Egito e recebeu a Lei no monte Sinai.|Sucessor de Moisés, que levou o povo à Terra Prometida.|Uma moabita fiel a Noemi, bisavó de Davi.|Profeta e juiz que ungiu os primeiros reis de Israel.|O pastor que venceu Golias, rei de Israel e autor de salmos.|Filho de Davi, famoso pela sua sabedoria; construiu o Templo.|Profeta que enfrentou os sacerdotes de Baal e subiu ao céu num carro de fogo.|Profeta que anunciou o nascimento e os sofrimentos do Messias.|Um jovem exilado na Babilônia, salvo da cova dos leões.|Profeta que fugiu de Deus, passou três dias num grande peixe e pregou em Nínive.|Disse sim ao anjo Gabriel e tornou-se a Mãe do Filho de Deus.|O Precursor, que batizou Jesus no Jordão.|Pescador e apóstolo que negou Jesus e depois guiou a Igreja.|O antigo perseguidor que se tornou o apóstolo das nações.|O discípulo amado, autor de um Evangelho e do Apocalipse.|A primeira a ver Cristo ressuscitado; venerada como «igual aos apóstolos».",
fr:"Le premier homme, créé par Dieu et placé dans le jardin d’Éden.|Un juste qui construisit l’arche et fut sauvé du déluge.|Père des croyants ; il quitta son pays en se fiant à la promesse de Dieu.|Fils de Jacob, vendu par ses frères, devenu gouverneur de l’Égypte.|Il fit sortir Israël d’Égypte et reçut la Loi sur le mont Sinaï.|Successeur de Moïse, qui conduisit le peuple en Terre promise.|Une Moabite fidèle à Noémi, arrière-grand-mère de David.|Prophète et juge qui oignit les premiers rois d’Israël.|Le berger qui vainquit Goliath, roi d’Israël et auteur de psaumes.|Fils de David, célèbre pour sa sagesse ; il bâtit le Temple.|Prophète qui affronta les prêtres de Baal et fut enlevé dans un char de feu.|Prophète qui annonça la naissance et les souffrances du Messie.|Un jeune exilé à Babylone, sauvé de la fosse aux lions.|Prophète qui fuit Dieu, passa trois jours dans un grand poisson et prêcha à Ninive.|Elle dit oui à l’ange Gabriel et devint la Mère du Fils de Dieu.|Le Précurseur, qui baptisa Jésus dans le Jourdain.|Pêcheur et apôtre qui renia Jésus puis guida l’Église.|L’ancien persécuteur devenu l’apôtre des nations.|Le disciple bien-aimé, auteur d’un Évangile et de l’Apocalypse.|La première à voir le Christ ressuscité ; vénérée comme « égale aux apôtres ».",
it:"Il primo uomo, creato da Dio e posto nel giardino dell’Eden.|Un uomo giusto che costruì l’arca e fu salvato dal diluvio.|Padre dei credenti; lasciò la sua terra fidandosi della promessa di Dio.|Figlio di Giacobbe, venduto dai fratelli, divenuto governatore d’Egitto.|Fece uscire Israele dall’Egitto e ricevette la Legge sul monte Sinai.|Successore di Mosè, che condusse il popolo nella Terra promessa.|Una moabita fedele a Noemi, bisnonna di Davide.|Profeta e giudice che unse i primi re d’Israele.|Il pastore che sconfisse Golia, re d’Israele e autore di salmi.|Figlio di Davide, famoso per la sua sapienza; costruì il Tempio.|Profeta che affrontò i sacerdoti di Baal e salì al cielo su un carro di fuoco.|Profeta che annunciò la nascita e le sofferenze del Messia.|Un giovane esiliato a Babilonia, salvato dalla fossa dei leoni.|Profeta che fuggì da Dio, passò tre giorni in un grande pesce e predicò a Ninive.|Disse sì all’angelo Gabriele e divenne la Madre del Figlio di Dio.|Il Precursore, che battezzò Gesù nel Giordano.|Pescatore e apostolo che rinnegò Gesù e poi guidò la Chiesa.|L’antico persecutore divenuto apostolo delle genti.|Il discepolo amato, autore di un Vangelo e dell’Apocalisse.|La prima a vedere Cristo risorto; venerata come «uguale agli apostoli».",
de:"Der erste Mensch, von Gott erschaffen und in den Garten Eden gesetzt.|Ein Gerechter, der die Arche baute und vor der Flut gerettet wurde.|Vater der Glaubenden; er verließ seine Heimat im Vertrauen auf Gottes Verheißung.|Sohn Jakobs, von seinen Brüdern verkauft, der Herrscher in Ägypten wurde.|Er führte Israel aus Ägypten und empfing das Gesetz am Berg Sinai.|Nachfolger des Mose, der das Volk ins Gelobte Land führte.|Eine Moabiterin, treu zu Noomi, Urgroßmutter Davids.|Prophet und Richter, der die ersten Könige Israels salbte.|Der Hirte, der Goliat besiegte, König Israels und Dichter von Psalmen.|Sohn Davids, berühmt für seine Weisheit; er baute den Tempel.|Prophet, der den Baalspriestern entgegentrat und in einem Feuerwagen entrückt wurde.|Prophet, der Geburt und Leiden des Messias ankündigte.|Ein junger Verbannter in Babylon, aus der Löwengrube gerettet.|Prophet, der vor Gott floh, drei Tage in einem großen Fisch war und in Ninive predigte.|Sie sagte Ja zum Engel Gabriel und wurde die Mutter des Sohnes Gottes.|Der Vorläufer, der Jesus im Jordan taufte.|Fischer und Apostel, der Jesus verleugnete und dann die Kirche leitete.|Der frühere Verfolger, der zum Apostel der Völker wurde.|Der Lieblingsjünger, Verfasser eines Evangeliums und der Offenbarung.|Die Erste, die den Auferstandenen sah; als „apostelgleich“ verehrt.",
el:"Ο πρώτος άνθρωπος, που έπλασε ο Θεός και έβαλε στον κήπο της Εδέμ.|Ένας δίκαιος που έφτιαξε την κιβωτό και σώθηκε από τον κατακλυσμό.|Πατέρας των πιστών· άφησε την πατρίδα του εμπιστευόμενος την υπόσχεση του Θεού.|Γιος του Ιακώβ, πουλήθηκε από τα αδέλφια του και έγινε άρχοντας στην Αίγυπτο.|Έβγαλε τον Ισραήλ από την Αίγυπτο και έλαβε τον Νόμο στο Σινά.|Διάδοχος του Μωυσή, που οδήγησε τον λαό στη Γη της Επαγγελίας.|Μια Μωαβίτισσα πιστή στη Νωεμίν, προγιαγιά του Δαβίδ.|Προφήτης και κριτής που έχρισε τους πρώτους βασιλείς του Ισραήλ.|Ο βοσκός που νίκησε τον Γολιάθ, βασιλιάς του Ισραήλ και ποιητής ψαλμών.|Γιος του Δαβίδ, ξακουστός για τη σοφία του· έχτισε τον Ναό.|Προφήτης που αντιμετώπισε τους ιερείς του Βάαλ και αναλήφθηκε με πύρινο άρμα.|Προφήτης που προανήγγειλε τη γέννηση και τα πάθη του Μεσσία.|Ένας νέος εξόριστος στη Βαβυλώνα, που σώθηκε από τον λάκκο των λεόντων.|Προφήτης που έφυγε από τον Θεό, έμεινε τρεις μέρες σε μεγάλο ψάρι και κήρυξε στη Νινευή.|Είπε «ναι» στον άγγελο Γαβριήλ και έγινε Μητέρα του Υιού του Θεού.|Ο Πρόδρομος, που βάπτισε τον Ιησού στον Ιορδάνη.|Ψαράς και απόστολος που αρνήθηκε τον Ιησού και ύστερα οδήγησε την Εκκλησία.|Ο πρώην διώκτης που έγινε ο απόστολος των εθνών.|Ο αγαπημένος μαθητής, συγγραφέας ενός Ευαγγελίου και της Αποκάλυψης.|Η πρώτη που είδε τον αναστημένο Χριστό· τιμάται ως «ισαπόστολος».",
ru:"Первый человек, созданный Богом и поселённый в Эдемском саду.|Праведник, построивший ковчег и спасённый от потопа.|Отец верующих; он оставил родину, доверившись обетованию Бога.|Сын Иакова, проданный братьями, ставший правителем в Египте.|Он вывел Израиль из Египта и получил Закон на горе Синай.|Преемник Моисея, который ввёл народ в Землю обетованную.|Моавитянка, верная Ноемини, прабабушка Давида.|Пророк и судья, помазавший первых царей Израиля.|Пастух, победивший Голиафа, царь Израиля и автор псалмов.|Сын Давида, прославленный мудростью; он построил Храм.|Пророк, обличивший жрецов Ваала и взятый на небо в огненной колеснице.|Пророк, предвозвестивший рождение и страдания Мессии.|Юный пленник в Вавилоне, спасённый из львиного рва.|Пророк, бежавший от Бога, три дня бывший во чреве кита и проповедовавший в Ниневии.|Она ответила «да» архангелу Гавриилу и стала Матерью Сына Божия.|Предтеча, крестивший Иисуса в Иордане.|Рыбак и апостол, отрёкшийся от Иисуса, а затем возглавивший Церковь.|Бывший гонитель, ставший апостолом язычников.|Возлюбленный ученик, автор Евангелия и Откровения.|Первой увидела воскресшего Христа; почитается как равноапостольная.",
ro:"Primul om, făcut de Dumnezeu și așezat în grădina Edenului.|Un om drept care a construit corabia și a fost salvat de potop.|Părintele credincioșilor; și-a lăsat țara încrezându-se în făgăduința lui Dumnezeu.|Fiul lui Iacob, vândut de frații săi, ajuns stăpânitor în Egipt.|A scos pe Israel din Egipt și a primit Legea pe muntele Sinai.|Urmașul lui Moise, care a dus poporul în Țara Făgăduinței.|O moabiteancă credincioasă Noemiei, străbunica lui David.|Prooroc și judecător care i-a uns pe primii regi ai lui Israel.|Păstorul care l-a învins pe Goliat, rege al lui Israel și autor de psalmi.|Fiul lui David, vestit pentru înțelepciunea lui; a zidit Templul.|Proorocul care i-a înfruntat pe preoții lui Baal și a fost ridicat la cer într-un car de foc.|Proorocul care a vestit nașterea și pătimirile lui Mesia.|Un tânăr exilat în Babilon, salvat din groapa cu lei.|Prooroc care a fugit de Dumnezeu, a stat trei zile într-un pește mare și a propovăduit în Ninive.|A spus „da” arhanghelului Gavriil și a devenit Maica Fiului lui Dumnezeu.|Înaintemergătorul, care L-a botezat pe Iisus în Iordan.|Pescar și apostol care S-a lepădat de Iisus și apoi a condus Biserica.|Fostul prigonitor devenit apostolul neamurilor.|Ucenicul iubit, autorul unei Evanghelii și al Apocalipsei.|Prima care L-a văzut pe Hristos înviat; cinstită ca „întocmai cu apostolii”."};

function charQ(i){
 const others=[...Array(20).keys()].filter(k=>k!==i);let q;
 if(CHB[i]&&rnd(2)){const bk=CHB[i];const avoid=['1SA','2SA'].includes(bk)?['1SA','2SA']:[bk];const opts=[...new Set(CHB.filter(b=>b&&!avoid.includes(b)))];

}
function startChars(g){
 const idx=[0,1,2,3,4].map(x=>g*5+x);const items=[];
 idx.forEach(i=>items.push({type:'lcard',html:`<div class="lcard"><span class="pill soft">${esc(t('tabChars'))}</span><h1 style="font-size:28px">${esc(cName(i))}</h1><p class="lead" style="font-size:18px">${esc(cDesc(i))}</p>${CHB[i]?`<p class="note">${esc(bname(CHB[i]))}</p>`:''}</div>`}));
 shuffle(idx.concat(idx)).forEach(i=>items.push(charQ(i)));
 LS={br:'chars',id:'chars:'+g,items,i:0,hearts:HEARTS[lv()]||3,right:0,total:items.filter(x=>x.type==='mcq').length,sel:null,checked:false};
 S.view='lesson';setHeader();drawLesson();

function renderChars(){
 const p=prog('chars');const nxt=[0,1,2,3].findIndex(g=>!p.done['chars:'+g]);
 let h=`<p class="lead">${esc(t('charsLead'))}</p><div class="path">`;
 [0,1,2,3].forEach(g=>{const done=!!p.done['chars:'+g],cur=g===nxt,locked=!done&&!cur;const off=[0,50,0,-50][g];
  h+=`<div class="node-wrap" style="transform:translateX(${off}px)"><button class="node ${done?'done':cur?'cur':'locked'}" data-chg="${g}" ${locked?'disabled':''} aria-label="${esc(t('charsGroup').replace('{n}',g+1))}">${done?'✓':g+1}</button><span class="nlabel">${esc([0,1,2,3,4].map(x=>cName(g*5+x)).join(', '))}</span></div>`});
 return h+`</div>`;
}

// say() admite varias partes separadas por "|" que suenan seguidas con una pausa
say=function(text,lang){
 let parts=String(text).split('|').filter(Boolean);
 if(lang&&lang.startsWith('ru'))parts=parts.map(cuSpeak);
 if(window.PhosApp){try{PhosApp.speak(parts.join('|'),String(lang||''))}catch(e){}return}
 try{speechSynthesis.cancel();parts.forEach((p,i)=>{if(i){const g=new SpeechSynthesisUtterance(' ');g.volume=0;g.lang=lang;speechSynthesis.speak(g)}
  const u=new SpeechSynthesisUtterance(p);u.lang=lang;u.rate=i?.6:.8;speechSynthesis.speak(u)})}catch(e){}
};

 d.querySelector('.hnx').onclick=close;d.querySelector('.hnok').onclick=close;
 view.prepend(d);
}

function fHas(id,b){const m=bookMeta(id).map;return !!(m[b]||(ALIAS[b]||[]).some(x=>m[x])||(b==='DNG'&&m.BEL))}
const F_CACHE={};
function fBook(id,b){const k=id+'/'+b;return F_CACHE[k]||(F_CACHE[k]=getBookAlias(id,b).catch(()=>null))}
async function fVerses(p){
 for(const id of fEds()){
  if(!fHas(id,p[0]))continue;
  const segs=[];
  for(const [c,a,z] of p[1]){
   let [c1,a1]=mapRef('reina-valera-1909',id,p[0],c,a),[,z1]=mapRef('reina-valera-1909',id,p[0],c,z);
   let bk=await fBook(id,p[0]);
   if((!bk||!bk.ch[c1])&&p[0]==='DNG'&&c===14){bk=await fBook(id,'BEL');c1='1'}
   const vs=bk&&bk.ch[c1]?bk.ch[c1].filter(v=>v[0]>=a1&&v[0]<=z1):[];
   if(vs.length)segs.push({c,a,z,txt:vs.map(v=>v[1]).join(' ')});
  }
  if(segs.length)return {id,segs};
 }
 return null;
}
function fOpenBible(p){
 const ed='ortodoxa-griega';let b=p[0],[c]=mapRef('reina-valera-1909',ed,p[0],p[1][0][0],p[1][0][1]);
 if(b==='DNG'&&p[1][0][0]===14){b='BEL';c='1'}
 const m=bookMeta(ed).map;const key=m[b]?b:(ALIAS[b]||[]).find(x=>m[x]);if(!key)return;
 const ch=(m[key].chs.find(x=>String(x)===String(c)))??m[key].chs[0];
 go('read',{sec:'bible',ed,book:key,ch});
}

 <p class="note">${esc(t('fGen'))}</p>`;

 phosHNote();

async function renderFood(f){
 if(!FIDS.includes(f))return go('foods');
 const list=FPAS.map((p,i)=>[p,i]).filter(([p])=>p[4].includes(f));
 view.innerHTML=`<h1><span aria-hidden="true">${FICO[f]}</span> ${esc(foodName(f))}</h1><p class="lead">${esc(fNum(list.length))}</p>
 ${list.map(([p,i])=>`<article class="art fdp"><h2 class="ah">${esc(foodTitle(i))}</h2>
  <p class="fdtags"><span class="pill ${p[2]==='J'?'fdj':'fdg'}">${esc(p[2]==='J'?t('fJesus'):t('fGod'))}</span><span class="pill soft">${esc(foodTy(p[3]))}</span>${F_DEUT.has(p[0])?`<span class="fdoc">${esc(t('fOC'))}</span>`:''}</p>
  <div class="fdv" data-i="${i}"><blockquote class="vq"><cite>${esc(fCite(p))}</cite></blockquote></div>
  <p class="fdfoods">${p[4].filter(x=>x!==f).map(x=>`<button class="fdmini" data-food="${x}">${FICO[x]} ${esc(foodName(x))}</button>`).join('')}</p>
  <button class="btn ghost fdread" data-i="${i}">📖 ${esc(t('fRead'))}</button></article>`).join('')}`;
 view.querySelectorAll('.fdmini').forEach(b=>b.onclick=()=>go('food',{food:b.dataset.food}));
 view.querySelectorAll('.fdread').forEach(b=>b.onclick=()=>fOpenBible(FPAS[+b.dataset.i]));
 for(const [p,i] of list){
  const box=view.querySelector(`.fdv[data-i="${i}"]`);if(!box)continue;
  fVerses(p).then(r=>{if(!r||!box.isConnected)return;
   const lg=TRLANG[r.id]||(r.id==='ortodoxa-griega'?'el':'en');
   box.innerHTML=r.segs.map(s=>`<blockquote class="vq" lang="${lg}"><span>${esc(s.txt)}</span><cite>${esc(bname(p[0]))} ${s.c}, ${s.a===s.z?s.a:s.a+'–'+s.z} · ${esc(TRNAME[r.id]||edName(r.id))}</cite></blockquote>`).join('')});
 }
}

const TPTX={"es":{"rest":[["Dios descansó el séptimo día","El descanso no es pereza: forma parte de la creación. Dios termina su obra y bendice el séptimo día. Detenerse un día a la semana nos recuerda que el mundo no depende solo de nuestro esfuerzo."],["El sábado, hecho para el hombre","Moisés une el descanso a la libertad: en Egipto los esclavos no descansaban. Jesús lo resume diciendo que el sábado se hizo para el hombre. Descansar es un regalo que también debemos dar a los demás."],["Descanso para la tierra y los animales","La Ley pide descanso también para el buey, el asno y la tierra, que reposa cada siete años. El cuidado de Dios llega a toda la creación, y el nuestro debería llegar también."],["Elías: dormir, comer y seguir","Agotado, Elías quiere rendirse. Dios no le reprocha nada: le deja dormir, le da pan y agua, y solo después lo pone de nuevo en camino. A veces lo más espiritual es descansar."],["Dormir en paz","El salmista duerme tranquilo en medio del peligro porque se sabe cuidado. Encomendar el día a Dios antes de dormir es una antigua costumbre cristiana que trae serenidad a la noche."],["Dios da el sueño a sus amados","Madrugar y trasnochar con ansiedad no añade nada a lo que Dios construye. El Eclesiastés observa que el sueño del trabajador es dulce: trabajar con medida y confiar trae descanso."],["Junto a aguas de reposo","El Buen Pastor no solo guía: también hace descansar. Los verdes pastos y las aguas tranquilas son la imagen de un alma que se deja cuidar y recobra fuerzas."],["En quietud y en confianza","«Estad quietos y conoced que yo soy Dios». Isaías añade que en la quietud y la confianza está nuestra fuerza. El silencio interior es una forma de descanso que la vida de hoy necesita mucho."],["Los que esperan en el Señor","Dios no se cansa ni se fatiga, y da fuerzas al cansado. Quien espera en Él renueva sus fuerzas como el águila. El descanso verdadero empieza por saber de quién depende uno."],["Un tiempo para cada cosa","Hay tiempo de trabajar y tiempo de parar. Más vale un puño lleno con descanso que dos llenos con fatiga: el Eclesiastés invita a medir el esfuerzo y a no vivir solo para producir."],["El sueño sano de quien come con mesura","El Eclesiástico une la mesa y el sueño: quien come con moderación duerme bien y se levanta despejado. Es una sabiduría práctica que la tradición ortodoxa conserva en su equilibrio entre ayuno y alimento."],["Venid a mí y yo os haré descansar","Jesús ofrece descanso a los cansados y agobiados, no quitando toda carga, sino compartiéndola: su yugo es suave. Es un descanso del alma que nace de la mansedumbre y la humildad."],["Venid aparte y descansad un poco","Jesús ve a sus discípulos agotados y los lleva a un lugar tranquilo. Con Marta y María enseña lo mismo: entre muchas tareas, una sola cosa es necesaria, sentarse a escucharle."],["Jesús duerme en la tormenta","Mientras el viento sacude la barca, Jesús duerme. Su calma nace de la confianza en el Padre. Calma la tormenta y pregunta a los suyos: «¿Por qué tenéis miedo?»."],["El descanso eterno","La Carta a los Hebreos habla de un reposo que aún espera al pueblo de Dios, y el Apocalipsis, de los que descansan de sus trabajos. Cada domingo es un anticipo de ese descanso final."]],"fast":[["Moisés: cuarenta días ante Dios","Moisés pasa cuarenta días sin pan ni agua mientras recibe la Ley. Es un ayuno extraordinario, no un modelo a imitar: muestra que el ayuno nace del encuentro con Dios y prepara para escucharle."],["Afligir el alma: el Día de la Expiación","En el Día de la Expiación el pueblo «aflige su alma», es decir, ayuna. Es un día de reconciliación: el ayuno acompaña el deseo de empezar de nuevo, limpio delante de Dios."],["David ayuna por su hijo","David ayuna y ora mientras su hijo está enfermo. Cuando muere, se levanta, se lava y come. El ayuno es súplica y esperanza, pero también aceptación de la voluntad de Dios."],["Ayunar antes del camino","Esdras proclama un ayuno antes de un viaje peligroso, y Nehemías ayuna y ora al saber de la ruina de Jerusalén. Ante las grandes decisiones, el ayuno ayuda a ponerlas en manos de Dios."],["Ester: tres días por su pueblo","Antes de arriesgar su vida ante el rey, Ester pide a su pueblo que ayune con ella. El ayuno también se vive en comunidad: no solo por uno mismo, sino por los demás."],["Oración, ayuno y limosna","Judit vive su viudez en ayuno y oración, sin dejar de celebrar las fiestas. Tobías resume la tradición: buena es la oración con ayuno, limosna y justicia. Son los tres pilares que la Iglesia mantiene en la Cuaresma."],["El ayuno que Dios quiere","Isaías denuncia un ayuno que convive con la injusticia. El ayuno que agrada a Dios es compartir el pan con el hambriento y liberar al oprimido. Sin caridad, el ayuno pierde su sentido."],["Rasgad vuestro corazón","Joel llama a convertirse con ayuno y llanto, rasgando el corazón y no los vestidos. Nínive entera ayuna y Dios se compadece. El ayuno es un camino de conversión."],["¿Ayunasteis para mí?","Dios pregunta a su pueblo si sus ayunos eran de verdad para Él. Lo que pide es justicia, misericordia y no oprimir al débil, y promete que los días de ayuno se convertirán en días de gozo."],["Daniel: ayuno y oración","Daniel busca a Dios con oración y ayuno, y en otra ocasión se abstiene durante tres semanas de manjares, carne y vino. Es un ayuno parcial, muy parecido al que practica la tradición ortodoxa."],["Ana, de noche y de día","La profetisa Ana sirve a Dios en el templo con ayunos y oraciones, y es de las primeras en reconocer al Niño Jesús. El ayuno perseverante afina la mirada del corazón."],["Jesús ayuna en el desierto","Antes de comenzar su misión, Jesús ayuna cuarenta días y vence la tentación con la Palabra: «No solo de pan vivirá el hombre». La Gran Cuaresma imita estos cuarenta días."],["Ayunar en lo secreto","Jesús da por hecho que sus discípulos ayunarán, pero pide hacerlo sin aparentar, con el rostro lavado. El ayuno es algo entre el alma y el Padre, que ve en lo secreto."],["Cuando el esposo les sea quitado","Mientras Jesús está con ellos, sus discípulos no ayunan; lo harán cuando les sea quitado. Por eso la Iglesia ayuna los viernes, día de la Cruz, y une siempre el ayuno a la oración."],["La Iglesia ayuna y ora","La primera comunidad cristiana ayuna y ora antes de enviar a Pablo y Bernabé, y también al elegir a sus presbíteros. El ayuno acompaña las decisiones importantes de la Iglesia."]],"pray":[["Meditar de día y de noche","El justo medita la Palabra de Dios de día y de noche, como un árbol plantado junto al agua. Meditar no es vaciar la mente, sino llenarla despacio de lo que Dios ha dicho."],["Ana derrama su alma","Ana ora en silencio, moviendo solo los labios, con el corazón roto. El sacerdote no la entiende, pero Dios sí. La oración sincera no necesita palabras bonitas."],["La oración de Salomón","Salomón reconoce que ni los cielos pueden contener a Dios y, aun así, le pide que escuche desde el templo. Toda oración es un encuentro entre la grandeza de Dios y nuestra pequeñez."],["El susurro apacible","Dios no estaba en el viento, ni en el terremoto, ni en el fuego, sino en un susurro suave. Para escucharlo hace falta silencio: es el corazón de la oración hesicasta de la tradición ortodoxa."],["Oración de la mañana y de la tarde","El salmista ora al amanecer y eleva su oración como incienso al atardecer; Daniel ora tres veces al día. Rezar a horas fijas da forma al día y está en la raíz de la oración de la Iglesia."],["Desde lo profundo","El alma tiene sed de Dios como el ciervo del agua, y clama desde lo profundo esperándole más que los centinelas a la aurora. Los Salmos enseñan a orar también desde la tristeza."],["Mi alma descansa en silencio","«Solo en Dios descansa mi alma», como un niño en brazos de su madre. La oración no siempre habla: a veces consiste solo en estar en calma delante de Dios."],["Meditar sus obras y su Palabra","Recordar lo que Dios ha hecho y meditar sus mandamientos sostiene la fe en tiempos difíciles. Leer despacio un versículo y volver sobre él es una forma sencilla de meditación."],["Jonás desde el vientre del pez","En el lugar más oscuro, Jonás se acuerda del Señor y su oración llega hasta Él. Ningún lugar está demasiado lejos para orar."],["La oración del humilde atraviesa las nubes","El Eclesiástico enseña que la oración del humilde llega hasta Dios y no descansa hasta ser escuchada. La humildad es la puerta de toda oración verdadera."],["El Padrenuestro","Jesús enseña a orar en lo secreto, sin palabrería, y nos deja el Padrenuestro. Es la oración que la Iglesia reza en cada Divina Liturgia y que cabe en cualquier momento del día."],["Pedid y se os dará","Jesús anima a pedir, buscar y llamar con la confianza de un hijo. El Padre da el mejor de los regalos: el Espíritu Santo."],["Orar siempre, sin desfallecer","La viuda insistente enseña a orar sin cansarse, y San Pablo pide orar sin cesar. Los monjes ortodoxos lo viven repitiendo una oración breve a lo largo de todo el día."],["Ten piedad de mí, pecador","El publicano no se atreve a levantar los ojos y solo dice: «Dios, ten piedad de mí, pecador». De aquí nace la Oración de Jesús: «Señor Jesucristo, Hijo de Dios, ten piedad de mí»."],["Jesús se retira a orar","Antes del amanecer, en lugares solitarios o toda la noche en el monte: Jesús busca momentos a solas con el Padre. Si Él lo necesitaba, nosotros también."],["Getsemaní: hágase tu voluntad","En la mayor angustia, Jesús ora con total sinceridad y termina diciendo: «Hágase tu voluntad». Orar no es convencer a Dios, sino unirse a lo que Él quiere."],["María lo guardaba en su corazón","La Madre de Dios no lo entendía todo, pero lo guardaba y lo meditaba en su corazón. Es el modelo de la meditación cristiana: acoger la Palabra, guardarla y dejar que madure."],["La paz que sobrepasa todo entendimiento","Cuando no sabemos qué pedir, el Espíritu ora en nosotros. San Pablo invita a presentarlo todo a Dios con gratitud y a pensar en lo verdadero, lo bueno y lo bello: así llega la paz de Dios."]]},"en":{"rest":[["God rested on the seventh day","Rest is not laziness: it is part of creation. God finishes his work and blesses the seventh day. Stopping one day a week reminds us that the world does not depend on our effort alone."],["The Sabbath, made for man","Moses links rest with freedom: in Egypt slaves had no rest. Jesus sums it up by saying that the Sabbath was made for man. Rest is a gift we must also give to others."],["Rest for the land and the animals","The Law asks for rest for the ox, the donkey and the land too, which lies fallow every seventh year. God's care reaches all of creation, and ours should as well."],["Elijah: sleep, eat and go on","Exhausted, Elijah wants to give up. God does not reproach him: he lets him sleep, gives him bread and water, and only then sets him on his way again. Sometimes the most spiritual thing is to rest."],["Sleeping in peace","The psalmist sleeps calmly in the midst of danger because he knows he is cared for. Entrusting the day to God before sleeping is an ancient Christian custom that brings serenity to the night."],["God gives sleep to his beloved","Rising early and staying up late with anxiety adds nothing to what God builds. Ecclesiastes notes that the sleep of the worker is sweet: working in measure and trusting brings rest."],["Beside still waters","The Good Shepherd does not only guide: he also makes us lie down. Green pastures and quiet waters are the image of a soul that lets itself be cared for and regains its strength."],["In quietness and confidence","“Be still, and know that I am God.” Isaiah adds that our strength lies in quietness and confidence. Inner silence is a form of rest that life today greatly needs."],["Those who wait upon the Lord","God neither faints nor grows weary, and he gives power to the weary. Whoever waits on him renews his strength like the eagle. True rest begins by knowing on whom one depends."],["A time for everything","There is a time to work and a time to stop. Better is a handful with quietness than two hands full of toil: Ecclesiastes invites us to measure our effort and not to live only to produce."],["The healthy sleep of the moderate eater","Sirach links the table and sleep: whoever eats with moderation sleeps well and rises clear-headed. It is practical wisdom that the Orthodox tradition keeps in its balance between fasting and food."],["Come to me and I will give you rest","Jesus offers rest to the weary and burdened, not by removing every load but by sharing it: his yoke is easy. It is a rest of the soul that comes from meekness and humility."],["Come apart and rest a while","Jesus sees his disciples worn out and takes them to a quiet place. With Martha and Mary he teaches the same thing: among many tasks, only one thing is needed, to sit and listen to him."],["Jesus sleeps in the storm","While the wind shakes the boat, Jesus sleeps. His calm comes from trust in the Father. He calms the storm and asks his own: “Why are you afraid?”"],["The eternal rest","The Letter to the Hebrews speaks of a rest that still awaits the people of God, and Revelation of those who rest from their labours. Every Sunday is a foretaste of that final rest."]],"fast":[["Moses: forty days before God","Moses spends forty days without bread or water while receiving the Law. It is an extraordinary fast, not a model to imitate: it shows that fasting is born from the encounter with God and prepares us to listen to him."],["Afflicting the soul: the Day of Atonement","On the Day of Atonement the people “afflict their souls”, that is, they fast. It is a day of reconciliation: fasting accompanies the desire to begin again, clean before God."],["David fasts for his son","David fasts and prays while his son is ill. When the child dies, he gets up, washes and eats. Fasting is supplication and hope, but also acceptance of God's will."],["Fasting before the journey","Ezra proclaims a fast before a dangerous journey, and Nehemiah fasts and prays on hearing of Jerusalem's ruin. Before great decisions, fasting helps to place them in God's hands."],["Esther: three days for her people","Before risking her life before the king, Esther asks her people to fast with her. Fasting is also lived in community: not only for oneself, but for others."],["Prayer, fasting and almsgiving","Judith lives her widowhood in fasting and prayer, without ceasing to keep the feasts. Tobit sums up the tradition: prayer is good with fasting, almsgiving and righteousness. These are the three pillars the Church keeps in Lent."],["The fast that God wants","Isaiah denounces a fast that lives alongside injustice. The fast that pleases God is sharing bread with the hungry and setting the oppressed free. Without charity, fasting loses its meaning."],["Rend your hearts","Joel calls for conversion with fasting and weeping, rending the heart and not the garments. All Nineveh fasts and God has mercy. Fasting is a path of conversion."],["Did you fast for me?","God asks his people whether their fasts were truly for him. What he asks for is justice, mercy and not oppressing the weak, and he promises that the days of fasting will become days of joy."],["Daniel: fasting and prayer","Daniel seeks God with prayer and fasting, and on another occasion abstains for three weeks from rich food, meat and wine. It is a partial fast, very like the one the Orthodox tradition practises."],["Anna, night and day","The prophetess Anna serves God in the temple with fasting and prayer, and is among the first to recognise the Child Jesus. Persevering fasting sharpens the eyes of the heart."],["Jesus fasts in the desert","Before beginning his mission, Jesus fasts forty days and overcomes temptation with the Word: “Man shall not live by bread alone.” Great Lent imitates these forty days."],["Fasting in secret","Jesus takes it for granted that his disciples will fast, but asks them to do it without show, with a washed face. Fasting is something between the soul and the Father, who sees in secret."],["When the bridegroom is taken away","While Jesus is with them, his disciples do not fast; they will when he is taken from them. That is why the Church fasts on Fridays, the day of the Cross, and always joins fasting to prayer."],["The Church fasts and prays","The first Christian community fasts and prays before sending out Paul and Barnabas, and also when choosing its elders. Fasting accompanies the Church's important decisions."]],"pray":[["Meditating day and night","The righteous meditates on God's Word day and night, like a tree planted by the water. Meditating is not emptying the mind, but slowly filling it with what God has said."],["Hannah pours out her soul","Hannah prays in silence, moving only her lips, with a broken heart. The priest does not understand her, but God does. Sincere prayer does not need beautiful words."],["Solomon's prayer","Solomon recognises that not even the heavens can contain God, and yet he asks him to listen from the temple. Every prayer is a meeting between God's greatness and our smallness."],["The still small voice","God was not in the wind, nor in the earthquake, nor in the fire, but in a gentle whisper. To hear it we need silence: this is the heart of hesychast prayer in the Orthodox tradition."],["Morning and evening prayer","The psalmist prays at dawn and lifts up his prayer like incense at evening; Daniel prays three times a day. Praying at set hours gives shape to the day and lies at the root of the Church's prayer."],["Out of the depths","The soul thirsts for God as the deer for water, and cries from the depths, waiting for him more than watchmen for the morning. The Psalms teach us to pray even from sadness."],["My soul rests in silence","“My soul finds rest in God alone”, like a child in its mother's arms. Prayer does not always speak: sometimes it simply means being still before God."],["Meditating on his works and his Word","Remembering what God has done and meditating on his commandments sustains faith in hard times. Reading a verse slowly and returning to it is a simple form of meditation."],["Jonah in the belly of the fish","In the darkest place, Jonah remembers the Lord and his prayer reaches him. No place is too far away to pray."],["The prayer of the humble pierces the clouds","Sirach teaches that the prayer of the humble reaches God and does not rest until it is heard. Humility is the door to all true prayer."],["The Lord's Prayer","Jesus teaches us to pray in secret, without empty words, and leaves us the Our Father. It is the prayer the Church prays at every Divine Liturgy and that fits into any moment of the day."],["Ask and it will be given to you","Jesus encourages us to ask, seek and knock with the trust of a child. The Father gives the best of all gifts: the Holy Spirit."],["Pray always, without losing heart","The persistent widow teaches us to pray without growing weary, and Saint Paul asks us to pray without ceasing. Orthodox monks live this by repeating a short prayer throughout the day."],["Have mercy on me, a sinner","The tax collector does not dare to raise his eyes and only says: “God, have mercy on me, a sinner.” From this comes the Jesus Prayer: “Lord Jesus Christ, Son of God, have mercy on me.”"],["Jesus withdraws to pray","Before dawn, in lonely places or all night on the mountain: Jesus seeks time alone with the Father. If he needed it, so do we."],["Gethsemane: your will be done","In his greatest anguish, Jesus prays with complete sincerity and ends by saying: “Your will be done.” To pray is not to convince God, but to unite ourselves to what he wants."],["Mary kept it in her heart","The Mother of God did not understand everything, but she kept it and pondered it in her heart. She is the model of Christian meditation: welcoming the Word, keeping it and letting it ripen."],["The peace that passes all understanding","When we do not know what to ask for, the Spirit prays in us. Saint Paul invites us to bring everything to God with thanksgiving and to think about what is true, good and beautiful: this is how God's peace comes."]]},"pt":{"rest":[["Deus descansou no sétimo dia","O descanso não é preguiça: faz parte da criação. Deus termina a sua obra e abençoa o sétimo dia. Parar um dia por semana lembra-nos que o mundo não depende só do nosso esforço."],["O sábado, feito para o homem","Moisés une o descanso à liberdade: no Egito os escravos não descansavam. Jesus resume-o dizendo que o sábado foi feito para o homem. Descansar é um dom que também devemos dar aos outros."],["Descanso para a terra e os animais","A Lei pede descanso também para o boi, o jumento e a terra, que repousa a cada sete anos. O cuidado de Deus chega a toda a criação, e o nosso também deveria chegar."],["Elias: dormir, comer e seguir","Esgotado, Elias quer desistir. Deus não o repreende: deixa-o dormir, dá-lhe pão e água, e só depois o põe de novo a caminho. Às vezes o mais espiritual é descansar."],["Dormir em paz","O salmista dorme tranquilo no meio do perigo porque se sabe cuidado. Confiar o dia a Deus antes de dormir é um antigo costume cristão que traz serenidade à noite."],["Deus dá o sono aos seus amados","Madrugar e deitar tarde com ansiedade nada acrescenta ao que Deus constrói. O Eclesiastes observa que o sono do trabalhador é doce: trabalhar com medida e confiar traz descanso."],["Junto às águas tranquilas","O Bom Pastor não só guia: também faz descansar. Os pastos verdes e as águas calmas são a imagem de uma alma que se deixa cuidar e recupera as forças."],["Na quietude e na confiança","«Aquietai-vos e sabei que eu sou Deus». Isaías acrescenta que na quietude e na confiança está a nossa força. O silêncio interior é uma forma de descanso de que a vida de hoje muito precisa."],["Os que esperam no Senhor","Deus não se cansa nem se fatiga, e dá forças ao cansado. Quem espera n'Ele renova as forças como a águia. O verdadeiro descanso começa por saber de quem se depende."],["Um tempo para cada coisa","Há tempo de trabalhar e tempo de parar. Mais vale uma mão cheia com descanso do que duas cheias de fadiga: o Eclesiastes convida a medir o esforço e a não viver só para produzir."],["O sono saudável de quem come com moderação","O Eclesiástico une a mesa e o sono: quem come com moderação dorme bem e levanta-se desperto. É uma sabedoria prática que a tradição ortodoxa conserva no seu equilíbrio entre jejum e alimento."],["Vinde a mim e eu vos aliviarei","Jesus oferece descanso aos cansados e oprimidos, não tirando todo o peso, mas partilhando-o: o seu jugo é suave. É um descanso da alma que nasce da mansidão e da humildade."],["Vinde à parte e descansai um pouco","Jesus vê os discípulos esgotados e leva-os a um lugar tranquilo. Com Marta e Maria ensina o mesmo: entre muitas tarefas, só uma coisa é necessária, sentar-se a escutá-lo."],["Jesus dorme na tempestade","Enquanto o vento sacode o barco, Jesus dorme. A sua calma nasce da confiança no Pai. Acalma a tempestade e pergunta aos seus: «Porque tendes medo?»."],["O descanso eterno","A Carta aos Hebreus fala de um repouso que ainda espera o povo de Deus, e o Apocalipse, dos que descansam dos seus trabalhos. Cada domingo é uma antecipação desse descanso final."]],"fast":[["Moisés: quarenta dias diante de Deus","Moisés passa quarenta dias sem pão nem água enquanto recebe a Lei. É um jejum extraordinário, não um modelo a imitar: mostra que o jejum nasce do encontro com Deus e prepara para O escutar."],["Afligir a alma: o Dia da Expiação","No Dia da Expiação o povo «aflige a sua alma», isto é, jejua. É um dia de reconciliação: o jejum acompanha o desejo de recomeçar, limpo diante de Deus."],["David jejua pelo filho","David jejua e ora enquanto o filho está doente. Quando morre, levanta-se, lava-se e come. O jejum é súplica e esperança, mas também aceitação da vontade de Deus."],["Jejuar antes do caminho","Esdras proclama um jejum antes de uma viagem perigosa, e Neemias jejua e ora ao saber da ruína de Jerusalém. Diante das grandes decisões, o jejum ajuda a colocá-las nas mãos de Deus."],["Ester: três dias pelo seu povo","Antes de arriscar a vida diante do rei, Ester pede ao seu povo que jejue com ela. O jejum também se vive em comunidade: não só por si mesmo, mas pelos outros."],["Oração, jejum e esmola","Judite vive a viuvez em jejum e oração, sem deixar de celebrar as festas. Tobias resume a tradição: boa é a oração com jejum, esmola e justiça. São os três pilares que a Igreja mantém na Quaresma."],["O jejum que Deus quer","Isaías denuncia um jejum que convive com a injustiça. O jejum que agrada a Deus é partilhar o pão com o faminto e libertar o oprimido. Sem caridade, o jejum perde o sentido."],["Rasgai o vosso coração","Joel chama à conversão com jejum e choro, rasgando o coração e não as vestes. Nínive inteira jejua e Deus tem compaixão. O jejum é um caminho de conversão."],["Jejuastes para mim?","Deus pergunta ao seu povo se os seus jejuns eram mesmo para Ele. O que pede é justiça, misericórdia e não oprimir o fraco, e promete que os dias de jejum se tornarão dias de alegria."],["Daniel: jejum e oração","Daniel busca a Deus com oração e jejum e, noutra ocasião, abstém-se durante três semanas de iguarias, carne e vinho. É um jejum parcial, muito parecido com o que pratica a tradição ortodoxa."],["Ana, de noite e de dia","A profetisa Ana serve a Deus no templo com jejuns e orações, e é das primeiras a reconhecer o Menino Jesus. O jejum perseverante apura o olhar do coração."],["Jesus jejua no deserto","Antes de começar a sua missão, Jesus jejua quarenta dias e vence a tentação com a Palavra: «Nem só de pão vive o homem». A Grande Quaresma imita estes quarenta dias."],["Jejuar em segredo","Jesus dá por certo que os discípulos jejuarão, mas pede que o façam sem aparências, com o rosto lavado. O jejum é algo entre a alma e o Pai, que vê no segredo."],["Quando o noivo lhes for tirado","Enquanto Jesus está com eles, os discípulos não jejuam; fá-lo-ão quando lhes for tirado. Por isso a Igreja jejua às sextas-feiras, dia da Cruz, e une sempre o jejum à oração."],["A Igreja jejua e ora","A primeira comunidade cristã jejua e ora antes de enviar Paulo e Barnabé, e também ao escolher os seus presbíteros. O jejum acompanha as decisões importantes da Igreja."]],"pray":[["Meditar de dia e de noite","O justo medita a Palavra de Deus de dia e de noite, como árvore plantada junto à água. Meditar não é esvaziar a mente, mas enchê-la devagar do que Deus disse."],["Ana derrama a sua alma","Ana ora em silêncio, movendo só os lábios, com o coração partido. O sacerdote não a entende, mas Deus sim. A oração sincera não precisa de palavras bonitas."],["A oração de Salomão","Salomão reconhece que nem os céus podem conter Deus e, mesmo assim, pede-Lhe que escute desde o templo. Toda a oração é um encontro entre a grandeza de Deus e a nossa pequenez."],["A brisa suave","Deus não estava no vento, nem no terramoto, nem no fogo, mas num murmúrio suave. Para O ouvir é preciso silêncio: é o coração da oração hesicasta da tradição ortodoxa."],["Oração da manhã e da tarde","O salmista ora ao amanhecer e eleva a sua oração como incenso ao entardecer; Daniel ora três vezes ao dia. Rezar a horas fixas dá forma ao dia e está na raiz da oração da Igreja."],["Das profundezas","A alma tem sede de Deus como a corça da água, e clama das profundezas esperando-O mais do que as sentinelas a aurora. Os Salmos ensinam a orar também a partir da tristeza."],["A minha alma descansa em silêncio","«Só em Deus descansa a minha alma», como uma criança nos braços da mãe. A oração nem sempre fala: às vezes consiste apenas em estar em calma diante de Deus."],["Meditar as suas obras e a sua Palavra","Recordar o que Deus fez e meditar os seus mandamentos sustenta a fé nos tempos difíceis. Ler devagar um versículo e voltar a ele é uma forma simples de meditação."],["Jonas no ventre do peixe","No lugar mais escuro, Jonas lembra-se do Senhor e a sua oração chega até Ele. Nenhum lugar está longe demais para orar."],["A oração do humilde atravessa as nuvens","O Eclesiástico ensina que a oração do humilde chega até Deus e não descansa até ser ouvida. A humildade é a porta de toda a oração verdadeira."],["O Pai-Nosso","Jesus ensina a orar em segredo, sem palavreado, e deixa-nos o Pai-Nosso. É a oração que a Igreja reza em cada Divina Liturgia e que cabe em qualquer momento do dia."],["Pedi e dar-se-vos-á","Jesus anima a pedir, procurar e bater com a confiança de um filho. O Pai dá o melhor de todos os presentes: o Espírito Santo."],["Orar sempre, sem desfalecer","A viúva insistente ensina a orar sem se cansar, e São Paulo pede que oremos sem cessar. Os monges ortodoxos vivem-no repetindo uma oração breve ao longo de todo o dia."],["Tem piedade de mim, pecador","O publicano não se atreve a levantar os olhos e só diz: «Ó Deus, tem piedade de mim, pecador». Daqui nasce a Oração de Jesus: «Senhor Jesus Cristo, Filho de Deus, tem piedade de mim»."],["Jesus retira-se para orar","Antes do amanhecer, em lugares solitários ou a noite inteira no monte: Jesus procura momentos a sós com o Pai. Se Ele precisava, nós também."],["Getsémani: seja feita a tua vontade","Na maior angústia, Jesus ora com total sinceridade e termina dizendo: «Seja feita a tua vontade». Orar não é convencer a Deus, mas unir-se ao que Ele quer."],["Maria guardava tudo no coração","A Mãe de Deus não entendia tudo, mas guardava e meditava no seu coração. É o modelo da meditação cristã: acolher a Palavra, guardá-la e deixá-la amadurecer."],["A paz que excede todo o entendimento","Quando não sabemos o que pedir, o Espírito ora em nós. São Paulo convida a apresentar tudo a Deus com gratidão e a pensar no que é verdadeiro, bom e belo: assim chega a paz de Deus."]]},"fr":{"rest":[["Dieu se reposa le septième jour","Le repos n’est pas de la paresse : il fait partie de la création. Dieu achève son œuvre et bénit le septième jour. S’arrêter un jour par semaine nous rappelle que le monde ne dépend pas seulement de nos efforts."],["Le sabbat, fait pour l’homme","Moïse lie le repos à la liberté : en Égypte, les esclaves ne se reposaient pas. Jésus le résume en disant que le sabbat a été fait pour l’homme. Le repos est un don que nous devons aussi offrir aux autres."],["Le repos de la terre et des animaux","La Loi demande le repos aussi pour le bœuf, l’âne et la terre, qui se repose tous les sept ans. Le soin de Dieu atteint toute la création, et le nôtre devrait l’atteindre aussi."],["Élie : dormir, manger et repartir","Épuisé, Élie veut abandonner. Dieu ne lui reproche rien : il le laisse dormir, lui donne du pain et de l’eau, et seulement ensuite le remet en route. Parfois, le plus spirituel est de se reposer."],["Dormir en paix","Le psalmiste dort tranquille au milieu du danger, car il se sait gardé. Confier sa journée à Dieu avant de dormir est une ancienne coutume chrétienne qui apporte la sérénité à la nuit."],["Dieu donne le sommeil à ses bien-aimés","Se lever tôt et veiller tard dans l’angoisse n’ajoute rien à ce que Dieu construit. L’Ecclésiaste remarque que le sommeil du travailleur est doux : travailler avec mesure et avoir confiance donne le repos."],["Près des eaux paisibles","Le Bon Pasteur ne fait pas que guider : il fait aussi reposer. Les verts pâturages et les eaux calmes sont l’image d’une âme qui se laisse soigner et reprend des forces."],["Dans le calme et la confiance","« Arrêtez, et sachez que je suis Dieu. » Isaïe ajoute que notre force est dans le calme et la confiance. Le silence intérieur est une forme de repos dont la vie d’aujourd’hui a grand besoin."],["Ceux qui espèrent dans le Seigneur","Dieu ne se fatigue ni ne se lasse, et il donne de la force à celui qui est las. Qui espère en lui renouvelle ses forces comme l’aigle. Le vrai repos commence quand on sait de qui l’on dépend."],["Un temps pour chaque chose","Il y a un temps pour travailler et un temps pour s’arrêter. Mieux vaut une main pleine avec repos que deux mains pleines de fatigue : l’Ecclésiaste invite à mesurer l’effort et à ne pas vivre seulement pour produire."],["Le sommeil sain de celui qui mange avec mesure","Le Siracide unit la table et le sommeil : qui mange avec modération dort bien et se lève l’esprit clair. C’est une sagesse pratique que la tradition orthodoxe garde dans son équilibre entre jeûne et nourriture."],["Venez à moi, et je vous donnerai du repos","Jésus offre le repos aux fatigués et aux accablés, non en ôtant tout fardeau, mais en le partageant : son joug est doux. C’est un repos de l’âme qui naît de la douceur et de l’humilité."],["Venez à l’écart et reposez-vous un peu","Jésus voit ses disciples épuisés et les emmène dans un lieu tranquille. Avec Marthe et Marie, il enseigne la même chose : parmi tant de tâches, une seule chose est nécessaire, s’asseoir pour l’écouter."],["Jésus dort dans la tempête","Tandis que le vent secoue la barque, Jésus dort. Son calme naît de la confiance dans le Père. Il apaise la tempête et demande aux siens : « Pourquoi avez-vous peur ? »"],["Le repos éternel","L’Épître aux Hébreux parle d’un repos qui attend encore le peuple de Dieu, et l’Apocalypse de ceux qui se reposent de leurs travaux. Chaque dimanche est un avant-goût de ce repos final."]],"fast":[["Moïse : quarante jours devant Dieu","Moïse passe quarante jours sans pain ni eau tandis qu’il reçoit la Loi. C’est un jeûne extraordinaire, non un modèle à imiter : il montre que le jeûne naît de la rencontre avec Dieu et prépare à l’écouter."],["Humilier son âme : le Jour des Expiations","Le Jour des Expiations, le peuple « humilie son âme », c’est-à-dire qu’il jeûne. C’est un jour de réconciliation : le jeûne accompagne le désir de recommencer, purifié devant Dieu."],["David jeûne pour son fils","David jeûne et prie pendant que son fils est malade. Quand l’enfant meurt, il se lève, se lave et mange. Le jeûne est supplication et espérance, mais aussi acceptation de la volonté de Dieu."],["Jeûner avant le voyage","Esdras proclame un jeûne avant un voyage dangereux, et Néhémie jeûne et prie en apprenant la ruine de Jérusalem. Devant les grandes décisions, le jeûne aide à les remettre entre les mains de Dieu."],["Esther : trois jours pour son peuple","Avant de risquer sa vie devant le roi, Esther demande à son peuple de jeûner avec elle. Le jeûne se vit aussi en communauté : pas seulement pour soi, mais pour les autres."],["Prière, jeûne et aumône","Judith vit son veuvage dans le jeûne et la prière, sans cesser de célébrer les fêtes. Tobie résume la tradition : bonne est la prière avec le jeûne, l’aumône et la justice. Ce sont les trois piliers que l’Église garde pendant le Carême."],["Le jeûne que Dieu veut","Isaïe dénonce un jeûne qui cohabite avec l’injustice. Le jeûne qui plaît à Dieu, c’est partager son pain avec l’affamé et libérer l’opprimé. Sans charité, le jeûne perd son sens."],["Déchirez vos cœurs","Joël appelle à la conversion par le jeûne et les larmes, en déchirant le cœur et non les vêtements. Ninive tout entière jeûne et Dieu a pitié. Le jeûne est un chemin de conversion."],["Avez-vous jeûné pour moi ?","Dieu demande à son peuple si ses jeûnes étaient vraiment pour lui. Ce qu’il demande, c’est la justice, la miséricorde et de ne pas opprimer le faible, et il promet que les jours de jeûne deviendront des jours de joie."],["Daniel : jeûne et prière","Daniel cherche Dieu par la prière et le jeûne et, une autre fois, s’abstient pendant trois semaines de mets raffinés, de viande et de vin. C’est un jeûne partiel, très proche de celui que pratique la tradition orthodoxe."],["Anne, nuit et jour","La prophétesse Anne sert Dieu au temple par le jeûne et la prière, et elle est parmi les premières à reconnaître l’Enfant Jésus. Le jeûne persévérant affine le regard du cœur."],["Jésus jeûne au désert","Avant de commencer sa mission, Jésus jeûne quarante jours et vainc la tentation par la Parole : « L’homme ne vivra pas de pain seulement. » Le Grand Carême imite ces quarante jours."],["Jeûner dans le secret","Jésus considère comme acquis que ses disciples jeûneront, mais il demande de le faire sans ostentation, le visage lavé. Le jeûne se vit entre l’âme et le Père, qui voit dans le secret."],["Quand l’époux leur sera enlevé","Tant que Jésus est avec eux, ses disciples ne jeûnent pas ; ils jeûneront quand il leur sera enlevé. C’est pourquoi l’Église jeûne le vendredi, jour de la Croix, et unit toujours le jeûne à la prière."],["L’Église jeûne et prie","La première communauté chrétienne jeûne et prie avant d’envoyer Paul et Barnabé, et aussi pour choisir ses anciens. Le jeûne accompagne les décisions importantes de l’Église."]],"pray":[["Méditer jour et nuit","Le juste médite la Parole de Dieu jour et nuit, comme un arbre planté près de l’eau. Méditer, ce n’est pas vider l’esprit, mais le remplir lentement de ce que Dieu a dit."],["Anne répand son âme","Anne prie en silence, remuant seulement les lèvres, le cœur brisé. Le prêtre ne la comprend pas, mais Dieu, si. La prière sincère n’a pas besoin de belles paroles."],["La prière de Salomon","Salomon reconnaît que même les cieux ne peuvent contenir Dieu et, pourtant, il lui demande d’écouter depuis le temple. Toute prière est une rencontre entre la grandeur de Dieu et notre petitesse."],["Le murmure doux et léger","Dieu n’était ni dans le vent, ni dans le tremblement de terre, ni dans le feu, mais dans un doux murmure. Pour l’entendre, il faut le silence : c’est le cœur de la prière hésychaste de la tradition orthodoxe."],["Prière du matin et du soir","Le psalmiste prie à l’aube et élève sa prière comme l’encens le soir ; Daniel prie trois fois par jour. Prier à heures fixes donne forme à la journée et se trouve à la racine de la prière de l’Église."],["Du fond de l’abîme","L’âme a soif de Dieu comme la biche a soif d’eau, et elle crie du fond de l’abîme, l’attendant plus que les veilleurs l’aurore. Les Psaumes apprennent à prier même dans la tristesse."],["Mon âme repose en silence","« En Dieu seul mon âme se repose », comme un enfant dans les bras de sa mère. La prière ne parle pas toujours : parfois, elle consiste seulement à se tenir en paix devant Dieu."],["Méditer ses œuvres et sa Parole","Se souvenir de ce que Dieu a fait et méditer ses commandements soutient la foi dans les temps difficiles. Lire lentement un verset et y revenir est une forme simple de méditation."],["Jonas dans le ventre du poisson","Au lieu le plus sombre, Jonas se souvient du Seigneur et sa prière parvient jusqu’à lui. Aucun lieu n’est trop loin pour prier."],["La prière du humble traverse les nuées","Le Siracide enseigne que la prière du humble parvient jusqu’à Dieu et ne se repose pas avant d’être exaucée. L’humilité est la porte de toute vraie prière."],["Le Notre Père","Jésus apprend à prier dans le secret, sans rabâcher, et nous laisse le Notre Père. C’est la prière que l’Église dit à chaque Divine Liturgie et qui trouve place à tout moment de la journée."],["Demandez, et l’on vous donnera","Jésus encourage à demander, chercher et frapper avec la confiance d’un enfant. Le Père donne le plus beau des dons : l’Esprit Saint."],["Prier sans cesse, sans se décourager","La veuve insistante apprend à prier sans se lasser, et saint Paul demande de prier sans cesse. Les moines orthodoxes le vivent en répétant une courte prière tout au long du jour."],["Aie pitié de moi, pécheur","Le publicain n’ose pas lever les yeux et dit seulement : « Ô Dieu, aie pitié de moi, pécheur. » De là naît la Prière de Jésus : « Seigneur Jésus-Christ, Fils de Dieu, aie pitié de moi. »"],["Jésus se retire pour prier","Avant l’aube, dans des lieux déserts ou toute la nuit sur la montagne : Jésus cherche des moments seul avec le Père. S’il en avait besoin, nous aussi."],["Gethsémani : que ta volonté soit faite","Dans sa plus grande angoisse, Jésus prie en toute sincérité et finit par dire : « Que ta volonté soit faite. » Prier, ce n’est pas convaincre Dieu, mais s’unir à ce qu’il veut."],["Marie gardait tout dans son cœur","La Mère de Dieu ne comprenait pas tout, mais elle gardait et méditait tout dans son cœur. C’est le modèle de la méditation chrétienne : accueillir la Parole, la garder et la laisser mûrir."],["La paix qui surpasse toute intelligence","Quand nous ne savons que demander, l’Esprit prie en nous. Saint Paul invite à tout présenter à Dieu avec action de grâce et à penser à ce qui est vrai, bon et beau : ainsi vient la paix de Dieu."]]},"it":{"rest":[["Dio si riposò il settimo giorno","Il riposo non è pigrizia: fa parte della creazione. Dio porta a termine la sua opera e benedice il settimo giorno. Fermarsi un giorno alla settimana ci ricorda che il mondo non dipende solo dal nostro sforzo."],["Il sabato, fatto per l’uomo","Mosè unisce il riposo alla libertà: in Egitto gli schiavi non riposavano. Gesù lo riassume dicendo che il sabato è stato fatto per l’uomo. Riposare è un dono che dobbiamo fare anche agli altri."],["Riposo per la terra e gli animali","La Legge chiede riposo anche per il bue, l’asino e la terra, che riposa ogni sette anni. La cura di Dio arriva a tutta la creazione, e la nostra dovrebbe arrivarci anche."],["Elia: dormire, mangiare e ripartire","Sfinito, Elia vuole arrendersi. Dio non lo rimprovera: lo lascia dormire, gli dà pane e acqua, e solo dopo lo rimette in cammino. A volte la cosa più spirituale è riposare."],["Dormire in pace","Il salmista dorme tranquillo in mezzo al pericolo perché si sa custodito. Affidare la giornata a Dio prima di dormire è un’antica usanza cristiana che porta serenità alla notte."],["Dio dà il sonno ai suoi amati","Alzarsi presto e coricarsi tardi nell’ansia non aggiunge nulla a ciò che Dio costruisce. Il Qoèlet osserva che il sonno del lavoratore è dolce: lavorare con misura e fidarsi dona riposo."],["Ad acque tranquille","Il Buon Pastore non solo guida: fa anche riposare. I pascoli erbosi e le acque tranquille sono l’immagine di un’anima che si lascia curare e riprende forza."],["Nella calma e nella fiducia","«Fermatevi e sappiate che io sono Dio». Isaia aggiunge che nella calma e nella fiducia sta la nostra forza. Il silenzio interiore è una forma di riposo di cui la vita di oggi ha molto bisogno."],["Quelli che sperano nel Signore","Dio non si stanca né si affatica, e dà forza allo stanco. Chi spera in lui riacquista forza come l’aquila. Il vero riposo comincia dal sapere da chi si dipende."],["Un tempo per ogni cosa","C’è un tempo per lavorare e un tempo per fermarsi. Meglio una manciata con riposo che due piene di fatica: il Qoèlet invita a misurare lo sforzo e a non vivere solo per produrre."],["Il sonno sano di chi mangia con misura","Il Siracide unisce la tavola e il sonno: chi mangia con moderazione dorme bene e si alza lucido. È una saggezza pratica che la tradizione ortodossa conserva nel suo equilibrio tra digiuno e cibo."],["Venite a me e io vi darò ristoro","Gesù offre riposo agli stanchi e agli oppressi, non togliendo ogni peso, ma condividendolo: il suo giogo è dolce. È un riposo dell’anima che nasce dalla mitezza e dall’umiltà."],["Venite in disparte e riposatevi un po’","Gesù vede i discepoli sfiniti e li porta in un luogo tranquillo. Con Marta e Maria insegna la stessa cosa: tra tante faccende, una sola cosa è necessaria, sedersi ad ascoltarlo."],["Gesù dorme nella tempesta","Mentre il vento scuote la barca, Gesù dorme. La sua calma nasce dalla fiducia nel Padre. Calma la tempesta e chiede ai suoi: «Perché avete paura?»."],["Il riposo eterno","La Lettera agli Ebrei parla di un riposo che attende ancora il popolo di Dio, e l’Apocalisse di coloro che riposano dalle loro fatiche. Ogni domenica è un anticipo di quel riposo finale."]],"fast":[["Mosè: quaranta giorni davanti a Dio","Mosè passa quaranta giorni senza pane né acqua mentre riceve la Legge. È un digiuno straordinario, non un modello da imitare: mostra che il digiuno nasce dall’incontro con Dio e prepara ad ascoltarlo."],["Mortificare l’anima: il Giorno dell’Espiazione","Nel Giorno dell’Espiazione il popolo «mortifica la sua anima», cioè digiuna. È un giorno di riconciliazione: il digiuno accompagna il desiderio di ricominciare, puri davanti a Dio."],["Davide digiuna per suo figlio","Davide digiuna e prega mentre suo figlio è malato. Quando muore, si alza, si lava e mangia. Il digiuno è supplica e speranza, ma anche accettazione della volontà di Dio."],["Digiunare prima del cammino","Esdra proclama un digiuno prima di un viaggio pericoloso, e Neemia digiuna e prega quando viene a sapere della rovina di Gerusalemme. Davanti alle grandi decisioni, il digiuno aiuta a metterle nelle mani di Dio."],["Ester: tre giorni per il suo popolo","Prima di rischiare la vita davanti al re, Ester chiede al suo popolo di digiunare con lei. Il digiuno si vive anche in comunità: non solo per sé, ma per gli altri."],["Preghiera, digiuno ed elemosina","Giuditta vive la vedovanza nel digiuno e nella preghiera, senza smettere di celebrare le feste. Tobia riassume la tradizione: buona è la preghiera con il digiuno, l’elemosina e la giustizia. Sono i tre pilastri che la Chiesa mantiene in Quaresima."],["Il digiuno che Dio vuole","Isaia denuncia un digiuno che convive con l’ingiustizia. Il digiuno che piace a Dio è dividere il pane con l’affamato e liberare l’oppresso. Senza carità, il digiuno perde il suo senso."],["Laceratevi il cuore","Gioele chiama alla conversione con digiuno e pianto, lacerando il cuore e non le vesti. Tutta Ninive digiuna e Dio ha compassione. Il digiuno è un cammino di conversione."],["Avete digiunato per me?","Dio chiede al suo popolo se i suoi digiuni erano davvero per lui. Ciò che chiede è giustizia, misericordia e non opprimere il debole, e promette che i giorni di digiuno diventeranno giorni di gioia."],["Daniele: digiuno e preghiera","Daniele cerca Dio con la preghiera e il digiuno e, in un’altra occasione, si astiene per tre settimane da cibi prelibati, carne e vino. È un digiuno parziale, molto simile a quello che pratica la tradizione ortodossa."],["Anna, notte e
